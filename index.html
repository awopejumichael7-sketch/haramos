      <div class="card stat-card"><div class="lbl">Paid</div><div class="val" style="font-size:16px">${money(adv.amountPaid)}</div></div>
      <div class="card stat-card"><div class="lbl">Balance</div><div class="val" style="font-size:16px">${money(adv.balance)}</div></div>
      <div class="card stat-card"><div class="lbl">Store Credit</div><div class="val" style="font-size:16px">${money(adv.creditBalance)}</div></div>
    </div>
    ${owedForCollected>0.009 ? `<div class="pay-detail-note" style="background:var(--danger-light);color:var(--danger);border-radius:8px;padding:9px 12px;margin-bottom:14px">
      ⚠️ Customer has collected <b>${money(owedForCollected)}</b> worth of goods beyond what they've paid for. This has been automatically recorded as a debt in <b>Credit & Advance → Credit Sales (Debtors)</b>.</div>` : ""}
    <div class="section-head" style="margin-top:10px"><h3 style="font-size:13.5px">Reserved Products</h3>
      <button class="btn btn-ghost btn-sm" id="advAddRow">+ Add product</button></div>
    <div id="advRows">${adv.products.map(rowHtml).join("")}</div>
    <div class="cart-row total" style="margin-top:4px"><span>${isManual?"Total Value of Goods":"Reserved goods value (at list price)"}</span><span id="advGoodsValueDisplay">₦0.00</span></div>
    ${isManual
      ? `<p style="font-size:11px;color:var(--ink-soft);margin-top:4px">Calculated automatically from each product's exact price × quantity above.</p>`
      : `<div class="field" style="margin-top:8px"><label>Actual Sale Total (used for balance/credit)</label><input type="number" id="advTotal" min="0" value="${adv.total!==null&&adv.total!==undefined?adv.total:''}" placeholder="Leave blank if unknown" ${can("editCreditRecords")?"":"readonly style=\"background:var(--line)\""}>
      <p style="font-size:11px;color:var(--ink-soft);margin-top:4px">${can("editCreditRecords")?"This came from the original sale and may include a discount or tax, so it can differ from the list-price value above. It updates automatically to reflect any product you add, remove, or resize — type an exact figure here only if you need to override that.":"🔒 Only an Admin can type an exact override here — it still updates automatically to reflect any product you add, remove, or resize."}</p></div>`}
    <p style="font-size:11.5px;color:var(--ink-soft);margin-top:4px">If a customer collects more product value than they've paid for, the shortfall is automatically moved into the Credit & Advance debtors ledger when you hit Save.</p>
    <div class="field" style="margin-top:12px"><label>Additional Payment Now (optional)</label><input type="number" id="advExtraPay" min="0" value="0">
      <p style="font-size:11.5px;color:var(--ink-soft);margin-top:4px">You can pay more than the outstanding balance — any excess is added to Store Credit.</p></div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">Close</button>
  <button class="btn btn-gold" onclick="viewAdvanceReceipt('${adv.id}')">🧾 Receipt</button>
  <button class="btn btn-primary" id="advSave">Save</button></div>`, {lg:true});

  const rowsHost = document.getElementById("advRows");
  // Recomputes one row's displayed unit price/line total, then the overall
  // "goods value" figure shown just under the products list.
  const updateGoodsValue = ()=>{
    const grand = [...rowsHost.children].reduce((sum,r)=> sum + (+r.dataset.lineTotal||0), 0);
    document.getElementById("advGoodsValueDisplay").textContent = money(grand);
  };
  const updateRowTotal = (row)=>{
    const existingIdx = +row.dataset.idx;
    const productName = row.querySelector(".advProdSel").value;
    const unit = row.querySelector(".advUnitSel").value;
    const qty = Math.max(0, +row.querySelector(".advResQty").value||0);
    const unitPrice = rowUnitPrice(productName, unit, existingIdx);
    const lineTotal = unitPrice * qty;
    row.dataset.lineTotal = lineTotal;
    row.querySelector(".advUnitPrice").textContent = `@ ${money(unitPrice)}`;
    row.querySelector(".advLineTotal").textContent = money(lineTotal);
    updateGoodsValue();
  };
  const wireRow = (row)=>{
    const prodSel = row.querySelector(".advProdSel"), unitSel = row.querySelector(".advUnitSel"), qtyInput = row.querySelector(".advResQty");
    prodSel.addEventListener("change", ()=>{
      const p = state.products.find(x=>x.name===prodSel.value);
      unitSel.innerHTML = sellableUnits(p).map(u=>`<option>${u.unit}</option>`).join("");
      updateRowTotal(row);
    });
    unitSel.addEventListener("change", ()=>updateRowTotal(row));
    qtyInput.addEventListener("input", ()=>updateRowTotal(row));
    row.querySelector(".advRemRow").addEventListener("click", ()=>{ if(!row.querySelector(".advRemRow").disabled){ row.remove(); updateGoodsValue(); } });
    row.dataset.lineTotal = rowUnitPrice(prodSel.value, unitSel.value, +row.dataset.idx) * (+qtyInput.value||0);
  };
  [...rowsHost.children].forEach(wireRow);
  updateGoodsValue();
  document.getElementById("advAddRow").addEventListener("click", ()=>{
    if(!state.products.length) return toast("Add a product first","warn");
    const div = document.createElement("div");
    div.innerHTML = rowHtml({productName:state.products[0].name, reserved:1, unit:sellableUnits(state.products[0])[0]?.unit||"", collected:0}, -1);
    const row = div.firstElementChild;
    rowsHost.appendChild(row); wireRow(row); updateGoodsValue();
  });

  document.getElementById("advSave").onclick = async ()=>{
    const priorProducts = adv.products; // snapshot for the stock reconciliation below
    const seenIdx = new Set();
    const mappedRows = [...rowsHost.children].map(row=>{
      const reserved = Math.max(0, +row.querySelector(".advResQty").value||0);
      const collectNow = Math.max(0, +row.querySelector(".advCollectNow").value||0);
      const existingIdx = +row.dataset.idx;
      if(existingIdx>=0) seenIdx.add(existingIdx);
      const priorCollected = existingIdx>=0 ? priorProducts[existingIdx].collected : 0;
      const collected = Math.min(reserved, priorCollected + collectNow);
      const productName = row.querySelector(".advProdSel").value;
      const unit = row.querySelector(".advUnitSel").value;
      // keep the price recorded when this product was originally reserved
      // (e.g. the actual sale price) unless the product/unit was changed,
      // in which case fall back to the current catalogue price
      const prior = existingIdx>=0 ? priorProducts[existingIdx] : null;
      let unitPrice = (prior && prior.productName===productName && prior.unit===unit && prior.unitPrice!=null) ? prior.unitPrice : null;
      if(unitPrice==null){
        const product = state.products.find(x=>x.name===productName);
        unitPrice = product ? unitPriceFor(product, unit) : 0;
      }
      return { productName, unit, reserved, collected, unitPrice, __priorIdx: existingIdx };
    });
    const newProducts = mappedRows.filter(p=>p.reserved>0);
    if(!newProducts.length) return toast("Keep at least one reserved product","err");

    // Reconcile physical stock against any change in reserved quantities.
    // A Sales-screen Advance Payment already deducts stock the moment it's
    // created; editing the reservation here (increasing/decreasing a
    // quantity, removing a product, or swapping a row to a different
    // product) must keep that in sync, otherwise stock counts would
    // silently drift every time an advance is edited.
    const stockOps = [];
    for(const p of mappedRows){
      const prior = p.__priorIdx>=0 ? priorProducts[p.__priorIdx] : null;
      if(prior && prior.productName!==p.productName){
        // The row was switched to a different product entirely — this is
        // not a quantity change on the same item, so diffing the two
        // quantities against each other would be meaningless. Treat it as
        // fully releasing the old product's reservation and separately
        // reserving the newly-selected product, exactly like deleting the
        // old row and adding a fresh one.
        const oldOutstanding = Math.max(0, (prior.reserved||0) - (prior.collected||0));
        if(oldOutstanding>0){
          const oldProduct = state.products.find(x=>x.name===prior.productName);
          if(oldProduct) stockOps.push({ product:oldProduct, stockQty: stockDeductionFor(oldProduct, prior.unit, oldOutstanding), sign:1, type:"Advance row changed (restock old product)" });
        }
        if(p.reserved>0){
          const newProduct = state.products.find(x=>x.name===p.productName);
          if(newProduct){
            const stockQty = stockDeductionFor(newProduct, p.unit, p.reserved);
            if(stockQty > newProduct.currentStock + 1e-9){
              toast(`Not enough stock for ${newProduct.name}. Available: ${fmtQty(newProduct.currentStock)} ${newProduct.stockUnit}`, "err");
              return;
            }
            stockOps.push({ product:newProduct, stockQty, sign:-1, type:"Advance row changed (reserve new product)" });
          }
        }
        continue;
      }
      const priorReserved = prior ? prior.reserved : 0;
      const deltaQty = p.reserved - priorReserved; // >0 needs more stock reserved, <0 releases stock
      if(Math.abs(deltaQty) < 1e-9) continue;
      const product = state.products.find(x=>x.name===p.productName);
      if(!product) continue;
      const stockQty = stockDeductionFor(product, p.unit, Math.abs(deltaQty));
      if(deltaQty>0 && stockQty > product.currentStock + 1e-9){
        toast(`Not enough stock for ${product.name} to reserve the extra quantity. Available: ${fmtQty(product.currentStock)} ${product.stockUnit}`, "err");
        return;
      }
      stockOps.push({ product, stockQty, sign: deltaQty>0 ? -1 : 1, type: deltaQty>0 ? "Advance reserved (extra)" : "Advance reservation reduced" });
    }
    // Rows removed entirely from the modal release whatever was still
    // outstanding on them — the remove button is disabled once anything on
    // that row has been collected, so the full reserved amount is always
    // still physically held back and safe to return in one piece.
    for(let i=0;i<priorProducts.length;i++){
      if(seenIdx.has(i)) continue;
      const p = priorProducts[i];
      const outstanding = Math.max(0, (p.reserved||0)-(p.collected||0));
      if(outstanding<=0) continue;
      const product = state.products.find(x=>x.name===p.productName);
      if(!product) continue;
      stockOps.push({ product, stockQty: stockDeductionFor(product, p.unit, outstanding), sign:1, type:"Advance row removed (restock)" });
    }
    for(const op of stockOps){
      op.product.currentStock = +(op.product.currentStock + op.sign*op.stockQty).toFixed(4);
      await dataSet("products", op.product);
      await dataSet("stockHistory", { id:genId("stk"), productId:op.product.id, productName:op.product.name,
        type:op.type, change:op.sign*op.stockQty, reference:adv.receiptNumber, createdAt:Date.now(), by:state.user.name });
    }

    adv.products = newProducts.map(({__priorIdx, ...rest})=>rest);

    // For manual advances, the Total Value is never typed — it's always
    // the exact sum of each reserved product's price × quantity, matching
    // the live figure shown in the modal above. For advances that came
    // from an actual sale, the original discount/tax-adjusted total is
    // preserved, but it must still track any real change in the reserved
    // goods — otherwise adding, removing, or resizing a product here would
    // silently leave the sale total (and therefore balance/credit) out of
    // sync with what's actually reserved, as happened before this fix.
    if(isManual){
      adv.total = +(adv.products.reduce((sum,p)=>sum + p.unitPrice*p.reserved, 0).toFixed(2));
    } else {
      const priorGoodsValue = priorProducts.reduce((sum,p)=>sum+(p.unitPrice||0)*(p.reserved||0), 0);
      const newGoodsValue = adv.products.reduce((sum,p)=>sum+(p.unitPrice||0)*(p.reserved||0), 0);
      const goodsDelta = +(newGoodsValue-priorGoodsValue).toFixed(2);
      let adminOverrode = false;
      if(can("editCreditRecords")){
        const totalInput = document.getElementById("advTotal").value;
        const typedVal = totalInput ? Math.max(0, +totalInput) : null;
        if(typedVal !== originalTotal){
          // The Admin actively retyped the figure — trust it exactly as
          // entered, since only they can know the real discount/tax.
          adv.total = typedVal;
          adminOverrode = true;
        }
      }
      if(!adminOverrode){
        if(originalTotal!=null) adv.total = +(originalTotal + goodsDelta).toFixed(2);
        else if(Math.abs(goodsDelta)>0.009) adv.total = +newGoodsValue.toFixed(2);
      }
    }

    const extra = Math.max(0, +document.getElementById("advExtraPay").value||0);
    if(extra>0){
      if(adv.balance>0){
        const towardBalance = Math.min(adv.balance, extra);
        adv.balance -= towardBalance;
        adv.creditBalance += (extra-towardBalance);
      } else {
        adv.creditBalance += extra;
      }
      adv.amountPaid += extra;
    }
    // if total was edited, recompute balance/credit against the new total
    if(adv.total!==null){
      const net = adv.total - adv.amountPaid;
      adv.balance = Math.max(0, net);
      adv.creditBalance = Math.max(0, -net);
    }

    const allCollected = adv.products.every(p=>p.collected >= p.reserved-1e-9);
    const anyCollected = adv.products.some(p=>p.collected>0);
    adv.collectionStatus = allCollected ? "Fully Collected" : anyCollected ? "Partially Collected" : "Not Collected";
    await dataSet("advancePayments", adv);
    const owedBefore = state.debts.find(d=>d.advanceId===adv.id)?.balance || 0;
    await syncAdvanceDebt(adv);
    const owedAfter = state.debts.find(d=>d.advanceId===adv.id)?.balance || 0;
    closeModal();
    const restocked = stockOps.filter(op=>op.sign>0);
    const restockMsg = restocked.length
      ? ` Returned to stock: ${restocked.map(op=>`${fmtQty(op.stockQty)} ${op.product.stockUnit} ${op.product.name}`).join(", ")}.`
      : "";
    if(owedAfter>0.009 && owedAfter!==owedBefore){
      toast(`Advance payment updated — ${money(owedAfter)} owed for collected goods moved to Debtors.${restockMsg}`, "warn");
    } else {
      toast(`Advance payment updated.${restockMsg}`, "ok");
    }
    drawCreditTab("advances");
  };
};

/* ------------------------------------------------------------------
   19B. CUSTOMER ACCOUNTS — running debit account, instalment
        repayments, payment receipts and printable statements

   WHY THIS EXISTS
   Every credit sale is stored as its own `debts` record. That is
   correct and is left completely untouched — but it means a customer
   who keeps buying on credit shows up as several unrelated rows with
   no combined balance. This section adds the missing customer-level
   view on top of those same records:

     • ONE account per customer = the sum of every open debt, so a new
       credit purchase automatically adds to what they already owe.
     • A dated ledger (debit / credit / running balance) rebuilt from
       the existing records — old data works immediately, nothing to
       migrate, no new database collection.
     • "Receive Payment" at customer level: a part-payment is spread
       across their unpaid receipts (oldest first, or a receipt you
       pick) using the same per-record bookkeeping the Debtors tab
       already uses, so Sales History, reports, the dashboard and the
       existing "Add Payment" button all stay consistent.
     • A numbered PAYMENT RECEIPT for each repayment and a printable
       STATEMENT OF ACCOUNT the customer can keep as evidence.

   HOW BALANCES STAY TRUSTWORTHY
   The outstanding balance is always Σ(balance) of the customer's
   debt records — the same numbers the rest of the app shows. Each
   record's original charge is derived as (balance + everything
   credited to it), so the ledger's running balance always ends
   exactly on that figure, whichever screen a payment came from.
------------------------------------------------------------------ */
const ACCT_EPS = 0.009;
const acctR2 = n => Math.round(((Number(n)||0) + Number.EPSILON) * 100) / 100;
function acctDay(ts){ return new Date(ts).toLocaleDateString("en-NG",{day:"2-digit",month:"short",year:"numeric"}); }
function acctPdfMoney(n){ return money(n).replace(/₦/g,"NGN "); } // jsPDF's built-in fonts have no ₦ glyph
// UI state that survives redraws of the tab (search box / filter)
const acctUi = { q:"", filter:"owing" };

/* ---------- 1. Grouping & ledger engine ---------- */
function acctKeyOf(d){
  return d.customerId ? "id:"+d.customerId : "name:"+String(d.customerName||"").trim().toLowerCase();
}
function acctDebtsFor(key){ return state.debts.filter(d=>acctKeyOf(d)===key); }
function acctItemsSummary(sale){
  if(!sale || !Array.isArray(sale.items) || !sale.items.length) return "";
  const parts = sale.items.map(i=>`${fmtQty(i.qtySold)} ${i.unit||""} ${i.productName||""}`.replace(/\s+/g," ").trim());
  return parts.length>3 ? parts.slice(0,3).join("; ")+` +${parts.length-3} more` : parts.join("; ");
}

/* Builds the complete account for one customer: ledger entries with a
   running balance, totals, and the list of still-unpaid receipts. */
function acctBuildLedger(key){
  const debts = acctDebtsFor(key);
  const raw = []; let seq = 0;
  const info = {}; // per-debt figures used by the "unpaid receipts" tables

  debts.forEach(d=>{
    const hist = Array.isArray(d.history) ? d.history : [];
    let credited = hist.reduce((s,h)=>s+(+h.amount||0),0);
    let charge = acctR2((+d.balance||0) + credited);
    // Older records may show a larger original total than balance + history explains
    // (a payment made before payments were logged). Show that gap honestly as an
    // earlier payment instead of quietly under-reporting the credit taken.
    // (Advance-linked debts are skipped: their total is re-derived and shrinks as they are paid.)
    const priorPaid = (!d.advanceId && (+d.total||0) > charge + ACCT_EPS) ? acctR2((+d.total||0) - charge) : 0;
    if(priorPaid > ACCT_EPS){ charge = acctR2(charge + priorPaid); credited += priorPaid; }
    const sale = d.saleId ? state.sales.find(s=>s.id===d.saleId) : null;
    info[d.id] = { charge, credited:acctR2(credited), balance:acctR2(+d.balance||0), date:d.createdAt||0,
                   dueDate:d.dueDate||null, receipt:d.receiptNumber||"" };

    if(charge > ACCT_EPS){
      let desc, detail = "";
      if(d.advanceId){ desc = `Goods collected beyond advance paid (Advance ${d.receiptNumber||""})`.trim(); }
      else if(sale){ desc = "Credit sale"; detail = acctItemsSummary(sale); }
      else { desc = "Credit / debt recorded"; detail = d.notes || ""; }
      raw.push({ seq:seq++, type:"charge", date:d.createdAt||0, ref:d.receiptNumber||"", debtId:d.id,
                 debit:charge, credit:0, desc, detail });
    }
    let bal = charge;
    if(priorPaid > ACCT_EPS){
      bal = acctR2(bal - priorPaid);
      raw.push({ seq:seq++, type:"deposit", date:d.createdAt||0, debtId:d.id, debit:0, credit:priorPaid, by:"", method:"",
                 debtRef:d.receiptNumber||"", debtBalAfter:Math.max(0,bal), ref:d.receiptNumber||"", desc:"Paid earlier (before payment history was logged)" });
    }
    hist.forEach((h,idx)=>{
      const amt = acctR2(h.amount);
      if(!(amt > ACCT_EPS)) return;              // the 0-amount "opening" entry on sales with nothing paid up-front
      bal = acctR2(bal - amt);
      const base = { seq:seq++, date:h.date||d.createdAt||0, debtId:d.id, debit:0, credit:amt,
                     by:h.by||"", method:h.method||"", debtRef:d.receiptNumber||"", debtBalAfter:Math.max(0,bal) };
      if(h.writeOff)      raw.push({ ...base, type:"writeoff", ref:d.receiptNumber||"", desc:"Balance written off (uncollectible)" });
      else if(h.ref)      raw.push({ ...base, type:"payment", ref:h.ref, note:h.note||"", desc:`Payment received${h.method?" — "+h.method:""}` });
      else if(h.note)     raw.push({ ...base, type:"adjustment", ref:d.receiptNumber||"", desc:h.note });
      else if(idx===0 && !h.method && !d.advanceId)
                          raw.push({ ...base, type:"deposit", ref:d.receiptNumber||"", desc: d.saleId ? "Paid at time of sale" : "Part payment when recorded" });
      else                raw.push({ ...base, type:"payment", ref:d.receiptNumber||"", legacy:true, desc:`Payment received${h.method?" — "+h.method:""}` });
    });
  });

  // One customer payment can be spread over several receipts — show it as ONE ledger line.
  const merged = []; const byRef = new Map();
  raw.forEach(e=>{
    if(e.type==="payment" && !e.legacy && e.ref){
      let m = byRef.get(e.ref);
      if(!m){ m = { ...e, credit:0, applied:[] }; byRef.set(e.ref, m); merged.push(m); }
      m.credit = acctR2(m.credit + e.credit);
      m.applied.push({ receipt:e.debtRef, amount:e.credit, balanceAfter:e.debtBalAfter });
      m.seq = Math.min(m.seq, e.seq);
    } else merged.push(e);
  });
  merged.sort((a,b)=> (a.date-b.date) || ((a.type==="charge"?0:1)-(b.type==="charge"?0:1)) || (a.seq-b.seq));
  let run = 0;
  merged.forEach(e=>{ run = acctR2(run + e.debit - e.credit); e.balance = run; });

  const totals = { charged:0, paid:0, adjusted:0, writtenOff:0 };
  merged.forEach(e=>{
    if(e.type==="charge") totals.charged += e.debit;
    else if(e.type==="payment" || e.type==="deposit") totals.paid += e.credit;
    else if(e.type==="writeoff") totals.writtenOff += e.credit;
    else totals.adjusted += e.credit;
  });
  Object.keys(totals).forEach(k=> totals[k] = acctR2(totals[k]));

  const open = debts.filter(d=>(+d.balance||0) > ACCT_EPS).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const outstanding = acctR2(debts.reduce((s,d)=>s+Math.max(0,+d.balance||0),0));
  const cust = key.startsWith("id:") ? state.customers.find(c=>c.id===key.slice(3)) : null;
  const newest = debts.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0] || {};
  const payDates = merged.filter(e=>e.type==="payment").map(e=>e.date);
  return {
    key, name: (cust && cust.name) || newest.customerName || "Customer",
    phone: (cust && cust.phone) || debts.map(d=>d.phone).find(Boolean) || "",
    entries: merged, totals, outstanding, open, info,
    overdue: open.some(isDebtOverdue),
    oldestOpenAt: open.length ? (open[0].createdAt||0) : null,
    lastPaymentAt: payDates.length ? Math.max(...payDates) : null,
    creditCount: debts.filter(d=>info[d.id].charge > ACCT_EPS).length
  };
}
function acctAll(){
  return [...new Set(state.debts.map(acctKeyOf))].map(acctBuildLedger);
}

/* Statement model — shared by the on-screen ledger, the printout and the PDF
   so all three always agree. Handles an optional date range with a
   "balance brought forward" so a partial statement still reconciles. */
function acctStatementModel(acct, range={}){
  const from = range.from ?? null, to = range.to ?? null;
  let opening = 0; const rows = [];
  for(const e of acct.entries){
    if(from!=null && e.date < from){ opening = e.balance; continue; }
    if(to!=null && e.date > to) continue;
    rows.push(e);
  }
  const debits = acctR2(rows.reduce((s,e)=>s+e.debit,0));
  const credits = acctR2(rows.reduce((s,e)=>s+e.credit,0));
  const label = (from!=null && to!=null) ? `${acctDay(from)} – ${acctDay(to)}`
              : from!=null ? `From ${acctDay(from)}` : to!=null ? `Up to ${acctDay(to)}` : "All transactions";
  return { rows, opening:acctR2(opening), debits, credits, closing:acctR2(opening+debits-credits), from, to, label, isFull:(from==null&&to==null) };
}

/* ---------- 2. Payment allocation & posting ---------- */
/* Pure planner (also drives the live preview). `target` is "fifo"
   (oldest receipt first) or the id of one specific debt. */
function acctPlanAllocation(openDebts, amount, target){
  let left = acctR2(amount); const plan = [];
  const ordered = (target && target!=="fifo") ? openDebts.filter(d=>d.id===target) : openDebts;
  for(const d of ordered){
    if(left <= ACCT_EPS) break;
    const bal = acctR2(d.balance);
    const applied = acctR2(Math.min(bal, left));
    plan.push({ debt:d, before:bal, applied, after:acctR2(bal-applied) });
    left = acctR2(left - applied);
  }
  return { plan, unapplied:left };
}
function acctNewPaymentRef(){
  const d = new Date();
  const stamp = String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  const used = new Set();
  state.debts.forEach(x=>(x.history||[]).forEach(h=>{ if(h.ref) used.add(h.ref); }));
  let ref;
  do{ ref = `PMT-${stamp}-${Math.random().toString(36).slice(2,8).toUpperCase()}`; }while(used.has(ref));
  return ref;
}
/* Posts one customer payment. For every receipt it touches, this does
   exactly what the Debtors tab's own "Add Payment" does (history entry,
   `payments` row of type "debt", linked-sale sync, advance re-sync) —
   plus a shared payment reference so the pieces read as one payment. */
async function acctApplyPayment(key, amount, method, opts={}){
  const acct = acctBuildLedger(key);
  const { plan, unapplied } = acctPlanAllocation(acct.open, amount, opts.target);
  if(!plan.length || unapplied > ACCT_EPS) throw new Error("The amount is more than the balance owed.");
  const ref = acctNewPaymentRef(), date = Date.now(), note = (opts.note||"").trim();

  for(const step of plan){
    const debt = step.debt, amt = step.applied;
    const entry = { amount:amt, date, method, by:state.user.name, ref };
    if(note) entry.note = note;
    debt.history = debt.history || [];
    if(debt.advanceId){
      // Mirrors recordDebtPayment(): this debt is the shortfall on an Advance
      // Payment, so the money is credited to the advance and the debt's
      // balance re-derived from it (never both — that would count it twice).
      debt.history.push(entry);
      const adv = state.advances.find(a=>a.id===debt.advanceId);
      if(adv){
        adv.amountPaid = acctR2(adv.amountPaid + amt);
        await dataSet("advancePayments", adv);
        await syncAdvanceDebt(adv);
      } else {
        debt.amountPaid = acctR2(debt.amountPaid + amt); debt.balance = acctR2(debt.balance - amt);
        await dataSet("debts", debt);
      }
    } else {
      debt.amountPaid = acctR2(debt.amountPaid + amt);
      debt.balance = acctR2(debt.balance - amt);
      debt.history.push(entry);
      await dataSet("debts", debt);
    }
    await dataSet("payments", { id:genId("pay"), type:"debt", debtId:debt.id, receiptNumber:debt.receiptNumber, method,
      amount:amt, createdAt:date, by:state.user.name, paymentRef:ref, customerId:debt.customerId||null });
    if(debt.saleId){
      const linkedSale = state.sales.find(s=>s.id===debt.saleId);
      if(linkedSale){
        linkedSale.amountPaid = debt.amountPaid;
        linkedSale.balance = debt.balance;
        linkedSale.status = debt.balance<=0.009 ? "Paid" : "Partial/Owing";
        await dataSet("sales", linkedSale);
        await dataSet("receipts", { id:linkedSale.id, ...linkedSale });
        const rxIdx = state.receipts.findIndex(r=>r.id===linkedSale.id);
        if(rxIdx>-1) state.receipts[rxIdx] = { id:linkedSale.id, ...linkedSale };
      }
    }
  }
  return ref;
}
/* Everything a payment receipt needs, read back from the ledger — so the
   receipt shown right after saving and any later reprint are identical. */
function acctPaymentReceiptData(key, ref){
  const acct = acctBuildLedger(key);
  const e = acct.entries.find(x=>x.type==="payment" && !x.legacy && x.ref===ref);
  if(!e) return null;
  return { key, ref, date:e.date, method:e.method, by:e.by, note:e.note||"", amount:e.credit,
    applied:e.applied || [], customerName:acct.name, phone:acct.phone,
    balanceAfter:e.balance, balanceBefore:acctR2(e.balance + e.credit), outstandingNow:acct.outstanding };
}

/* ---------- 3. Customer Accounts tab ---------- */
function acctRefreshTab(){ if(document.getElementById("acctRows")) drawCreditTab("accounts"); }

function drawCustomerAccountsTab(body){
  const all = acctAll();
  const owing = all.filter(a=>a.outstanding > ACCT_EPS);
  const totalOwed = acctR2(owing.reduce((s,a)=>s+a.outstanding,0));
  const now = new Date(); const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const collected = acctR2(all.reduce((s,a)=>s + a.entries.filter(e=>e.type==="payment" && e.date>=monthStart).reduce((x,e)=>x+e.credit,0), 0));
  const cards = [
    { lbl:"Customers Owing", val:owing.length, ic:"👥", bg:"var(--danger-light)", fg:"var(--danger)" },
    { lbl:"Total Outstanding", val:money(totalOwed), ic:"📕", bg:"var(--danger-light)", fg:"var(--danger)" },
    { lbl:"Overdue Accounts", val:owing.filter(a=>a.overdue).length, ic:"⏰", bg:"var(--warn-light)", fg:"var(--warn)" },
    { lbl:"Repayments This Month", val:money(collected), ic:"💰", bg:"var(--ok-light)", fg:"var(--ok)" },
  ];
  body.innerHTML = `
  <div class="grid grid-4" style="margin-bottom:16px">${cards.map(c=>`
    <div class="card stat-card"><div class="top"><div class="ic" style="background:${c.bg};color:${c.fg}">${c.ic}</div></div>
    <div class="val">${c.val}</div><div class="lbl">${c.lbl}</div></div>`).join("")}</div>
  <div class="card"><div class="section-head">
    <div><h3>Customer Accounts</h3><p>One running account per customer — every credit purchase adds to what they owe, every repayment reduces it.</p></div>
    <div class="toolbar">
      <div class="searchbox"><input id="acctSearch" placeholder="Search customer or phone…" value="${escapeHtml(acctUi.q)}"></div>
      <select id="acctFilter" style="padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)">
        <option value="owing">Owing only</option><option value="all">All accounts</option><option value="cleared">Fully paid</option></select>
    </div></div>
    <div class="table-wrap"><table><thead><tr>
      <th>Customer</th><th>Phone</th><th>Credit Taken</th><th>Paid</th><th>Outstanding</th><th>Oldest Unpaid</th><th>Last Repayment</th><th>Status</th><th></th>
    </tr></thead><tbody id="acctRows"></tbody></table></div></div>`;
  document.getElementById("acctFilter").value = acctUi.filter;

  const renderRows = ()=>{
    const q = acctUi.q.toLowerCase().trim();
    let rows = all.filter(a=>{
      if(q && !(a.name.toLowerCase().includes(q) || (a.phone||"").toLowerCase().includes(q))) return false;
      if(acctUi.filter==="owing") return a.outstanding > ACCT_EPS;
      if(acctUi.filter==="cleared") return a.outstanding <= ACCT_EPS;
      return true;
    });
    rows.sort((a,b)=> (b.outstanding-a.outstanding) || a.name.localeCompare(b.name));
    document.getElementById("acctRows").innerHTML = rows.length ? rows.map(a=>{
      const owes = a.outstanding > ACCT_EPS;
      const age = a.oldestOpenAt ? Math.max(0, Math.floor((Date.now()-a.oldestOpenAt)/86400000)) : null;
      const pill = !owes ? `<span class="pill pill-ok">Fully paid</span>` : a.overdue ? `<span class="pill pill-danger">Overdue</span>` : `<span class="pill pill-warn">Owing</span>`;
      return `<tr>
        <td><b>${escapeHtml(a.name)}</b><div class="acct-cell-sub">${a.creditCount} credit purchase${a.creditCount===1?"":"s"}</div></td>
        <td>${escapeHtml(a.phone||"—")}</td>
        <td>${money(a.totals.charged)}</td><td>${money(a.totals.paid + a.totals.adjusted)}</td>
        <td class="${owes?"acct-dr":"acct-cr"}">${money(a.outstanding)}</td>
        <td>${owes && age!==null ? `${age} day${age===1?"":"s"}<div class="acct-cell-sub">${acctDay(a.oldestOpenAt)}</div>` : "—"}</td>
        <td>${a.lastPaymentAt ? acctDay(a.lastPaymentAt) : "—"}</td>
        <td>${pill}</td>
        <td class="row-actions">
          <button class="icon-sm" title="View account &amp; ledger" data-act="view" data-key="${escapeHtml(a.key)}">📒</button>
          <button class="icon-sm" title="Print statement" data-act="stmt" data-key="${escapeHtml(a.key)}">🖨️</button>
          <button class="btn btn-sm btn-primary" style="white-space:nowrap" data-act="pay" data-key="${escapeHtml(a.key)}" ${owes?"":"disabled"}>Receive Payment</button>
        </td></tr>`;
    }).join("") : `<tr><td colspan="9"><div class="empty-state"><div class="ic">📒</div>${all.length ? "No accounts match this view" : "No credit accounts yet — they appear here as soon as a customer buys on credit"}</div></td></tr>`;
  };
  document.getElementById("acctSearch").addEventListener("input", e=>{ acctUi.q = e.target.value; renderRows(); });
  document.getElementById("acctFilter").addEventListener("change", e=>{ acctUi.filter = e.target.value; renderRows(); });
  document.getElementById("acctRows").addEventListener("click", e=>{
    const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
    const key = b.dataset.key;
    if(b.dataset.act==="view") acctOpenAccount(key);
    else if(b.dataset.act==="stmt") acctShowStatement(key, {}, null);
    else if(b.dataset.act==="pay") acctOpenPayment(key);
  });
  renderRows();
}

/* ---------- 4. Account view (unpaid receipts + full ledger) ---------- */
function acctOpenAccount(key, range={}){
  const acct = acctBuildLedger(key);
  if(!acct.entries.length && !state.debts.some(d=>acctKeyOf(d)===key)){ toast("Account not found","err"); return; }
  const m = acctStatementModel(acct, range);
  const owes = acct.outstanding > ACCT_EPS;
  const dateVal = ts => ts==null ? "" : new Date(ts).toISOString().slice(0,10);
  const rowsDesc = m.rows.slice().reverse(); // newest first on screen; printouts stay oldest-first

  const openTable = owes ? `
    <h4 style="margin:4px 0 8px;font-size:13px">Unpaid receipts <span style="font-weight:400;color:var(--ink-soft)">— payments clear the oldest first</span></h4>
    <div class="table-wrap" style="margin-bottom:14px"><table><thead><tr><th>Receipt#</th><th>Date</th><th>Original</th><th>Paid</th><th>Balance</th><th>Age</th><th></th></tr></thead><tbody>
    ${acct.open.map(d=>{ const i = acct.info[d.id]; const age = Math.max(0,Math.floor((Date.now()-i.date)/86400000));
      const od = isDebtOverdue(d);
      return `<tr><td class="mono">${escapeHtml(i.receipt)}</td><td>${acctDay(i.date)}</td><td>${money(i.charge)}</td><td>${money(i.credited)}</td>
      <td class="acct-dr">${money(i.balance)}</td><td>${age}d${od?` <span class="pill pill-danger" style="font-size:10px">Overdue</span>`:""}</td>
      <td><button class="btn btn-sm btn-ghost" data-pay-one="${escapeHtml(d.id)}">Pay this</button></td></tr>`; }).join("")}
    </tbody></table></div>` : "";

  const ledgerRows = rowsDesc.map(e=>{
    const canReprint = e.type==="payment" && !e.legacy;
    const act = canReprint ? `<button class="icon-sm" title="Payment receipt" data-reprint="${escapeHtml(e.ref)}">🧾</button>`
              : e.type==="charge" ? `<button class="icon-sm" title="Original receipt" data-debt-receipt="${escapeHtml(e.debtId)}">🧾</button>` : "";
    return `<tr><td>${acctDay(e.date)}</td><td class="mono">${escapeHtml(e.ref)}</td>
      <td>${escapeHtml(e.desc)}${e.detail?`<div class="acct-cell-sub">${escapeHtml(e.detail)}</div>`:""}${e.applied&&e.applied.length>0?`<div class="acct-cell-sub">Applied to: ${e.applied.map(a=>escapeHtml(a.receipt)+" ("+money(a.amount)+")").join(", ")}</div>`:""}${e.note?`<div class="acct-cell-sub">Note: ${escapeHtml(e.note)}</div>`:""}</td>
      <td class="acct-dr">${e.debit?money(e.debit):""}</td><td class="acct-cr">${e.credit?money(e.credit):""}</td>
      <td class="acct-bal">${money(e.balance)}</td><td>${act}</td></tr>`;
  }).join("");
  const openingRow = (m.from!=null && Math.abs(m.opening)>ACCT_EPS) ? `<tr style="background:var(--bg)"><td colspan="5"><i>Balance brought forward (before ${acctDay(m.from)})</i></td><td class="acct-bal">${money(m.opening)}</td><td></td></tr>` : "";

  openModal(`
  <div class="modal-head"><h3>📒 ${escapeHtml(acct.name)}${acct.phone?` <span style="font-weight:400;font-size:13px;color:var(--ink-soft)">· ${escapeHtml(acct.phone)}</span>`:""}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="grid grid-3" style="margin-bottom:14px">
      <div class="card stat-card"><div class="lbl">Total Credit Taken</div><div class="val" style="font-size:17px">${money(acct.totals.charged)}</div></div>
      <div class="card stat-card"><div class="lbl">Total Repaid</div><div class="val" style="font-size:17px">${money(acct.totals.paid + acct.totals.adjusted)}</div></div>
      <div class="card stat-card" style="${owes?"border-color:var(--danger)":"border-color:var(--ok)"}"><div class="lbl">Outstanding Balance</div><div class="val" style="font-size:17px;color:${owes?"var(--danger)":"var(--ok)"}">${money(acct.outstanding)}</div></div>
    </div>
    ${acct.totals.writtenOff>ACCT_EPS?`<p style="font-size:12px;color:var(--ink-soft);margin:-4px 0 12px">Written off as uncollectible: <b>${money(acct.totals.writtenOff)}</b></p>`:""}
    ${owes ? "" : `<div class="acct-callout ok" style="font-size:13px">✅ This account is fully settled — nothing owed.</div>`}
    ${openTable}
    <h4 style="margin:4px 0 4px;font-size:13px">Account ledger <span style="font-weight:400;color:var(--ink-soft)">(newest first)</span></h4>
    <div class="acct-range">
      <div class="field"><label>From</label><input type="date" id="acctFrom" value="${dateVal(range.from)}"></div>
      <div class="field"><label>To</label><input type="date" id="acctTo" value="${dateVal(range.to)}"></div>
      <button class="btn btn-sm btn-ghost" id="acctApplyRange">Apply</button>
      ${(range.from!=null||range.to!=null)?`<button class="btn btn-sm btn-ghost" id="acctClearRange">Show all</button>`:""}
    </div>
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>Ref</th><th>Description</th><th>Debit</th><th>Credit</th><th>Balance</th><th></th></tr></thead>
    <tbody>${ledgerRows || `<tr><td colspan="7"><div class="empty-state" style="padding:24px">No transactions in this period</div></td></tr>`}${openingRow}</tbody></table></div>
    <p style="font-size:11.5px;color:var(--ink-soft);margin-top:8px"><b>Debit</b> = goods taken on credit (adds to the balance). <b>Credit</b> = money paid (reduces it).</p>
  </div>
  <div class="modal-foot">
    <button class="btn btn-ghost" onclick="window.__closeModal()">Close</button>
    <button class="btn btn-gold" id="acctStmtBtn">🖨️ Statement</button>
    <button class="btn btn-primary" id="acctPayBtn" ${owes?"":"disabled"}>💳 Receive Payment</button>
  </div>`, {lg:true});

  const $ = id => document.getElementById(id);
  const readRange = ()=>({
    from: $("acctFrom").value ? new Date($("acctFrom").value+"T00:00:00").getTime() : null,
    to:   $("acctTo").value   ? new Date($("acctTo").value+"T23:59:59.999").getTime() : null });
  $("acctApplyRange").onclick = ()=>{
    const r = readRange();
    if(r.from!=null && r.to!=null && r.from>r.to){ toast("'From' date must be before 'To' date","err"); return; }
    acctOpenAccount(key, r);
  };
  if($("acctClearRange")) $("acctClearRange").onclick = ()=> acctOpenAccount(key, {});
  // The range is captured at click time: these buttons replace the modal, so
  // the date inputs no longer exist by the time "Back to account" is pressed.
  const backHere = ()=>{ const r = readRange(); return ()=>acctOpenAccount(key, r); };
  $("acctStmtBtn").onclick = ()=> { const r = readRange(); acctShowStatement(key, r, ()=>acctOpenAccount(key, r)); };
  $("acctPayBtn").onclick = ()=> acctOpenPayment(key, {}, backHere());
  document.querySelectorAll("[data-pay-one]").forEach(b=> b.onclick = ()=> acctOpenPayment(key, { target:b.dataset.payOne }, backHere()));
  document.querySelectorAll("[data-reprint]").forEach(b=> b.onclick = ()=>{
    const data = acctPaymentReceiptData(key, b.dataset.reprint);
    if(data) acctShowPaymentReceipt(data, backHere());
  });
  document.querySelectorAll("[data-debt-receipt]").forEach(b=> b.onclick = ()=> window.viewDebtReceipt(b.dataset.debtReceipt));
}

/* ---------- 5. Receive Payment ---------- */
function acctOpenPayment(key, opts={}, onBack){
  const acct = acctBuildLedger(key);
  if(acct.outstanding <= ACCT_EPS){ toast("This account has no outstanding balance.","warn"); return; }
  const back = onBack || (()=>closeModal());
  openModal(`
  <div class="modal-head"><h3>💳 Receive Payment — ${escapeHtml(acct.name)}</h3><button class="close-x" id="payX">✕</button></div>
  <div class="modal-body">
    <div class="grid grid-2" style="margin-bottom:12px">
      <div class="card stat-card"><div class="lbl">Total Outstanding</div><div class="val" style="font-size:18px;color:var(--danger)">${money(acct.outstanding)}</div></div>
      <div class="card stat-card"><div class="lbl">Unpaid Receipts</div><div class="val" style="font-size:18px">${acct.open.length}</div></div>
    </div>
    <div class="form-grid">
      <div class="field"><label>Amount Received</label><input type="number" id="payAmt" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
        <button class="btn btn-sm btn-ghost" id="payFull" style="margin-top:6px">Pay full balance</button></div>
      <div class="field"><label>Payment Method</label><select id="payMethod">${PAYMENT_METHODS_STANDARD.map(x=>`<option>${x}</option>`).join("")}</select></div>
      <div class="field"><label>Apply To</label><select id="payTarget"><option value="fifo">Oldest receipt first (recommended)</option>
        ${acct.open.map(d=>`<option value="${escapeHtml(d.id)}">${escapeHtml(d.receiptNumber)} — owes ${money(d.balance)}</option>`).join("")}</select></div>
      <div class="field"><label>Note (optional)</label><input id="payNote" placeholder="e.g. paid by wife, transfer ref…"></div>
    </div>
    <div id="payPreview"></div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" id="payBack">Cancel</button>
    <button class="btn btn-primary" id="paySave" disabled>Record Payment</button></div>`, {lg:true, dismissable:false});

  const $ = id => document.getElementById(id);
  if(opts.target) $("payTarget").value = opts.target;
  const maxFor = ()=>{ const t = $("payTarget").value; return t==="fifo" ? acct.outstanding : acctR2((acct.open.find(d=>d.id===t)||{}).balance||0); };
  const update = ()=>{
    const amt = acctR2(+$("payAmt").value||0), max = maxFor();
    const { plan } = acctPlanAllocation(acct.open, Math.min(amt,max), $("payTarget").value);
    const over = amt > max + ACCT_EPS;
    const remaining = acctR2(acct.outstanding - Math.min(amt,max));
    $("paySave").disabled = !(amt > ACCT_EPS) || over;
    $("payPreview").innerHTML = amt>ACCT_EPS ? `
      ${over?`<div class="acct-callout" style="font-size:12.5px">⚠️ That is more than the ${$("payTarget").value==="fifo"?"customer owes":"balance on this receipt"} (<b>${money(max)}</b>). Enter ${money(max)} or less.</div>`:""}
      <h4 style="margin:6px 0 6px;font-size:13px">How this payment will be applied</h4>
      <div class="table-wrap"><table><thead><tr><th>Receipt#</th><th>Balance Before</th><th>Applied</th><th>Balance After</th></tr></thead><tbody>
      ${plan.map(p=>`<tr><td class="mono">${escapeHtml(p.debt.receiptNumber)}</td><td>${money(p.before)}</td><td class="acct-cr">${money(p.applied)}</td><td>${p.after<=ACCT_EPS?`<span class="pill pill-ok">Cleared</span>`:money(p.after)}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="cart-row total" style="margin-top:6px"><span>Balance remaining after this payment</span><span style="${remaining<=ACCT_EPS?"color:var(--ok)":"color:var(--danger)"}">${money(remaining)}</span></div>`
      : `<p class="pay-detail-note" style="margin-top:8px">Enter the amount the customer is paying now. A part-payment is fine — the rest stays on their account and can be paid gradually.</p>`;
  };
  ["input","change"].forEach(ev=>{ $("payAmt").addEventListener(ev,update); $("payTarget").addEventListener(ev,update); });
  $("payFull").onclick = ()=>{ $("payAmt").value = maxFor().toFixed(2); update(); };
  const goBack = ()=>{ closeModal(); back(); };
  $("payX").onclick = goBack; $("payBack").onclick = goBack;
  $("paySave").onclick = async ()=>{
    const btn = $("paySave"); if(btn.disabled) return;
    btn.disabled = true; btn.textContent = "Saving…";
    try{
      const ref = await acctApplyPayment(key, +$("payAmt").value, $("payMethod").value, { target:$("payTarget").value, note:$("payNote").value });
      closeModal(); acctRefreshTab(); toast("Payment recorded","ok");
      const data = acctPaymentReceiptData(key, ref);
      if(data) acctShowPaymentReceipt(data, onBack || null);
    }catch(err){
      console.error(err); toast("Could not record payment: "+(err.message||err),"err");
      acctRefreshTab(); btn.disabled = false; btn.textContent = "Record Payment";
    }
  };
  $("payAmt").focus(); update();
}

      </div>
      <h4>Payment applied to</h4>
      <table><thead><tr><th>Receipt#</th><th class="num">Amount Applied</th><th class="num">Left on this receipt</th></tr></thead><tbody>
      ${p.applied.map(a=>`<tr><td>${escapeHtml(a.receipt)}</td><td class="num">${money(a.amount)}</td><td class="num">${a.balanceAfter<=ACCT_EPS?"Cleared":money(a.balanceAfter)}</td></tr>`).join("")}
      </tbody></table>
      ${p.note?`<div class="stmt-note"><b>Note:</b> ${escapeHtml(p.note)}</div>`:""}
      <div class="stmt-note">${p.balanceAfter<=ACCT_EPS?"✔ This payment settles the customer's account in full.":"This is a part-payment. The balance above remains payable."}</div>
      <div class="stmt-code"><svg class="acct-barcode"></svg><span class="acct-qr"></span></div>
      <div class="stmt-sign"><div>Customer's signature</div><div>Received by (${escapeHtml(p.by||"staff")})</div></div>
      <div class="stmt-foot">${escapeHtml(s.footer||"Thank you for shopping with us!")}<br>This receipt is proof of payment. Please keep it safely.</div>
    </div>`;
  }
  return `<div class="receipt ${layout}" id="acctDocRoot">
    ${acctStoreHeaderThermal()}<hr>
    <div class="r-center"><b style="font-size:14px">PAYMENT RECEIPT</b></div>
    <div class="r-row"><span>Receipt#</span><span>${escapeHtml(p.ref)}</span></div>
    <div class="r-row"><span>Date</span><span>${fmtDate(p.date)}</span></div>
    <div class="r-row"><span>Customer</span><span>${escapeHtml(p.customerName)}</span></div>
    <div class="r-row"><span>Received by</span><span>${escapeHtml(p.by||"—")}</span></div>
    <div class="r-row"><span>Method</span><span>${escapeHtml(p.method||"—")}</span></div>
    <hr>
    <div class="r-center" style="font-weight:700">Applied To</div>
    ${p.applied.map(a=>`<div class="r-row"><span>${escapeHtml(a.receipt)}</span><span>${money(a.amount)}</span></div>`).join("")}
    <hr>
    <div class="r-row"><span>Previous Balance</span><span>${money(p.balanceBefore)}</span></div>
    <div class="r-row" style="font-weight:700;font-size:1.1em"><span>AMOUNT PAID</span><span>${money(p.amount)}</span></div>
    <div class="r-row" style="font-weight:700"><span>BALANCE REMAINING</span><span>${money(p.balanceAfter)}</span></div>
    ${p.balanceAfter<=ACCT_EPS?`<div class="r-center" style="margin-top:4px"><b>*** ACCOUNT FULLY SETTLED ***</b></div>`:""}
    ${p.note?`<div style="margin-top:4px;font-size:.9em">Note: ${escapeHtml(p.note)}</div>`:""}
    <hr>
    <div class="r-center"><svg class="acct-barcode"></svg></div>
    <div class="r-center acct-qr" style="margin-top:6px"></div>
    <hr>
    <div class="r-center">${escapeHtml(s.footer||"Thank you for shopping with us!")}<br><span style="font-size:.85em">Keep this receipt as proof of payment.</span></div>
  </div>`;
}

  if(layout==="wA4"){
    const openRows = acct.open.map(d=>{ const i = acct.info[d.id]; const age = Math.max(0,Math.floor((Date.now()-i.date)/86400000));
      return `<tr><td>${escapeHtml(i.receipt)}</td><td>${acctDay(i.date)}</td><td class="num">${money(i.charge)}</td><td class="num">${money(i.credited)}</td><td class="num dr">${money(i.balance)}</td><td class="num">${age} day${age===1?"":"s"}</td></tr>`; }).join("");
    return `<div class="stmt" id="acctDocRoot">
      ${acctStoreHeaderA4(`<h2>STATEMENT OF ACCOUNT</h2><div>Statement date: ${acctDay(Date.now())}</div><div>Period: ${escapeHtml(m.label)}</div>`)}
      <div class="stmt-info">
        <div><div class="lbl">Customer</div><div class="val">${escapeHtml(acct.name)}</div>${acct.phone?`<div class="stmt-sm">${escapeHtml(acct.phone)}</div>`:""}</div>
        <div style="text-align:right"><div class="lbl">Account status</div><span class="stmt-badge ${settled?"settled":"due"}">${settled?"FULLY PAID":"BALANCE DUE"}</span></div>
      </div>
      <div class="stmt-sum">
        <div><div class="k">Opening balance</div><div class="v">${money(m.opening)}</div></div>

        <div><div class="k">Payments (credit)</div><div class="v">${money(m.credits)}</div></div>
        <div class="${m.closing<=ACCT_EPS?"settled":"due"}"><div class="k">Closing balance</div><div class="v">${money(m.closing)}</div></div>
      </div>
      <table><thead><tr><th>Date</th><th>Ref</th><th>Description</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody>
        ${(m.from!=null && Math.abs(m.opening)>ACCT_EPS)?`<tr class="open-row"><td colspan="5">Balance brought forward</td><td class="num">${money(m.opening)}</td></tr>`:""}
        ${m.rows.map(e=>`<tr><td>${acctDay(e.date)}</td><td>${escapeHtml(e.ref)}</td>
          <td>${escapeHtml(e.desc)}${e.detail?`<div class="sub">${escapeHtml(e.detail)}</div>`:""}${e.applied&&e.applied.length>0?`<div class="sub">Applied to: ${e.applied.map(a=>escapeHtml(a.receipt)).join(", ")}</div>`:""}</td>
          <td class="num dr">${e.debit?money(e.debit):""}</td><td class="num cr">${e.credit?money(e.credit):""}</td><td class="num"><b>${money(e.balance)}</b></td></tr>`).join("") || `<tr><td colspan="6" style="text-align:center;color:#777;padding:14px">No transactions in this period</td></tr>`}
        <tr class="total-row"><td colspan="3">Totals for period</td><td class="num">${money(m.debits)}</td><td class="num">${money(m.credits)}</td><td class="num">${money(m.closing)}</td></tr>
      </tbody></table>
      <div class="stmt-due"><span class="k">${m.isFull||m.to==null?"Total amount due":"Balance as at "+acctDay(m.to)}</span><span class="v">${money(m.isFull||m.to==null?acct.outstanding:m.closing)}</span></div>
      ${(m.isFull||m.to==null) && openRows ? `<h4>Unpaid receipts making up this balance</h4>
        <table><thead><tr><th>Receipt#</th><th>Date</th><th class="num">Original</th><th class="num">Paid</th><th class="num">Balance</th><th class="num">Age</th></tr></thead><tbody>${openRows}</tbody></table>` : ""}
      <div class="stmt-note">Please settle any outstanding balance promptly. Payments are acknowledged with a numbered payment receipt. If any entry above looks incorrect, please tell us immediately.</div>
      <div class="stmt-sign"><div>Customer's signature &amp; date</div><div>Authorised by</div></div>
      <div class="stmt-foot">${escapeHtml(s.name||"")} · ${escapeHtml(s.phone||"")}<br>Generated ${fmtDate(Date.now())} by ${escapeHtml(state.user?state.user.name:"staff")}</div>
    </div>`;
  }
  // compact thermal statement
  return `<div class="receipt ${layout}" id="acctDocRoot">
    ${acctStoreHeaderThermal()}<hr>
    <div class="r-center"><b style="font-size:14px">STATEMENT OF ACCOUNT</b></div>
    <div class="r-row"><span>Customer</span><span>${escapeHtml(acct.name)}</span></div>
    ${acct.phone?`<div class="r-row"><span>Phone</span><span>${escapeHtml(acct.phone)}</span></div>`:""}
    <div class="r-row"><span>Date</span><span>${acctDay(Date.now())}</span></div>
    <div class="r-row"><span>Period</span><span>${escapeHtml(m.label)}</span></div>
    <hr>
    ${(m.from!=null && Math.abs(m.opening)>ACCT_EPS)?`<div class="r-row"><i>Brought forward</i><span>${money(m.opening)}</span></div>`:""}
    ${m.rows.map(e=>`<div style="margin-bottom:5px"><div class="r-row"><span>${acctDay(e.date)}</span><span>${escapeHtml(e.ref)}</span></div>
      <div style="font-size:.92em">${escapeHtml(e.desc)}</div>
      <div class="r-row"><span>${e.debit?"Debit "+money(e.debit):"Credit "+money(e.credit)}</span><span><b>Bal ${money(e.balance)}</b></span></div></div>`).join("") || `<div class="r-center">No transactions</div>`}
    <hr>
    <div class="r-row"><span>Credit taken</span><span>${money(m.debits)}</span></div>
    <div class="r-row"><span>Payments</span><span>${money(m.credits)}</span></div>
    <div class="r-row" style="font-weight:700;font-size:1.1em"><span>${settled?"BALANCE":"BALANCE DUE"}</span><span>${money(m.closing)}</span></div>
    ${settled?`<div class="r-center"><b>*** FULLY PAID ***</b></div>`:""}
    <hr><div class="r-center">${escapeHtml(s.footer||"Thank you for shopping with us!")}</div>
  </div>`;
}

/* Adds barcode / QR to a rendered payment receipt (skipped quietly if the
   CDN libraries aren't available, e.g. first load while offline). */
function acctDecorate(host, ref){
  if(!ref) return;
  const bc = host.querySelector(".acct-barcode");
  if(bc){ try{ JsBarcode(bc, ref, { width:1.3, height:32, fontSize:10, displayValue:true, format:"CODE128" }); }catch(e){} }
  const qr = host.querySelector(".acct-qr");
  if(qr){ try{ const canvas = document.createElement("canvas"); qr.appendChild(canvas); QRCode.toCanvas(canvas, ref, { width:84, margin:1 }); }catch(e){} }
}
function acctPrintHTML(build, layout, ref){
  const area = document.getElementById("printArea");
  area.innerHTML = (layout==="wA4" ? `<style>@page{size:A4;margin:12mm}</style>` : "") + build(layout);
  area.style.display = "block";
  acctDecorate(area, ref);
  setTimeout(()=>{ window.print(); area.style.display="none"; area.innerHTML=""; }, 250);
}
/* Shared viewer: layout switch + Print + PDF, same look as the existing receipt viewer. */
function acctDocModal(cfg){
  let layout = cfg.layout;
  const draw = ()=>{
    openModal(`
    <div class="modal-head"><h3>${cfg.title}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
    <div class="modal-body" style="background:var(--bg)">
      <div class="toolbar" style="justify-content:center;margin-bottom:14px">
        ${cfg.layouts.map(l=>`<button class="btn btn-sm ${layout===l.id?"btn-primary":"btn-ghost"}" data-lay="${l.id}">${l.label}</button>`).join("")}</div>
      <div style="display:flex;justify-content:center;overflow:auto">${cfg.build(layout)}</div>
    </div>
    <div class="modal-foot">
      ${cfg.onBack ? `<button class="btn btn-ghost" id="acctDocBack">← Back to account</button>` : `<button class="btn btn-ghost" onclick="window.__closeModal()">Close</button>`}
      <button class="btn btn-gold" id="acctDocPdf">⬇️ Download PDF</button>
      <button class="btn btn-primary" id="acctDocPrint">🖨️ Print</button>
    </div>`, {lg:true});
    acctDecorate(document.getElementById("modalHost"), cfg.ref);
    document.querySelectorAll("[data-lay]").forEach(b=> b.addEventListener("click", ()=>{ layout = b.dataset.lay; draw(); }));
    if(cfg.onBack) document.getElementById("acctDocBack").onclick = ()=>{ closeModal(); cfg.onBack(); };
    document.getElementById("acctDocPdf").onclick = ()=> cfg.pdf(layout);
    document.getElementById("acctDocPrint").onclick = ()=>{ closeModal(); acctPrintHTML(cfg.build, layout, cfg.ref); };
  };
  draw();
}
function acctShowPaymentReceipt(p, onBack){
  acctDocModal({ title:`🧾 Payment Receipt — ${escapeHtml(p.ref)}`, layout:"w80", ref:p.ref, onBack,
    layouts:[{id:"w58",label:"Thermal 58mm"},{id:"w80",label:"Thermal 80mm"},{id:"wA4",label:"A4 Receipt"}],
    build:l=>acctPaymentReceiptHTML(p,l), pdf:()=>acctDownloadPaymentPDF(p) });
}
function acctShowStatement(key, range, onBack){
  const acct = acctBuildLedger(key);
  acctDocModal({ title:`📄 Statement — ${escapeHtml(acct.name)}`, layout:"wA4", ref:null, onBack,
    layouts:[{id:"wA4",label:"A4 Statement"},{id:"w80",label:"Thermal 80mm"}],
    build:l=>acctStatementHTML(acct, range, l), pdf:()=>acctDownloadStatementPDF(acct, range) });
}

/* ---------- 7. PDF output ---------- */
function acctDownloadPaymentPDF(p){
  try{
    const { jsPDF } = window.jspdf, s = state.settings;
    const pdf = new jsPDF({ unit:"pt", format:[227, 420 + p.applied.length*16] });
    let y = 26;
    pdf.setFont("courier","bold"); pdf.setFontSize(12); pdf.text(s.name||"HARAMOS ENTERPRISE", 113, y, {align:"center"}); y+=14;
    pdf.setFont("courier","normal"); pdf.setFontSize(9); pdf.text(s.phone||"", 113, y, {align:"center"}); y+=18;
    pdf.setFont("courier","bold"); pdf.setFontSize(11); pdf.text("PAYMENT RECEIPT", 113, y, {align:"center"}); y+=16;
    pdf.setFont("courier","normal"); pdf.setFontSize(9);
    [[`Receipt# ${p.ref}`],[`Date: ${fmtDate(p.date)}`],[`Customer: ${p.customerName}`],[`Received by: ${p.by||"-"}`],[`Method: ${p.method||"-"}`]]
      .forEach(([t])=>{ pdf.text(t, 14, y); y+=12; });
    y+=6; pdf.setFont("courier","bold"); pdf.text("Applied to:", 14, y); y+=12; pdf.setFont("courier","normal");
    p.applied.forEach(a=>{ pdf.text(String(a.receipt), 14, y); pdf.text(acctPdfMoney(a.amount), 213, y, {align:"right"}); y+=12; });
    y+=8;
    pdf.text("Previous balance", 14, y); pdf.text(acctPdfMoney(p.balanceBefore), 213, y, {align:"right"}); y+=14;
    pdf.setFont("courier","bold");
    pdf.text("AMOUNT PAID", 14, y); pdf.text(acctPdfMoney(p.amount), 213, y, {align:"right"}); y+=14;
    pdf.text("BALANCE REMAINING", 14, y); pdf.text(acctPdfMoney(p.balanceAfter), 213, y, {align:"right"}); y+=16;
    if(p.balanceAfter<=ACCT_EPS){ pdf.text("*** ACCOUNT FULLY SETTLED ***", 113, y, {align:"center"}); y+=14; }
    if(p.note){ pdf.setFont("courier","normal"); pdf.text(pdf.splitTextToSize("Note: "+p.note, 199), 14, y); y+=24; }
    y+=8; pdf.setFont("courier","normal"); pdf.setFontSize(8);
    pdf.text(pdf.splitTextToSize(s.footer||"Thank you for shopping with us!", 199), 113, y, {align:"center"}); y+=22;
    pdf.text("Keep this receipt as proof of payment.", 113, y, {align:"center"});
    pdf.save(`${p.ref}.pdf`);
  }catch(e){ console.error(e); toast("Could not generate PDF in this browser.","err"); }
}

function acctDownloadStatementPDF(acct, range){
  try{
    const { jsPDF } = window.jspdf, s = state.settings, m = acctStatementModel(acct, range);
    const pdf = new jsPDF({ unit:"pt", format:"a4" });
    const PW = 595, PH = 842, M = 40, CW = PW - 2*M, GREEN = [11,92,64];
    let y = 46;
    const hline = (yy,w=.6,c=[200,196,184])=>{ pdf.setDrawColor(...c); pdf.setLineWidth(w); pdf.line(M,yy,PW-M,yy); };

    // --- letterhead
    pdf.setFont("helvetica","bold"); pdf.setFontSize(16); pdf.setTextColor(...GREEN);
    pdf.text(s.name||"HARAMOS ENTERPRISE", M, y);
    pdf.setFont("helvetica","normal"); pdf.setFontSize(9); pdf.setTextColor(70);
    const addr = pdf.splitTextToSize(s.address||"", 280);
    pdf.text([...addr, "Tel: "+(s.phone||"")], M, y+14);
    pdf.setFont("helvetica","bold"); pdf.setFontSize(14); pdf.setTextColor(...GREEN);
    pdf.text("STATEMENT OF ACCOUNT", PW-M, y, {align:"right"});
    pdf.setFont("helvetica","normal"); pdf.setFontSize(9); pdf.setTextColor(70);
    pdf.text(`Statement date: ${acctDay(Date.now())}`, PW-M, y+14, {align:"right"});
    pdf.text(`Period: ${m.label}`, PW-M, y+26, {align:"right"});
    y += 14 + (addr.length+1)*11 + 6; hline(y,1.6,[15,123,85]); y += 20;

    // --- customer + status
    const settled = acct.outstanding <= ACCT_EPS;
    pdf.setFontSize(8); pdf.setTextColor(120); pdf.text("CUSTOMER", M, y);
    pdf.setFont("helvetica","bold"); pdf.setFontSize(13); pdf.setTextColor(20); pdf.text(acct.name, M, y+15);
    if(acct.phone){ pdf.setFont("helvetica","normal"); pdf.setFontSize(9); pdf.setTextColor(70); pdf.text(acct.phone, M, y+28); }
    pdf.setFont("helvetica","bold"); pdf.setFontSize(10); pdf.setTextColor(...(settled?[30,132,73]:[192,57,43]));
    pdf.text(settled?"FULLY PAID":"BALANCE DUE", PW-M, y+12, {align:"right"});
    y += 44;

    // --- summary boxes (Opening + Debits - Credits = Closing)
    const boxes = [["Opening balance", m.opening], ["Credit taken (debit)", m.debits], ["Payments (credit)", m.credits], ["Closing balance", m.closing]];
    const bw = (CW - 3*8)/4;
    boxes.forEach(([k,v],i)=>{
      const x = M + i*(bw+8), last = i===3;
      pdf.setDrawColor(...(last?(m.closing<=ACCT_EPS?[30,132,73]:[192,57,43]):[210,206,192])); pdf.setLineWidth(last?1.2:.6);
      pdf.roundedRect(x, y, bw, 40, 4, 4);
      pdf.setFont("helvetica","normal"); pdf.setFontSize(7.5); pdf.setTextColor(120); pdf.text(k.toUpperCase(), x+8, y+13);
      pdf.setFont("helvetica","bold"); pdf.setFontSize(11);
      if(last && m.closing>ACCT_EPS) pdf.setTextColor(192,57,43); else pdf.setTextColor(20);
      pdf.text(acctPdfMoney(v), x+8, y+30);
    });
    y += 58;

    // --- generic table with wrapping + page breaks
    const table = (cols, rows, opt={})=>{
      const drawHead = ()=>{
        pdf.setFillColor(238,245,241); pdf.rect(M, y, CW, 18, "F");
        pdf.setFont("helvetica","bold"); pdf.setFontSize(7.5); pdf.setTextColor(...GREEN);
        let x = M; cols.forEach(c=>{ pdf.text(c.h.toUpperCase(), c.right ? x+c.w-5 : x+5, y+12, {align:c.right?"right":"left"}); x+=c.w; });
        y += 18; hline(y-0.5,1,[15,123,85]);
      };
      drawHead();
      rows.forEach(r=>{
        pdf.setFont("helvetica","normal"); pdf.setFontSize(8.5);
        const cells = cols.map((c,i)=> c.wrap ? pdf.splitTextToSize(String(r.cells[i]||""), c.w-10) : [String(r.cells[i]??"")]);
        const subLines = r.sub ? pdf.splitTextToSize(r.sub, cols.find(c=>c.wrap).w-10) : [];
        const lines = Math.max(...cells.map(c=>c.length)) + subLines.length;
        const h = lines*10.5 + 8;
        if(y + h > PH - 70){ pdf.addPage(); y = 46; drawHead(); }
        let x = M;
        cols.forEach((c,i)=>{
          pdf.setFont("helvetica", r.bold||c.bold ? "bold" : "normal"); pdf.setFontSize(8.5);
          pdf.setTextColor(...(c.color && r.cells[i] ? c.color : [25,25,25]));
          pdf.text(cells[i], c.right ? x+c.w-5 : x+5, y+12, {align:c.right?"right":"left"});
          x += c.w;
        });
        if(subLines.length){
          const wc = cols.findIndex(c=>c.wrap); let sx = M; for(let i=0;i<wc;i++) sx += cols[i].w;
          pdf.setFont("helvetica","normal"); pdf.setFontSize(7.5); pdf.setTextColor(110);
          pdf.text(subLines, sx+5, y+12 + cells[wc].length*10.5);
        }
        y += h; hline(y, .4, [229,225,212]);
      });
    };

    const ledgerRows = [];
    if(m.from!=null && Math.abs(m.opening)>ACCT_EPS) ledgerRows.push({ cells:["","","Balance brought forward","","",acctPdfMoney(m.opening)], bold:true });
    m.rows.forEach(e=> ledgerRows.push({
      cells:[acctDay(e.date), e.ref, e.desc, e.debit?acctPdfMoney(e.debit):"", e.credit?acctPdfMoney(e.credit):"", acctPdfMoney(e.balance)],
      sub: [e.detail, (e.applied&&e.applied.length>0)?("Applied to: "+e.applied.map(a=>a.receipt).join(", ")):""].filter(Boolean).join("  |  ")
    }));
    if(!m.rows.length) ledgerRows.push({ cells:["","","No transactions in this period","","",""] });
    ledgerRows.push({ cells:["","","Totals for period", acctPdfMoney(m.debits), acctPdfMoney(m.credits), acctPdfMoney(m.closing)], bold:true });
    table([
      {h:"Date", w:62}, {h:"Ref", w:84}, {h:"Description", w:167, wrap:true},
      {h:"Debit", w:66, right:true, color:[192,57,43]}, {h:"Credit", w:66, right:true, color:[30,132,73]}, {h:"Balance", w:70, right:true, bold:true}
    ], ledgerRows);

    // --- amount due
    if(y > PH - 190){ pdf.addPage(); y = 46; }
    y += 14;
    const dueNow = (m.isFull || m.to==null) ? acct.outstanding : m.closing;
    pdf.setDrawColor(20); pdf.setLineWidth(1.4); pdf.roundedRect(M, y, CW, 34, 5, 5);
    pdf.setFont("helvetica","bold"); pdf.setFontSize(10); pdf.setTextColor(20);
    pdf.text((m.isFull||m.to==null) ? "TOTAL AMOUNT DUE" : "BALANCE AS AT "+acctDay(m.to).toUpperCase(), M+14, y+21);
    pdf.setFontSize(15); pdf.setTextColor(...(dueNow>ACCT_EPS?[192,57,43]:[30,132,73]));
    pdf.text(acctPdfMoney(dueNow), PW-M-14, y+22, {align:"right"});
    y += 52;

    // --- unpaid receipts
    if((m.isFull || m.to==null) && acct.open.length){
      if(y > PH - 200){ pdf.addPage(); y = 46; }
      pdf.setFont("helvetica","bold"); pdf.setFontSize(9); pdf.setTextColor(...GREEN); pdf.text("UNPAID RECEIPTS MAKING UP THIS BALANCE", M, y); y += 8;
      table([{h:"Receipt#", w:120}, {h:"Date", w:80}, {h:"Original", w:85, right:true}, {h:"Paid", w:85, right:true}, {h:"Balance", w:85, right:true, bold:true}, {h:"Age", w:60, right:true}],
        acct.open.map(d=>{ const i = acct.info[d.id]; const age = Math.max(0,Math.floor((Date.now()-i.date)/86400000));
          return { cells:[i.receipt, acctDay(i.date), acctPdfMoney(i.charge), acctPdfMoney(i.credited), acctPdfMoney(i.balance), age+" d"] }; }));
      y += 6;
    }

    // --- signatures & note
    if(y > PH - 130){ pdf.addPage(); y = 46; }
    y += 10; pdf.setFont("helvetica","normal"); pdf.setFontSize(8); pdf.setTextColor(90);
    pdf.text(pdf.splitTextToSize("Please settle any outstanding balance promptly. Payments are acknowledged with a numbered payment receipt. If any entry above looks incorrect, please tell us immediately.", CW), M, y);
    y += 56; pdf.setDrawColor(20); pdf.setLineWidth(.6);
    pdf.line(M, y, M+220, y); pdf.line(PW-M-220, y, PW-M, y);
    pdf.setFontSize(8); pdf.text("Customer's signature & date", M+110, y+11, {align:"center"}); pdf.text("Authorised by", PW-M-110, y+11, {align:"center"});

    // --- page footers
    const pages = pdf.getNumberOfPages();
    for(let i=1;i<=pages;i++){
      pdf.setPage(i); pdf.setFont("helvetica","normal"); pdf.setFontSize(7.5); pdf.setTextColor(140);
      pdf.text(`${s.name||""} · ${s.phone||""} · ${acct.name}`, M, PH-24);
      pdf.text(`Page ${i} of ${pages}`, PW-M, PH-24, {align:"right"});
    }
    const safe = acct.name.replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase() || "customer";
    pdf.save(`statement-${safe}-${new Date().toISOString().slice(0,10)}.pdf`);
  }catch(e){ console.error(e); toast("Could not generate PDF in this browser.","err"); }
}

function renderProducts(){
  const html = `
  <div class="card">
    <div class="section-head">
      <div><h3>Products</h3><p>${state.products.length} total &middot; ${state.products.filter(p=>p.needsPricing).length} need pricing</p></div>

        <button class="btn btn-ghost btn-sm" id="exportCsv">Export CSV</button>

      </div>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Product</th><th>Category</th><th>Barcode</th><th>Cost</th>
      <th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="prodBody"></tbody></table></div>
  </div>`;
  setContent(html);
  const draw = ()=>{
    const q = document.getElementById("prodSearch").value.toLowerCase();
    const rows = state.products.filter(p=>p.name.toLowerCase().includes(q)||p.barcode.includes(q));
    document.getElementById("prodBody").innerHTML = rows.length ? rows.map(p=>{
      const out = p.currentStock<=0, low = !out && p.currentStock<=p.minStock;
      const status = out?`<span class="pill pill-danger">Out of stock</span>`:low?`<span class="pill pill-warn">Low stock</span>`:`<span class="pill pill-ok">In stock</span>`;
      return `<tr class="${p.needsPricing?'needs-price':''}">
        <td><b>${escapeHtml(p.name)}</b>${p.needsPricing?' <span class="pill pill-warn">Set price</span>':''}</td>
        <td>${escapeHtml(p.category)}</td><td class="mono">${p.barcode}</td>
        <td>${money(p.costPrice)}</td><td>${money(p.sellingPrice)}</td>
        <td>${fmtQty(p.currentStock)} ${escapeHtml(p.stockUnit)}</td><td>${status}</td>
        <td class="row-actions">
          <button class="icon-sm" title="Edit" onclick="openProductModal('${p.id}')">✏️</button>
          <button class="icon-sm" title="Duplicate" onclick="duplicateProduct('${p.id}')">📄</button>
          ${can("deleteProducts")?`<button class="icon-sm" title="Delete" onclick="deleteProduct('${p.id}')">🗑️</button>`:""}
        </td></tr>`;
    }).join("") : `<tr><td colspan="8"><div class="empty-state"><div class="ic">📦</div>No products found</div></td></tr>`;
  };
  document.getElementById("prodSearch").addEventListener("input", draw);
  document.getElementById("addProdBtn").addEventListener("click", ()=>openProductModal(null));
  document.getElementById("exportCsv").addEventListener("click", ()=>exportCSV(state.products.map(p=>({
    Name:p.name, Category:p.category, Barcode:p.barcode, Cost:p.costPrice, Price:p.sellingPrice,
    Stock:p.currentStock, Unit:p.stockUnit, MinStock:p.minStock
  })), "products.csv"));
  draw();
}

    row.querySelector(".remConv").onclick = ()=> row.remove();

  (p.unitConversions||[]).forEach(c=>addRow(c.unit,c.factor,c.price||""));

    const name = document.getElementById("pfName").value.trim();

    if(dupe) return toast("A product with this name or barcode already exists.","err");

window.duplicateProduct = async function(id){
  const p = state.products.find(x=>x.id===id);
  const copy = Object.assign({}, p, { id:genId("prod"), name:p.name+" (Copy)", barcode:"615"+Math.floor(1000000+Math.random()*8999999) });
  await dataSet("products", copy); state.products.push(copy);
  toast("Product duplicated","ok"); renderProducts();
};
window.deleteProduct = function(id){
  confirmDialog("Delete this product permanently? This cannot be undone.", async ()=>{
    await dataDelete("products", id);
    state.products = state.products.filter(p=>p.id!==id);
    toast("Product deleted","ok"); renderProducts();
  });
};
function exportCSV(rows, filename){
  if(!rows.length) return toast("Nothing to export","warn");
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(","), ...rows.map(r=>headers.map(h=>`"${String(r[h]??"").replace(/"/g,'""')}"`).join(","))].join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

      <tbody>${state.products.filter(p=>p.currentStock<=p.minStock).map(p=>`

    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="section-head"><h3>Stock Movement History</h3></div>
    <div class="table-wrap"><table><thead><tr><th>Product</th><th>Type</th><th>Change</th><th>Reference</th><th>By</th><th>Date</th></tr></thead>

// Shows a supplier's running balance and full purchase/payment history, and
// lets staff record a new purchase (increases what's owed) or a payment
// (reduces it) — an auditable trail in place of the old free-typed number,
// mirroring the same principle already used for Credit & Advance.
window.viewSupplierLedger = function(id){
  const s = state.suppliers.find(x=>x.id===id);
  if(!s) return;

  openModal(`<div class="modal-head"><h3>Ledger — ${escapeHtml(s.name)}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">

    <div class="form-grid">
      <div class="field"><label>Record Purchase (increases balance)</label><input type="number" id="supPurchaseAmt" min="0" placeholder="Amount"></div>
      <div class="field"><label>Record Payment (reduces balance)</label><input type="number" id="supPaymentAmt" min="0" max="${s.balance||0}" placeholder="Amount"></div>
    </div>
    <div class="field"><label>Note (optional)</label><input id="supEntryNote" placeholder="e.g. Invoice #, delivery details"></div>
    <div style="display:flex;gap:10px;margin-top:8px">

      <button class="btn btn-primary btn-sm" id="supAddPayment">Record Payment</button>

    <tbody>${history.length? history.map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${escapeHtml(h.type)}</td><td>${h.type==="Payment"?"-":""}${money(h.amount)}</td><td>${escapeHtml(h.note||"-")}</td><td>${escapeHtml(h.by||"-")}</td></tr>`).join("")
      : `<tr><td colspan="5"><div class="empty-state"><div class="ic">📒</div>No entries yet</div></td></tr>`}</tbody></table></div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">Close</button></div>`);
  document.getElementById("supAddPurchase").addEventListener("click", async ()=>{
    const amt = Math.max(0, +document.getElementById("supPurchaseAmt").value||0);
    if(amt<=0){ toast("Enter a purchase amount","err"); return; }
    const note = document.getElementById("supEntryNote").value.trim();
    s.balance = +(((s.balance||0) + amt).toFixed(2));
    s.history = s.history || [];
    s.history.push({ type:"Purchase", amount:amt, note, date:Date.now(), by:state.user.name });
    await dataSet("suppliers", s);
    const i = state.suppliers.findIndex(x=>x.id===s.id); if(i>=0) state.suppliers[i]=s;
    toast("Purchase recorded","ok"); viewSupplierLedger(id);
  });
  document.getElementById("supAddPayment").addEventListener("click", async ()=>{
    const amt = Math.min(s.balance||0, Math.max(0, +document.getElementById("supPaymentAmt").value||0));
    if(amt<=0){ toast("Enter a payment amount","err"); return; }
    const note = document.getElementById("supEntryNote").value.trim();
    s.balance = +(((s.balance||0) - amt).toFixed(2));
    s.history = s.history || [];
    s.history.push({ type:"Payment", amount:amt, note, date:Date.now(), by:state.user.name });
    await dataSet("suppliers", s);
    const i = state.suppliers.findIndex(x=>x.id===s.id); if(i>=0) state.suppliers[i]=s;
    await dataSet("payments", { id:genId("pay"), type:"supplierPayment", supplierId:s.id, amount:amt, createdAt:Date.now(), by:state.user.name });
    toast("Payment recorded","ok"); viewSupplierLedger(id);
  });
};

function renderReports(){
  const html = `<div class="card">

      <div class="toolbar">
        <input type="date" id="repFrom"><input type="date" id="repTo">
        <select id="repType"><option value="sales">Sales</option><option value="profit">Profit</option>
          <option value="expense">Expense</option><option value="inventory">Inventory</option>
          <option value="customer">Customer</option><option value="debtors">Debtors</option>
          <option value="advance">Advance Payments</option><option value="payments">Payments Ledger</option>
          <option value="salesrep">Sales Rep</option></select>
        <button class="btn btn-ghost btn-sm" id="runReport">Run</button>
        <button class="btn btn-gold btn-sm" id="exportReport">Export CSV</button>
        <button class="btn btn-ghost btn-sm" id="printReport">🖨️ Print</button>
      </div>
    </div>
    <div id="reportOut"></div>
  </div>`;
  setContent(html);
  const today = new Date().toISOString().slice(0,10);
  document.getElementById("repFrom").value = today; document.getElementById("repTo").value = today;
  document.getElementById("runReport").addEventListener("click", runReport);
  document.getElementById("exportReport").addEventListener("click", ()=>{
    const rows = window.__lastReportRows||[];
    exportCSV(rows, "report.csv");
  });
  document.getElementById("printReport").addEventListener("click", ()=>{
    const area=document.getElementById("printArea");
    area.innerHTML = `<div style="padding:20px">${document.getElementById("reportOut").innerHTML}</div>`;
    area.style.display="block"; setTimeout(()=>{window.print(); area.style.display="none";},200);
  });
  runReport();
}
function runReport(){
  const from = new Date(document.getElementById("repFrom").value).setHours(0,0,0,0);
  const to = new Date(document.getElementById("repTo").value).setHours(23,59,59,999);
  const type = document.getElementById("repType").value;
  const inRange = s=> s.createdAt>=from && s.createdAt<=to;
  let rows = [], cols = [];
  if(type==="sales"){
    const data = state.sales.filter(inRange);
    cols=["Receipt","Customer","Cashier","Total","Method","Date"];
    rows = data.map(s=>({ Receipt:s.receiptNumber, Customer:s.customerName, Cashier:s.cashierName, Total:s.total, Method:s.paymentMethod, Date:fmtDate(s.createdAt) }));
  } else if(type==="profit"){
    const data = state.sales.filter(inRange);
    cols=["Receipt","Revenue","Cost","Profit"];
    rows = data.map(s=>{ const cost=s.items.reduce((a,i)=>a+i.unitCost*i.qtySold,0); return { Receipt:s.receiptNumber, Revenue:s.total, Cost:cost, Profit:s.total-cost }; });
  } else if(type==="expense"){
    const data = state.expenses.filter(inRange);
    cols=["Category","Amount","Notes","Date"];
    rows = data.map(e=>({ Category:e.category, Amount:e.amount, Notes:e.notes, Date:fmtDate(e.createdAt) }));
  } else if(type==="inventory"){
    cols=["Product","Category","Stock","Unit","Value"];
    rows = state.products.map(p=>({ Product:p.name, Category:p.category, Stock:p.currentStock, Unit:p.stockUnit, Value:p.currentStock*p.costPrice }));
  } else if(type==="customer"){
    cols=["Customer","Phone","Purchases","Total Spent"];
    rows = state.customers.map(c=>{ const s=state.sales.filter(x=>x.customerId===c.id); return { Customer:c.name, Phone:c.phone, Purchases:s.length, "Total Spent":s.reduce((a,x)=>a+x.total,0) }; });
  } else if(type==="debtors"){
    cols=["Customer","Phone","Receipt","Total","Paid","Balance","Due Date","Status"];
    rows = state.debts.filter(d=>d.balance>0 && inRange(d)).map(d=>({ Customer:d.customerName, Phone:d.phone, Receipt:d.receiptNumber,
      Total:d.total, Paid:d.amountPaid, Balance:d.balance, "Due Date": d.dueDate ? fmtDate(new Date(d.dueDate).getTime()).split(",")[0] : "—",
      Status: isDebtOverdue(d) ? "Overdue" : "Owing" }));
  } else if(type==="advance"){
    cols=["Customer","Receipt","Paid","Balance","Store Credit","Status"];
    rows = state.advances.filter(inRange).map(a=>({ Customer:a.customerName, Receipt:a.receiptNumber, Paid:a.amountPaid,
      Balance: a.total===null||a.total===undefined?"Unknown":a.balance, "Store Credit":a.creditBalance||0, Status:a.collectionStatus }));
  } else if(type==="payments"){
    const data = (state.payments||[]).filter(inRange);
    cols=["Type","Receipt","Method","Amount","By","Date"];
    rows = data.map(p=>({ Type:p.type, Receipt:p.receiptNumber||"—", Method:p.method||"—", Amount:p.amount, By:p.by||"—", Date:fmtDate(p.createdAt) }));
  } else if(type==="salesrep"){
    const data = state.sales.filter(inRange);
    const byRep = {};
    data.forEach(s=>{ byRep[s.cashierName]=byRep[s.cashierName]||{count:0,total:0}; byRep[s.cashierName].count++; byRep[s.cashierName].total+=s.total; });
    cols=["Sales Rep","Transactions","Total Sales"];
    rows = Object.entries(byRep).map(([k,v])=>({ "Sales Rep":k, Transactions:v.count, "Total Sales":v.total }));
  }
  window.__lastReportRows = rows;
  const out = document.getElementById("reportOut");
  if(!rows.length){ out.innerHTML = `<div class="empty-state"><div class="ic">📈</div>No data for this range</div>`; return; }
  out.innerHTML = `<div class="table-wrap" style="margin-top:14px"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${typeof r[c]==="number"?money(r[c]).replace(/^\D+/,'').length&&["Total","Amount","Balance","Profit","Revenue","Cost","Total Spent","Value","Total Sales","Paid","Store Credit"].includes(c)?money(r[c]):r[c]:escapeHtml(String(r[c]??""))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
