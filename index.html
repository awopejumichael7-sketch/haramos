    const product = state.products.find(p=>p.id===i.productId);
    const equiv = (product && i.unit!==product.stockUnit && i.qtyInStockUnit!=null)
      ? `<div style="font-size:9.5px;opacity:.75">= ${fmtQty(i.qtyInStockUnit)} ${escapeHtml(product.stockUnit)}</div>` : "";
    return `<tr><td>${escapeHtml(i.productName)}</td><td>${fmtQty(i.qtySold)} ${escapeHtml(i.unit)}${equiv}</td>
    <td style="text-align:right">${money(i.unitPrice)}</td><td style="text-align:right">${money(i.qtySold*i.unitPrice)}</td></tr>`;
  }).join("");
  const balanceLine = sale.balance>0 ? `<div class="r-row"><b>BALANCE OWING</b><b>${money(sale.balance)}</b></div>` : "";
  const breakdownLines = sale.paymentBreakdown ? sale.paymentBreakdown.map(l=>
    `<div class="r-row"><span>&nbsp;&nbsp;${escapeHtml(l.method)}</span><span>${money(l.amount)}</span></div>`).join("") : "";
  // Store credit redeemed on this transaction (set at checkout when the
  // customer had credit available) and, separately, whatever store credit
  // they still have left after this transaction — shown whenever either is
  // non-zero so the customer always sees where they stand.
  const creditAppliedLine = sale.creditApplied>0.009 ? `<div class="r-row"><span>Store Credit Applied</span><span>-${money(sale.creditApplied)}</span></div>` : "";
  const storeCreditRemaining = sale.customerId ? customerStoreCredit(sale.customerId) : (sale.creditBalance||0);
  const storeCreditLine = storeCreditRemaining>0.009 ? `<div class="r-row" style="font-weight:600"><span>Store Credit Balance</span><span>${money(storeCreditRemaining)}</span></div>` : "";
  return `
  <div class="receipt ${layout}" id="receiptRoot">
    <div class="r-center"><b style="font-size:15px">${escapeHtml(s.name||"HARAMOS ENTERPRISE")}</b><br>${escapeHtml(s.phone||"")}<br>${escapeHtml(s.address||"")}</div>
    <hr>
    <div class="r-row"><span>Receipt#</span><span>${sale.receiptNumber}</span></div>
    <div class="r-row"><span>Date</span><span>${fmtDate(sale.createdAt)}</span></div>
    <div class="r-row"><span>Cashier</span><span>${escapeHtml(sale.cashierName)}</span></div>
    <div class="r-row"><span>Customer</span><span>${escapeHtml(sale.customerName||"Walk-in")}</span></div>
    <hr>
    <table><thead><tr><th>Item</th><th>Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Amt</th></tr></thead>
    <tbody>${itemsRows}</tbody></table>
    <div class="r-row" style="font-weight:600"><span>Total Pieces</span><span>${fmtQty(sale.items.reduce((a,i)=>a+(i.qtyInStockUnit!=null?i.qtyInStockUnit:i.qtySold),0))}</span></div>
    <hr>
    <div class="r-row"><span>Subtotal</span><span>${money(sale.subtotal)}</span></div>
    <div class="r-row"><span>Discount</span><span>-${money(sale.discount)}</span></div>
    <div class="r-row"><span>Tax</span><span>${money(sale.tax)}</span></div>
    <div class="r-row" style="font-weight:700;font-size:1.1em"><span>TOTAL</span><span>${money(sale.total)}</span></div>
    <div class="r-row"><span>Paid</span><span>${money(sale.amountPaid)}</span></div>
    ${creditAppliedLine}
    ${balanceLine}
    <div class="r-row"><span>Payment</span><span>${escapeHtml(sale.paymentMethod)}</span></div>
    ${breakdownLines}
    ${sale.history && sale.history.length ? `<hr><div class="r-center" style="font-weight:700">Payment History</div>${sale.history.map(h=>`<div class="r-row"><span>${fmtDate(h.date)}</span><span>${money(h.amount)}</span></div>`).join("")}` : ""}
    ${sale.advanceProducts && sale.advanceProducts.length ? `<hr><div class="r-center" style="font-weight:700">Collection Status</div>
    <table><thead><tr><th>Product</th><th style="text-align:right">Collected</th><th style="text-align:right">Remaining</th></tr></thead>
    <tbody>${sale.advanceProducts.map(p=>`<tr><td>${escapeHtml(p.productName)}</td><td style="text-align:right">${fmtQty(p.collected)} ${escapeHtml(p.unit)}</td><td style="text-align:right">${fmtQty(p.reserved-p.collected)} ${escapeHtml(p.unit)}</td></tr>`).join("")}</tbody></table>
    <div class="r-row"><span>Total Products Collected</span><span>${fmtQty(sale.advanceProducts.reduce((a,p)=>a+p.collected,0))}</span></div>
    <div class="r-row"><span>Total Products Remaining</span><span>${fmtQty(sale.advanceProducts.reduce((a,p)=>a+(p.reserved-p.collected),0))}</span></div>
    <div class="r-row" style="font-weight:600"><span>Value of Goods Collected</span><span>${money(sale.advanceProducts.reduce((a,p)=>a+p.collected*(p.unitPrice||0),0))}</span></div>
    <div class="r-row"><span>Value of Goods Remaining</span><span>${money(sale.advanceProducts.reduce((a,p)=>a+(p.reserved-p.collected)*(p.unitPrice||0),0))}</span></div>` : ""}
    ${storeCreditLine ? `<hr>${storeCreditLine}` : ""}
    <hr>
    <div class="r-center" id="rcBarcode"></div>
    <div class="r-center" id="rcQr" style="margin-top:6px"></div>
    <hr>
    <div class="r-center">${escapeHtml(s.footer||"Thank you for shopping with us!")}<br>
    <span style="font-size:.85em">${escapeHtml(s.returnPolicy||"")}</span></div>
  </div>`;
}
function printReceipt(sale, layout="w80"){

function downloadReceiptPDF(sale){
  try{
    const { jsPDF } = window.jspdf;
    const extraHeight = sale.advanceProducts && sale.advanceProducts.length ? 40+sale.advanceProducts.length*24 : 0;
    const pdf = new jsPDF({ unit:"pt", format:[227, 500+sale.items.length*30+extraHeight] });
    let y = 26;
    const s = state.settings;
    pdf.setFont("courier","bold"); pdf.setFontSize(12);
    pdf.text(s.name||"HARAMOS ENTERPRISE", 113, y, {align:"center"}); y+=14;
    pdf.setFont("courier","normal"); pdf.setFontSize(9);
    pdf.text(s.phone||"", 113, y, {align:"center"}); y+=16;
    pdf.text(`Receipt# ${sale.receiptNumber}`, 14, y); y+=12;
    pdf.text(`Date: ${fmtDate(sale.createdAt)}`, 14, y); y+=12;
    pdf.text(`Cashier: ${sale.cashierName}`, 14, y); y+=12;
    pdf.text(`Customer: ${sale.customerName||"Walk-in"}`, 14, y); y+=16;
    sale.items.forEach(i=>{
      const product = state.products.find(p=>p.id===i.productId);
      pdf.text(`${i.productName} (${fmtQty(i.qtySold)} ${i.unit})`, 14, y); y+=11;
      pdf.text(`  ${money(i.unitPrice)} x ${fmtQty(i.qtySold)} = ${money(i.unitPrice*i.qtySold)}`, 14, y); y+=13;
      if(product && i.unit!==product.stockUnit && i.qtyInStockUnit!=null){
        pdf.setFontSize(8);
        pdf.text(`  = ${fmtQty(i.qtyInStockUnit)} ${product.stockUnit}`, 14, y); y+=11;
        pdf.setFontSize(9);
      }
    });
    y+=4;
    pdf.setFont("courier","bold");
    pdf.text(`Total Pieces: ${fmtQty(sale.items.reduce((a,i)=>a+(i.qtyInStockUnit!=null?i.qtyInStockUnit:i.qtySold),0))}`, 14, y); y+=13;
    pdf.setFont("courier","normal");
    y+=6;
    [["Subtotal",sale.subtotal],["Discount",-sale.discount],["Tax",sale.tax],["TOTAL",sale.total],
     ["Paid",sale.amountPaid],["Balance",sale.balance]].forEach(([lbl,val])=>{
      pdf.text(String(lbl), 14, y); pdf.text(money(val), 213, y, {align:"right"}); y+=13;
    });
    if(sale.advanceProducts && sale.advanceProducts.length){
      y+=6;
      pdf.setFont("courier","bold"); pdf.text("Collection Status", 14, y); y+=13;
      pdf.setFont("courier","normal");
      sale.advanceProducts.forEach(p=>{
        pdf.text(`${p.productName}: collected ${fmtQty(p.collected)}/${fmtQty(p.reserved)} ${p.unit}`, 14, y); y+=11;
        pdf.text(`  remaining ${fmtQty(p.reserved-p.collected)} ${p.unit}`, 14, y); y+=13;
      });
      const totalCollected = sale.advanceProducts.reduce((a,p)=>a+p.collected,0);
      const totalRemaining = sale.advanceProducts.reduce((a,p)=>a+(p.reserved-p.collected),0);
      pdf.text(`Total Collected: ${fmtQty(totalCollected)}`, 14, y); y+=12;
      pdf.text(`Total Remaining: ${fmtQty(totalRemaining)}`, 14, y); y+=12;
    }
    y+=10;
    pdf.text(s.footer||"Thank you for shopping with us!", 113, y, {align:"center"});
    pdf.save(`${sale.receiptNumber}.pdf`);
  }catch(e){ console.error(e); toast("Could not generate PDF in this browser.","err"); }
}

/* ------------------------------------------------------------------
   18. RECEIPT HISTORY
------------------------------------------------------------------ */
/* Build a receipt-ready "sale" object from a Credit/Debt record.
   If the debt is linked to an original Sales-screen transaction, reuse
   that sale's full item list (and just overlay the current running
   paid/balance + payment history). Otherwise — for debts added manually
   from the Credit & Advance tab — synthesize a one-line receipt. */
function buildDebtReceiptSale(d){
  const original = d.saleId && state.sales.find(s=>s.id===d.saleId);
  const base = original ? { ...original } : {
    receiptNumber: d.receiptNumber, createdAt: d.createdAt,
    cashierName: state.user?.name || "Store", customerName: d.customerName, customerId: d.customerId,
    items: [{ productName: d.notes ? `Credit / Debt — ${d.notes}` : "Credit / Debt balance", unit:"", qtySold:1, unitPrice:d.total, unitCost:0 }],
    subtotal: d.total, discount:0, taxPct:0, tax:0, total: d.total,
    paymentMethod:"Credit", paymentBreakdown:null
  };
  return Object.assign({}, base, { amountPaid:d.amountPaid, balance:d.balance, history:d.history||[] });
}
/* Same idea for Advance Payments. Falls back to listing the reserved
   products (with an even price split, since exact per-item pricing may
   not have been recorded) when there's no linked sale. */
function buildAdvanceReceiptSale(a){
  const original = a.saleId && state.sales.find(s=>s.id===a.saleId);
  if(original) return Object.assign({}, original, { amountPaid:a.amountPaid, balance:a.balance, advanceProducts:a.products||[], creditBalance:a.creditBalance||0 });
  const total = a.total!=null ? a.total : a.amountPaid;
  const qtyTotal = (a.products||[]).reduce((sum,p)=>sum+p.reserved,0) || 1;
  const items = (a.products && a.products.length) ? a.products.map(p=>({
    productName: p.productName + (p.collected>0 ? ` (collected ${fmtQty(p.collected)}/${fmtQty(p.reserved)} ${p.unit})` : ""),
    unit:p.unit, qtySold:p.reserved, unitPrice: +(total*(p.reserved/qtyTotal)/p.reserved || 0).toFixed(2), unitCost:0
  })) : [{ productName:"Advance payment", unit:"", qtySold:1, unitPrice:a.amountPaid, unitCost:0 }];
  return { receiptNumber:a.receiptNumber, createdAt:a.createdAt, cashierName: state.user?.name||"Store",
    customerName:a.customerName, customerId:a.customerId, items, subtotal:total, discount:0, taxPct:0, tax:0, total,
    amountPaid:a.amountPaid, balance:a.balance, paymentMethod:"Advance Payment", paymentBreakdown:null,
    advanceProducts: a.products||[], creditBalance:a.creditBalance||0 };
}

/* Given a plain sales-history record, look up whether it has a linked
   Advance Payment record and, if so, overlay that record's live
   amountPaid/balance/collection-progress onto the receipt — so the
   Sales History receipt always reflects the current collection state,
   not just a snapshot from the moment of the original transaction. */
function enrichSaleWithAdvance(sale){
  const adv = state.advances.find(a=>a.saleId===sale.id);
  if(!adv) return sale;
  return Object.assign({}, sale, { amountPaid:adv.amountPaid, balance:adv.balance,
    advanceProducts:adv.products||[], collectionStatus:adv.collectionStatus, creditBalance:adv.creditBalance||0 });
}
/* Same idea for Credit/Debt sales — a sale paid on credit gets a linked
   `debts` record that keeps its own running amountPaid/balance/history as
   the customer pays it down over time. Overlay that live state onto the
   original sale so its Sales-History row/receipt always shows the current
   paid amount, balance and status instead of a stale snapshot from the
   moment of the original transaction. */
function enrichSaleWithDebt(sale){
  const debt = state.debts.find(d=>d.saleId===sale.id);
  if(!debt) return sale;
  return Object.assign({}, sale, { amountPaid:debt.amountPaid, balance:debt.balance,
    history:debt.history||[], debtId:debt.id,
    status: debt.writtenOff ? "Written Off" : (debt.balance<=0.009 ? "Paid" : (debt.amountPaid>0 ? "Partial/Owing" : "Owing")) });
}
/* Convenience wrapper: apply whichever overlay (debt or advance) applies
   to this sale — a given sale can only ever have one of the two linked. */
function enrichSale(sale){
  return enrichSaleWithDebt(enrichSaleWithAdvance(sale));
}

// How much of a given line item on this sale has already been returned,
// across every prior return processed against it — so a second return
// can never let someone give back more than was actually sold.
function alreadyReturnedQty(saleId, productName, unit){
  return state.returns.filter(r=>r.saleId===saleId)
    .flatMap(r=>r.items)
    .filter(i=>i.productName===productName && i.unit===unit)
    .reduce((sum,i)=>sum+i.qty, 0);
}

window.openProcessReturnModal = function(saleId){
  const sale = state.sales.find(x=>x.id===saleId);
  if(!sale){ toast("Sale not found","err"); return; }
  const debt = state.debts.find(d=>d.saleId===saleId);
  const rows = sale.items.map((it,idx)=>{
    const already = alreadyReturnedQty(saleId, it.productName, it.unit);
    const remaining = Math.max(0, it.qtySold - already);
    return { ...it, idx, already, remaining };
  });
  const anyReturnable = rows.some(r=>r.remaining>0.009);
  openModal(`<div class="modal-head"><h3>Process Return — ${sale.receiptNumber}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">
    <p style="font-size:12.5px;color:var(--ink-soft)">${escapeHtml(sale.customerName||"Walk-in")} &middot; ${fmtDate(sale.createdAt)}</p>
    ${anyReturnable ? `
    <div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Product</th><th>Sold</th><th>Already Returned</th><th>Return Qty</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${escapeHtml(r.productName)}</td><td>${fmtQty(r.qtySold)} ${escapeHtml(r.unit)}</td><td>${fmtQty(r.already)}</td>
      <td><input type="number" class="retQty" data-idx="${r.idx}" min="0" max="${r.remaining}" step="0.01" value="0" style="width:80px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)" ${r.remaining<=0?"disabled":""}></td></tr>`).join("")}</tbody></table></div>
    <div class="field" style="margin-top:12px"><label>Reason (optional)</label><input id="retReason" placeholder="e.g. Damaged bag, wrong item"></div>
    <div class="cart-row total" style="margin-top:10px"><span>Total Refund</span><span id="retTotalDisplay">₦0.00</span></div>
    <div class="field" style="margin-top:10px"><label>Refund Method</label>
      <select id="retMethod">
        <option value="Cash">Cash / Tender (money handed back)</option>
        ${sale.customerId ? `<option value="Store Credit">Store Credit (for their next purchase)</option>` : ""}
        ${debt && debt.balance>0.009 ? `<option value="Reduce Balance">Reduce Outstanding Balance (${money(debt.balance)} owed)</option>` : ""}
      </select>
    </div>
    ` : `<p style="margin-top:14px;color:var(--ink-soft);font-size:13px">Everything on this sale has already been returned.</p>`}
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">Cancel</button>
  ${anyReturnable ? `<button class="btn btn-primary" id="retSave">Process Return</button>` : ""}</div>`, {lg:true});
  if(!anyReturnable) return;

  const updateTotal = ()=>{
    const total = [...document.querySelectorAll(".retQty")].reduce((sum,inp)=>{
      const r = rows[+inp.dataset.idx];
      return sum + Math.max(0, Math.min(r.remaining, +inp.value||0)) * r.unitPrice;
    }, 0);
    document.getElementById("retTotalDisplay").textContent = money(total);
  };
  document.querySelectorAll(".retQty").forEach(inp=> inp.addEventListener("input", updateTotal));
  updateTotal();

  document.getElementById("retSave").addEventListener("click", async ()=>{
    const returnedItems = [...document.querySelectorAll(".retQty")].map(inp=>{
      const r = rows[+inp.dataset.idx];
      const qty = Math.max(0, Math.min(r.remaining, +inp.value||0));
      return qty>0 ? { productName:r.productName, unit:r.unit, qty, unitPrice:r.unitPrice, refundAmount:+(qty*r.unitPrice).toFixed(2) } : null;
    }).filter(Boolean);
    if(!returnedItems.length){ toast("Enter a return quantity for at least one item","err"); return; }
    const totalRefund = +returnedItems.reduce((a,i)=>a+i.refundAmount,0).toFixed(2);
    const method = document.getElementById("retMethod").value;
    const reason = document.getElementById("retReason").value.trim();

    // Restock every returned item and log it, exactly like every other
    // stock movement in the app — a Return is just as auditable as a sale.
    for(const item of returnedItems){
      const product = state.products.find(p=>p.name===item.productName);
      if(!product) continue;
      const restore = stockDeductionFor(product, item.unit, item.qty);
      product.currentStock = +(product.currentStock + restore).toFixed(4);
      await dataSet("products", product);
      await dataSet("stockHistory", { id:genId("stk"), productId:product.id, productName:product.name,
        type:"Return", change:restore, reference:sale.receiptNumber, createdAt:Date.now(), by:state.user.name });
    }

    // Settle the refund according to the chosen method.
    if(method === "Store Credit"){
      const creditAdv = { id:genId("adv"), customerId:sale.customerId, customerName:sale.customerName,
        phone:"", saleId:null, receiptNumber:"RTN-"+Date.now().toString().slice(-8),
        amountPaid:totalRefund, total:0, balance:0, creditBalance:totalRefund, products:[],
        collectionStatus:"Fully Collected", notes:`Store credit from return on ${sale.receiptNumber}`, createdAt:Date.now() };
      await dataSet("advancePayments", creditAdv); state.advances.push(creditAdv);
      await syncAdvanceDebt(creditAdv);
    } else if(method === "Reduce Balance" && debt){
      const appliedToBalance = Math.min(totalRefund, debt.balance);
      const excess = +(totalRefund - appliedToBalance).toFixed(2);
      debt.balance = +(debt.balance - appliedToBalance).toFixed(2);
      debt.history = debt.history || [];
      debt.history.push({ amount:appliedToBalance, date:Date.now(), by:state.user.name, note:`Return credit — ${sale.receiptNumber}` });
      await dataSet("debts", debt);
      if(debt.saleId){
        const linkedSale = state.sales.find(x=>x.id===debt.saleId);
        if(linkedSale){
          linkedSale.balance = debt.balance;
          linkedSale.status = debt.balance<=0.009 ? "Paid" : "Partial/Owing";
          await dataSet("sales", linkedSale);
          await dataSet("receipts", { id:linkedSale.id, ...linkedSale });
          const rxIdx = state.receipts.findIndex(r=>r.id===linkedSale.id);
          if(rxIdx>-1) state.receipts[rxIdx] = { id:linkedSale.id, ...linkedSale };
        }
      }
      if(excess > 0.009){
        const creditAdv = { id:genId("adv"), customerId:sale.customerId, customerName:sale.customerName,
          phone:"", saleId:null, receiptNumber:"RTN-"+Date.now().toString().slice(-8),
          amountPaid:excess, total:0, balance:0, creditBalance:excess, products:[],
          collectionStatus:"Fully Collected", notes:`Store credit — return refund exceeded the balance owed on ${sale.receiptNumber}`, createdAt:Date.now() };
        await dataSet("advancePayments", creditAdv); state.advances.push(creditAdv);
        await syncAdvanceDebt(creditAdv);
      }
    } else {
      await dataSet("payments", { id:genId("pay"), type:"refund", saleId, receiptNumber:sale.receiptNumber,
        method:"Cash", amount:totalRefund, createdAt:Date.now(), by:state.user.name });
    }

    const returnRecord = { id:genId("rtn"), saleId, receiptNumber:sale.receiptNumber,
      customerId:sale.customerId||null, customerName:sale.customerName||"Walk-in",
      items:returnedItems, totalRefund, refundMethod:method, reason, createdAt:Date.now(), by:state.user.name };
    await dataSet("returns", returnRecord); state.returns.push(returnRecord);

    closeModal();
    toast(`Return processed — ${money(totalRefund)} refunded via ${method}`, "ok");
    renderReceipts();
  });
};

/* Admin-only: delete a past sale, restore stock, and remove any linked
   debt / advance-payment records it created. */
window.deleteSale = function(id){
  if(!can("deleteSales")){ toast("Only Admin can delete sales.", "err"); return; }
  const sale = state.sales.find(s=>s.id===id);
  if(!sale) return;
  confirmDialog(`Delete receipt <b>${sale.receiptNumber}</b>? This restores ${sale.items.length} item(s) back to stock and removes any linked debt/advance record. This cannot be undone.`, async ()=>{
    for(const item of sale.items){
      const product = state.products.find(p=>p.id===item.productId);
      if(product){
        product.currentStock = +(product.currentStock + item.qtyInStockUnit).toFixed(4);
        await dataSet("products", product);
        await dataSet("stockHistory", { id:genId("stk"), productId:product.id, productName:product.name,
          type:"Sale Deleted (Restock)", change:item.qtyInStockUnit, reference:sale.receiptNumber,
          createdAt:Date.now(), by:state.user.name });
      }
    }
    const linkedDebt = state.debts.find(d=>d.saleId===sale.id);
    if(linkedDebt){ await dataDelete("debts", linkedDebt.id); state.debts = state.debts.filter(d=>d.id!==linkedDebt.id); }
    const linkedAdv = state.advances.find(a=>a.saleId===sale.id);
    if(linkedAdv){ await dataDelete("advancePayments", linkedAdv.id); state.advances = state.advances.filter(a=>a.id!==linkedAdv.id); }
    await dataDelete("sales", sale.id);
    await dataDelete("receipts", sale.id);
    state.sales = state.sales.filter(s=>s.id!==sale.id);
    state.receipts = state.receipts.filter(s=>s.id!==sale.id);
    toast(`Receipt ${sale.receiptNumber} deleted — stock restored.`, "ok");
    renderReceipts();
  });
};

/* Value (in currency) of everything a customer has physically collected
   so far on an Advance Payment record, using the per-unit price captured
   at the time the products were reserved (falls back to the product's
   current catalogue price if that wasn't recorded, e.g. older/manual
   records). */
function advCollectedValue(adv){
  return (adv.products||[]).reduce((sum,p)=>{
    let price = p.unitPrice;
    if(price==null || isNaN(price)){
      const product = state.products.find(x=>x.name===p.productName);
      price = product ? unitPriceFor(product, p.unit) : 0;
    }
    return sum + (p.collected||0)*price;
  }, 0);
}
/* If a customer has collected more product value than they've actually
   paid for (whether on a Sales-screen Advance Payment or one added/edited
   from the Credit & Advance tab), the uncovered portion is a real debt —
   goods already left the shop without being paid for. This keeps a
   linked record in the Credit Sales (Debtors) ledger in sync with that
   shortfall automatically, so it shows up on the debit/credit side
   instead of staying invisible inside the advance record. */
async function syncAdvanceDebt(adv){
  const collectedValue = advCollectedValue(adv);
  const overage = Math.max(0, +(collectedValue - adv.amountPaid).toFixed(2));
  let debt = state.debts.find(d=>d.advanceId===adv.id);
  if(overage > 0.009){
    if(!debt){
      debt = { id:genId("debt"), customerId:adv.customerId, customerName:adv.customerName, phone:adv.phone||"",
        saleId:null, advanceId:adv.id, receiptNumber:adv.receiptNumber, total:overage, amountPaid:0, balance:overage,
        dueDate:null, createdAt:Date.now(), history:[],
        notes:`Auto: goods collected exceed amount paid on Advance ${adv.receiptNumber}` };
      await dataSet("debts", debt); state.debts.push(debt);
      toast("Customer collected more than they paid for — the balance was moved to Credit & Advance (Debtors)", "warn");
    } else {
      debt.total = overage;
      debt.balance = Math.max(0, +(overage - debt.amountPaid).toFixed(2));
      debt.customerName = adv.customerName; debt.phone = adv.phone||debt.phone;
      await dataSet("debts", debt);
    }
  } else if(debt){
    const hasActivity = debt.amountPaid>0.009 || (debt.history && debt.history.length>0);
    if(!hasActivity){
      // nothing was ever paid against this shortfall directly — the
      // top-up on the advance covered it, so the auto-record is no
      // longer needed
      await dataDelete("debts", debt.id);
      state.debts = state.debts.filter(d=>d.id!==debt.id);
    } else {
      debt.balance = 0;
      await dataSet("debts", debt);
    }
  }
}
window.openManualAdvanceModal = function(){

      <input class="maQty" type="number" min="0.01" step="0.01" value="1" style="width:80px;padding:7px;border-radius:8px;border:1px solid var(--line)">
      <select class="maUnit" style="width:120px;padding:7px;border-radius:8px;border:1px solid var(--line)"></select>

      <span class="maLineTotal" style="font-size:13px;font-weight:600;min-width:95px;text-align:right"></span>
      <button class="icon-sm remRow">✕</button>`;
    const prodSel = row.querySelector(".maProd"), unitSel = row.querySelector(".maUnit"), qtyInput = row.querySelector(".maQty");
    const fillUnits = ()=>{ const p = state.products.find(x=>x.id===prodSel.value); unitSel.innerHTML = sellableUnits(p).map(u=>`<option>${u.unit}</option>`).join(""); updateRowTotal(row); };
    prodSel.addEventListener("change", fillUnits);

    qtyInput.addEventListener("input", ()=>updateRowTotal(row));
    row.querySelector(".remRow").onclick = ()=>{ row.remove(); updateGrandTotal(); };
    // The row must be attached to the DOM before its price/total is first
    // computed — updateGrandTotal() only sums rows already inside the
    // container, so filling the row in beforehand made the very first
    // product added always show a ₦0.00 running total.
    rows.appendChild(row);

  };
  addRow();

      await dataSet("customers", customer); state.customers.push(customer);
    }
    const products = [...rows.children].map(r=>{
      const p = state.products.find(x=>x.id===r.querySelector(".maProd").value);
      const unit = r.querySelector(".maUnit").value;

    // Reserve the stock for these goods immediately, exactly the way a

    for(const p of products){
      const product = state.products.find(x=>x.name===p.productName);

      const deduction = stockDeductionFor(product, p.unit, p.reserved);
      if(deduction > product.currentStock + 1e-9){
        toast(`Not enough stock for ${product.name}. Available: ${fmtQty(product.currentStock)} ${product.stockUnit}`, "err");
        return;
      }
    }
    const paid = Math.max(0, +document.getElementById("maPaid").value||0);
    // The Total Value of Goods is never manually typed — it's the exact
    // sum of each reserved product's catalogue price × quantity, the same
    // number shown live in the modal above.
    const totalVal = +(products.reduce((sum,p)=>sum + p.unitPrice*p.reserved, 0).toFixed(2));
    const balance = Math.max(0, +(totalVal-paid).toFixed(2));
    const creditBalance = Math.max(0, +(paid-totalVal).toFixed(2));
    const adv = { id:genId("adv"), customerId:customer.id, customerName:customer.name, phone:customer.phone||phoneInput,

  };
};
window.recordDebtPayment = function(id){
  const debt = state.debts.find(d=>d.id===id);
  openModal(`<div class="modal-head"><h3>Record Payment — ${escapeHtml(debt.customerName)}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">
    <p style="font-size:13px;color:var(--ink-soft)">Current balance: <b>${money(debt.balance)}</b></p>
    <div class="form-grid">
      <div class="field"><label>Payment Amount</label><input type="number" id="dbtAmt" min="0" max="${debt.balance}"></div>
      <div class="field"><label>Payment Method</label><select id="dbtMethod">${PAYMENT_METHODS_STANDARD.map(m=>`<option>${m}</option>`).join("")}</select></div>
    </div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">Cancel</button>
  <button class="btn btn-gold" onclick="viewDebtReceipt('${debt.id}')">🧾 Receipt</button>
  <button class="btn btn-primary" id="dbtSave">Save Payment</button></div>`);
  document.getElementById("dbtSave").onclick = async ()=>{
    const amt = Math.min(debt.balance, Math.max(0, +document.getElementById("dbtAmt").value||0));
    const method = document.getElementById("dbtMethod").value;
    if(debt.advanceId){
      // This debt mirrors the shortfall between goods collected and amount
      // paid on a linked Advance Payment. Settle it by crediting the
      // payment onto the advance itself and re-deriving the balance from
      // that — crediting both the advance AND decrementing debt.balance
      // directly would count the same payment twice.
      debt.history.push({amount:amt, date:Date.now(), method, by:state.user.name});
      const adv = state.advances.find(a=>a.id===debt.advanceId);
      if(adv){
        adv.amountPaid += amt;
        await dataSet("advancePayments", adv);
        await syncAdvanceDebt(adv);
      } else {
        // orphaned link (advance record no longer exists) — settle plainly
        debt.amountPaid += amt; debt.balance -= amt;
        await dataSet("debts", debt);
      }
    } else {
      debt.amountPaid += amt; debt.balance -= amt; debt.history.push({amount:amt, date:Date.now(), method, by:state.user.name});
      await dataSet("debts", debt);
    }
    await dataSet("payments", { id:genId("pay"), type:"debt", debtId:debt.id, receiptNumber:debt.receiptNumber, method, amount:amt, createdAt:Date.now(), by:state.user.name });
    // Push this payment's progress back onto the original sale so Sales
    // History (and its receipt) automatically reflect the customer's
    // current debit/credit balance instead of the one-time snapshot
    // recorded at checkout.
    if(debt.saleId){
      const linkedSale = state.sales.find(s=>s.id===debt.saleId);
      if(linkedSale){
        linkedSale.amountPaid = debt.amountPaid;
        linkedSale.balance = debt.balance;
        linkedSale.status = debt.balance<=0.009 ? "Paid" : "Partial/Owing";
        await dataSet("sales", linkedSale);
        await dataSet("receipts", { id:linkedSale.id, ...linkedSale });
        const rxIdx = state.receipts.findIndex(r=>r.id===linkedSale.id);
        if(rxIdx>-1) state.receipts[rxIdx] = { id:linkedSale.id, ...linkedSale };
      }
    }
    closeModal(); toast("Payment recorded","ok"); drawCreditTab("debts");
  };
};
// Admin-only: mark an uncollectible debt's remaining balance as a write-off
// rather than a payment, so it disappears from "money still owed" without
// ever being counted as cash actually received. Only applies to standalone
// debts (not ones auto-derived from an Advance Payment shortfall, which
// must be resolved from that record so the two stay in sync).
window.writeOffDebt = function(id){
  if(!can("editCreditRecords")){ toast("Only an Admin can write off a debt.", "err"); return; }
  const debt = state.debts.find(d=>d.id===id);
  if(!debt) return;
  if(debt.advanceId){ toast("This balance comes from an Advance Payment — resolve it from that record instead.", "warn"); return; }
  confirmDialog(`Write off the remaining <b>${money(debt.balance)}</b> owed by <b>${escapeHtml(debt.customerName)}</b>? This marks it as an uncollectible loss (not a payment) and cannot be undone.`, async ()=>{
    const amount = debt.balance;
    debt.history = debt.history || [];
    debt.history.push({ writeOff:true, amount, date:Date.now(), by:state.user.name });
    debt.writtenOff = true; debt.writeOffAmount = amount; debt.writeOffAt = Date.now(); debt.writeOffBy = state.user.name;
    debt.balance = 0;
    await dataSet("debts", debt);
    if(debt.saleId){
      const linkedSale = state.sales.find(s=>s.id===debt.saleId);
      if(linkedSale){
        linkedSale.balance = 0; linkedSale.status = "Written Off";
        await dataSet("sales", linkedSale);
        await dataSet("receipts", { id:linkedSale.id, ...linkedSale });
        const rxIdx = state.receipts.findIndex(r=>r.id===linkedSale.id);
        if(rxIdx>-1) state.receipts[rxIdx] = { id:linkedSale.id, ...linkedSale };
      }
    }
    toast("Debt written off","ok"); drawCreditTab("debts");
  });
};
// Admin-only: delete a standalone credit/debt record that was added
// manually (not one generated by a Sales-screen checkout or an Advance
// Payment shortfall, both of which must be undone from their own records
// so linked stock/sale data stays consistent).
window.deleteManualDebt = function(id){
  if(!can("editCreditRecords")){ toast("Only an Admin can delete a credit record.", "err"); return; }
  const debt = state.debts.find(d=>d.id===id);
  if(!debt) return;
  if(debt.saleId || debt.advanceId){ toast("This record is linked to a sale or advance — resolve it from there instead.", "warn"); return; }
  confirmDialog(`Delete this credit record for <b>${escapeHtml(debt.customerName)}</b>? This cannot be undone.`, async ()=>{
    await dataDelete("debts", debt.id);
    state.debts = state.debts.filter(d=>d.id!==debt.id);
    toast("Credit record deleted","ok"); drawCreditTab("debts");
  });
};
// Admin-only: delete a standalone (not Sales-screen-linked) Advance
// Payment record. Returns whatever reserved-but-uncollected stock it was
// holding back to inventory, mirroring how deleting a linked sale already
// restocks its Advance Payment — keeping the two paths consistent.
window.deleteManualAdvance = function(id){
  if(!can("editCreditRecords")){ toast("Only an Admin can delete an advance payment.", "err"); return; }
  const adv = state.advances.find(a=>a.id===id);
  if(!adv) return;
  if(adv.saleId){ toast("This advance came from a Sales-screen transaction — delete the sale/receipt instead so stock is restored correctly.", "warn"); return; }
  confirmDialog(`Delete this advance payment for <b>${escapeHtml(adv.customerName)}</b>? Any reserved-but-not-yet-collected stock will be returned to inventory. This cannot be undone.`, async ()=>{
    for(const p of (adv.products||[])){
      const outstanding = Math.max(0, (p.reserved||0) - (p.collected||0));
      if(outstanding<=0) continue;
      const product = state.products.find(x=>x.name===p.productName);
      if(!product) continue;
      const restore = stockDeductionFor(product, p.unit, outstanding);
      product.currentStock = +(product.currentStock + restore).toFixed(4);
      await dataSet("products", product);
      await dataSet("stockHistory", { id:genId("stk"), productId:product.id, productName:product.name,
        type:"Advance deleted (restock)", change:restore, reference:adv.receiptNumber, createdAt:Date.now(), by:state.user.name });
    }
    const linkedDebt = state.debts.find(d=>d.advanceId===adv.id);
    if(linkedDebt){ await dataDelete("debts", linkedDebt.id); state.debts = state.debts.filter(d=>d.id!==linkedDebt.id); }
    await dataDelete("advancePayments", adv.id);
    state.advances = state.advances.filter(a=>a.id!==adv.id);
    toast("Advance payment deleted — reserved stock restored.","ok"); drawCreditTab("advances");
  });
};
