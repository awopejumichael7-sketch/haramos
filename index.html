        ${debt?`<button class="icon-sm" title="Record Payment" onclick="recordDebtPayment('${debt.id}')" ${debt.balance<=0.009?"disabled":""}>💳</button>`:""}
        ${can("deleteSales")?`<button class="icon-sm" title="Delete &amp; restore stock" onclick="deleteSale('${s.id}')">🗑️</button>`:""}
      </td></tr>`;}).join("") : `<tr><td colspan="9"><div class="empty-state"><div class="ic">🧾</div>No receipts found</div></td></tr>`;

/* Admin-only: delete a past sale, restore stock, and remove any linked
   debt / advance-payment records it created. */
window.deleteSale = function(id){
  if(!can("deleteSales")){ toast("Only Admin can delete sales.", "err"); return; }
  const sale = state.sales.find(s=>s.id===id);
  if(!sale) return;
  confirmDialog(`Delete receipt <b>${sale.receiptNumber}</b>? This restores ${sale.items.length} item(s) back to stock and removes any linked debt/advance record. This cannot be undone.`, async ()=>{
    for(const item of sale.items){
      const product = state.products.find(p=>p.id===item.productId);
      if(product){
        product.currentStock = +(product.currentStock + item.qtyInStockUnit).toFixed(4);
        await dataSet("products", product);
        await dataSet("stockHistory", { id:genId("stk"), productId:product.id, productName:product.name,
          type:"Sale Deleted (Restock)", change:item.qtyInStockUnit, reference:sale.receiptNumber,
          createdAt:Date.now(), by:state.user.name });
      }
    }
    const linkedDebt = state.debts.find(d=>d.saleId===sale.id);
    if(linkedDebt){ await dataDelete("debts", linkedDebt.id); state.debts = state.debts.filter(d=>d.id!==linkedDebt.id); }
    const linkedAdv = state.advances.find(a=>a.saleId===sale.id);
    if(linkedAdv){ await dataDelete("advancePayments", linkedAdv.id); state.advances = state.advances.filter(a=>a.id!==linkedAdv.id); }
    await dataDelete("sales", sale.id);
    await dataDelete("receipts", sale.id);
    state.sales = state.sales.filter(s=>s.id!==sale.id);
    state.receipts = state.receipts.filter(s=>s.id!==sale.id);
    toast(`Receipt ${sale.receiptNumber} deleted — stock restored.`, "ok");
    renderReceipts();
  });
};

/* Value (in currency) of everything a customer has physically collected
   so far on an Advance Payment record, using the per-unit price captured
   at the time the products were reserved (falls back to the product's
   current catalogue price if that wasn't recorded, e.g. older/manual
   records). */
function advCollectedValue(adv){
  return (adv.products||[]).reduce((sum,p)=>{
    let price = p.unitPrice;
    if(price==null || isNaN(price)){
      const product = state.products.find(x=>x.name===p.productName);
      price = product ? unitPriceFor(product, p.unit) : 0;
    }
    return sum + (p.collected||0)*price;
  }, 0);
}
/* If a customer has collected more product value than they've actually
   paid for (whether on a Sales-screen Advance Payment or one added/edited
   from the Credit & Advance tab), the uncovered portion is a real debt —
   goods already left the shop without being paid for. This keeps a
   linked record in the Credit Sales (Debtors) ledger in sync with that
   shortfall automatically, so it shows up on the debit/credit side
   instead of staying invisible inside the advance record. */
async function syncAdvanceDebt(adv){
  const collectedValue = advCollectedValue(adv);
  const overage = Math.max(0, +(collectedValue - adv.amountPaid).toFixed(2));
  let debt = state.debts.find(d=>d.advanceId===adv.id);
  if(overage > 0.009){
    if(!debt){
      debt = { id:genId("debt"), customerId:adv.customerId, customerName:adv.customerName, phone:adv.phone||"",
        saleId:null, advanceId:adv.id, receiptNumber:adv.receiptNumber, total:overage, amountPaid:0, balance:overage,
        dueDate:null, createdAt:Date.now(), history:[],
        notes:`Auto: goods collected exceed amount paid on Advance ${adv.receiptNumber}` };
      await dataSet("debts", debt); state.debts.push(debt);
      toast("Customer collected more than they paid for — the balance was moved to Credit & Advance (Debtors)", "warn");
    } else {
      debt.total = overage;
      debt.balance = Math.max(0, +(overage - debt.amountPaid).toFixed(2));
      debt.customerName = adv.customerName; debt.phone = adv.phone||debt.phone;
      await dataSet("debts", debt);
    }
  } else if(debt){
    const hasActivity = debt.amountPaid>0.009 || (debt.history && debt.history.length>0);
    if(!hasActivity){
      // nothing was ever paid against this shortfall directly — the
      // top-up on the advance covered it, so the auto-record is no
      // longer needed
      await dataDelete("debts", debt.id);
      state.debts = state.debts.filter(d=>d.id!==debt.id);
    } else {
      debt.balance = 0;
      await dataSet("debts", debt);
    }
  }
}

    if(debt.advanceId){
      // This debt mirrors the shortfall between goods collected and amount
      // paid on a linked Advance Payment. Settle it by crediting the
      // payment onto the advance itself and re-deriving the balance from
      // that — crediting both the advance AND decrementing debt.balance
      // directly would count the same payment twice.
      debt.history.push({amount:amt, date:Date.now()});
      const adv = state.advances.find(a=>a.id===debt.advanceId);
      if(adv){
        adv.amountPaid += amt;
        await dataSet("advancePayments", adv);
        await syncAdvanceDebt(adv);
      } else {
        // orphaned link (advance record no longer exists) — settle plainly
        debt.amountPaid += amt; debt.balance -= amt;
        await dataSet("debts", debt);
      }
    } else {
      debt.amountPaid += amt; debt.balance -= amt; debt.history.push({amount:amt, date:Date.now()});
      await dataSet("debts", debt);
    }
    await dataSet("payments", { id:genId("pay"), type:"debt", debtId:debt.id, amount:amt, createdAt:Date.now(), by:state.user.name });
    // Push this payment's progress back onto the original sale so Sales
    // History (and its receipt) automatically reflect the customer's
    // current debit/credit balance instead of the one-time snapshot
    // recorded at checkout.
    if(debt.saleId){
      const linkedSale = state.sales.find(s=>s.id===debt.saleId);
      if(linkedSale){
        linkedSale.amountPaid = debt.amountPaid;
        linkedSale.balance = debt.balance;
        linkedSale.status = debt.balance<=0.009 ? "Paid" : "Partial/Owing";
        await dataSet("sales", linkedSale);
        await dataSet("receipts", { id:linkedSale.id, ...linkedSale });
        const rxIdx = state.receipts.findIndex(r=>r.id===linkedSale.id);
        if(rxIdx>-1) state.receipts[rxIdx] = { id:linkedSale.id, ...linkedSale };
      }
    }
    closeModal(); toast("Payment recorded","ok"); drawCreditTab("debts");
  };
};
window.viewAdvance = function(id){

  const rowHtml = (p, idx)=>{
    const product = state.products.find(x=>x.name===p.productName);

    return `<div class="adv-prod-row" data-idx="${idx}" style="display:flex;gap:8px;margin-bottom:6px;align-items:center;flex-wrap:wrap">
      <select class="advProdSel" style="flex:2;min-width:140px;padding:7px;border-radius:8px;border:1px solid var(--line)">

      </select>

      <span style="font-size:11.5px;color:var(--ink-soft);white-space:nowrap">Collected: ${fmtQty(p.collected)}</span>
      <input class="advCollectNow" type="number" min="0" max="${Math.max(0,p.reserved-p.collected)}" step="0.01" placeholder="Collect now" style="width:95px;padding:7px;border-radius:8px;border:1px solid var(--line)">
      <button class="icon-sm advRemRow" title="${p.collected>0?'Cannot remove — already partially collected':'Remove product'}" ${p.collected>0?"disabled":""}>✕</button>
    </div>`;
  };
  openModal(`<div class="modal-head"><h3>Advance Payment — ${escapeHtml(adv.customerName)}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="grid grid-3" style="margin-bottom:14px">
      <div class="card stat-card"><div class="lbl">Paid</div><div class="val" style="font-size:16px">${money(adv.amountPaid)}</div></div>
      <div class="card stat-card"><div class="lbl">Balance</div><div class="val" style="font-size:16px">${money(adv.balance)}</div></div>
      <div class="card stat-card"><div class="lbl">Store Credit</div><div class="val" style="font-size:16px">${money(adv.creditBalance)}</div></div>
    </div>
    ${owedForCollected>0.009 ? `<div class="pay-detail-note" style="background:var(--danger-light);color:var(--danger);border-radius:8px;padding:9px 12px;margin-bottom:14px">
      ⚠️ Customer has collected <b>${money(owedForCollected)}</b> worth of goods beyond what they've paid for. This has been automatically recorded as a debt in <b>Credit & Advance → Credit Sales (Debtors)</b>.</div>` : ""}
    <div class="field"><label>Total Value of Goods (optional)</label><input type="number" id="advTotal" min="0" value="${adv.total!==null&&adv.total!==undefined?adv.total:''}" placeholder="Leave blank if unknown"></div>
    <div class="section-head" style="margin-top:10px"><h3 style="font-size:13.5px">Reserved Products</h3>
      <button class="btn btn-ghost btn-sm" id="advAddRow">+ Add product</button></div>
    <div id="advRows">${adv.products.map(rowHtml).join("")}</div>
    <p style="font-size:11.5px;color:var(--ink-soft);margin-top:4px">If a customer collects more product value than they've paid for, the shortfall is automatically moved into the Credit & Advance debtors ledger when you hit Save.</p>
    <div class="field" style="margin-top:12px"><label>Additional Payment Now (optional)</label><input type="number" id="advExtraPay" min="0" value="0">
      <p style="font-size:11.5px;color:var(--ink-soft);margin-top:4px">You can pay more than the outstanding balance — any excess is added to Store Credit.</p></div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">Close</button>
  <button class="btn btn-gold" onclick="viewAdvanceReceipt('${adv.id}')">🧾 Receipt</button>
  <button class="btn btn-primary" id="advSave">Save</button></div>`, {lg:true});

  const rowsHost = document.getElementById("advRows");
  const wireRow = (row)=>{
    const prodSel = row.querySelector(".advProdSel"), unitSel = row.querySelector(".advUnitSel");
    prodSel.addEventListener("change", ()=>{
      const p = state.products.find(x=>x.name===prodSel.value);
      unitSel.innerHTML = sellableUnits(p).map(u=>`<option>${u.unit}</option>`).join("");
    });
    row.querySelector(".advRemRow").addEventListener("click", ()=>{ if(!row.querySelector(".advRemRow").disabled) row.remove(); });
  };
  [...rowsHost.children].forEach(wireRow);
  document.getElementById("advAddRow").addEventListener("click", ()=>{
    if(!state.products.length) return toast("Add a product first","warn");
    const div = document.createElement("div");
    div.innerHTML = rowHtml({productName:state.products[0].name, reserved:1, unit:sellableUnits(state.products[0])[0]?.unit||"", collected:0}, -1);
    const row = div.firstElementChild;
    rowsHost.appendChild(row); wireRow(row);
  });

  document.getElementById("advSave").onclick = async ()=>{
    const newProducts = [...rowsHost.children].map(row=>{
      const reserved = Math.max(0, +row.querySelector(".advResQty").value||0);
      const collectNow = Math.max(0, +row.querySelector(".advCollectNow").value||0);
      const existingIdx = +row.dataset.idx;
      const priorCollected = existingIdx>=0 ? adv.products[existingIdx].collected : 0;
      const collected = Math.min(reserved, priorCollected + collectNow);
      const productName = row.querySelector(".advProdSel").value;
      const unit = row.querySelector(".advUnitSel").value;
      // keep the price recorded when this product was originally reserved
      // (e.g. the actual sale price) unless the product/unit was changed,
      // in which case fall back to the current catalogue price
      const prior = existingIdx>=0 ? adv.products[existingIdx] : null;
      let unitPrice = (prior && prior.productName===productName && prior.unit===unit && prior.unitPrice!=null) ? prior.unitPrice : null;
      if(unitPrice==null){
        const product = state.products.find(x=>x.name===productName);
        unitPrice = product ? unitPriceFor(product, unit) : 0;
      }
      return { productName, unit, reserved, collected, unitPrice };
    }).filter(p=>p.reserved>0);
    if(!newProducts.length) return toast("Keep at least one reserved product","err");
    adv.products = newProducts;

    const totalInput = document.getElementById("advTotal").value;
    adv.total = totalInput ? Math.max(0, +totalInput) : null;

    const extra = Math.max(0, +document.getElementById("advExtraPay").value||0);
    if(extra>0){
      if(adv.balance>0){
        const towardBalance = Math.min(adv.balance, extra);
        adv.balance -= towardBalance;
        adv.creditBalance += (extra-towardBalance);
      } else {
        adv.creditBalance += extra;
      }
      adv.amountPaid += extra;
    }
    // if total was edited, recompute balance/credit against the new total
    if(adv.total!==null){
      const net = adv.total - adv.amountPaid;
      adv.balance = Math.max(0, net);
      adv.creditBalance = Math.max(0, -net);
    }

    const allCollected = adv.products.every(p=>p.collected >= p.reserved-1e-9);
    const anyCollected = adv.products.some(p=>p.collected>0);
    adv.collectionStatus = allCollected ? "Fully Collected" : anyCollected ? "Partially Collected" : "Not Collected";
    await dataSet("advancePayments", adv);
    const owedBefore = state.debts.find(d=>d.advanceId===adv.id)?.balance || 0;
    await syncAdvanceDebt(adv);
    const owedAfter = state.debts.find(d=>d.advanceId===adv.id)?.balance || 0;
    closeModal();
    if(owedAfter>0.009 && owedAfter!==owedBefore){
      toast(`Advance payment updated — ${money(owedAfter)} owed for collected goods moved to Debtors`, "warn");
    } else {
      toast("Advance payment updated","ok");
    }
    drawCreditTab("advances");
  };
};

function exportCSV(rows, filename){
  if(!rows.length) return toast("Nothing to export","warn");
  const headers = Object.keys(rows[0]);
  const csv = [headers.join(","), ...rows.map(r=>headers.map(h=>`"${String(r[h]??"").replace(/"/g,'""')}"`).join(","))].join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

function renderReports(){
  const html = `<div class="card">
    <div class="section-head"><div><h3>Reports</h3><p>Pick a date range and report type</p></div>
      <div class="toolbar">
        <input type="date" id="repFrom"><input type="date" id="repTo">
        <select id="repType"><option value="sales">Sales</option><option value="profit">Profit</option>
          <option value="expense">Expense</option><option value="inventory">Inventory</option>
          <option value="customer">Customer</option><option value="debtors">Debtors</option>
          <option value="advance">Advance Payments</option><option value="salesrep">Sales Rep</option></select>
        <button class="btn btn-ghost btn-sm" id="runReport">Run</button>
        <button class="btn btn-gold btn-sm" id="exportReport">Export CSV</button>
        <button class="btn btn-ghost btn-sm" id="printReport">🖨️ Print</button>
      </div>
    </div>
    <div id="reportOut"></div>
  </div>`;
  setContent(html);
  const today = new Date().toISOString().slice(0,10);
  document.getElementById("repFrom").value = today; document.getElementById("repTo").value = today;
  document.getElementById("runReport").addEventListener("click", runReport);
  document.getElementById("exportReport").addEventListener("click", ()=>{
    const rows = window.__lastReportRows||[];
    exportCSV(rows, "report.csv");
  });
  document.getElementById("printReport").addEventListener("click", ()=>{
    const area=document.getElementById("printArea");
    area.innerHTML = `<div style="padding:20px">${document.getElementById("reportOut").innerHTML}</div>`;
    area.style.display="block"; setTimeout(()=>{window.print(); area.style.display="none";},200);
  });
  runReport();
}
function runReport(){
  const from = new Date(document.getElementById("repFrom").value).setHours(0,0,0,0);
  const to = new Date(document.getElementById("repTo").value).setHours(23,59,59,999);
  const type = document.getElementById("repType").value;
  const inRange = s=> s.createdAt>=from && s.createdAt<=to;
  let rows = [], cols = [];
  if(type==="sales"){
    const data = state.sales.filter(inRange);
    cols=["Receipt","Customer","Cashier","Total","Method","Date"];
    rows = data.map(s=>({ Receipt:s.receiptNumber, Customer:s.customerName, Cashier:s.cashierName, Total:s.total, Method:s.paymentMethod, Date:fmtDate(s.createdAt) }));
  } else if(type==="profit"){
    const data = state.sales.filter(inRange);
    cols=["Receipt","Revenue","Cost","Profit"];
    rows = data.map(s=>{ const cost=s.items.reduce((a,i)=>a+i.unitCost*i.qtySold,0); return { Receipt:s.receiptNumber, Revenue:s.total, Cost:cost, Profit:s.total-cost }; });
  } else if(type==="expense"){
    const data = state.expenses.filter(inRange);
    cols=["Category","Amount","Notes","Date"];
    rows = data.map(e=>({ Category:e.category, Amount:e.amount, Notes:e.notes, Date:fmtDate(e.createdAt) }));
  } else if(type==="inventory"){
    cols=["Product","Category","Stock","Unit","Value"];
    rows = state.products.map(p=>({ Product:p.name, Category:p.category, Stock:p.currentStock, Unit:p.stockUnit, Value:p.currentStock*p.costPrice }));
  } else if(type==="customer"){
    cols=["Customer","Phone","Purchases","Total Spent"];
    rows = state.customers.map(c=>{ const s=state.sales.filter(x=>x.customerId===c.id); return { Customer:c.name, Phone:c.phone, Purchases:s.length, "Total Spent":s.reduce((a,x)=>a+x.total,0) }; });
  } else if(type==="debtors"){
    cols=["Customer","Phone","Receipt","Balance"];
    rows = state.debts.filter(d=>d.balance>0).map(d=>({ Customer:d.customerName, Phone:d.phone, Receipt:d.receiptNumber, Balance:d.balance }));
  } else if(type==="advance"){
    cols=["Customer","Receipt","Paid","Balance","Store Credit","Status"];
    rows = state.advances.map(a=>({ Customer:a.customerName, Receipt:a.receiptNumber, Paid:a.amountPaid, Balance:a.balance, "Store Credit":a.creditBalance||0, Status:a.collectionStatus }));
  } else if(type==="salesrep"){
    const data = state.sales.filter(inRange);
    const byRep = {};
    data.forEach(s=>{ byRep[s.cashierName]=byRep[s.cashierName]||{count:0,total:0}; byRep[s.cashierName].count++; byRep[s.cashierName].total+=s.total; });
    cols=["Sales Rep","Transactions","Total Sales"];
    rows = Object.entries(byRep).map(([k,v])=>({ "Sales Rep":k, Transactions:v.count, "Total Sales":v.total }));
  }
  window.__lastReportRows = rows;
  const out = document.getElementById("reportOut");
  if(!rows.length){ out.innerHTML = `<div class="empty-state"><div class="ic">📈</div>No data for this range</div>`; return; }
  out.innerHTML = `<div class="table-wrap" style="margin-top:14px"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${typeof r[c]==="number"?money(r[c]).replace(/^\D+/,'').length&&["Total","Amount","Balance","Profit","Revenue","Cost","Total Spent","Value","Total Sales","Paid","Store Credit"].includes(c)?money(r[c]):r[c]:escapeHtml(String(r[c]??""))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function renderSettings(){
  const s = state.settings;
  const html = `

      <div class="section-head"><h3>Store Information</h3></div>
      <div class="form-grid">
        <div class="field"><label>Store Name</label><input id="stName" value="${escapeHtml(s.name)}" ${can("changeSettings")?"":"disabled"}></div>
        <div class="field"><label>Phone</label><input id="stPhone" value="${escapeHtml(s.phone)}" ${can("changeSettings")?"":"disabled"}></div>
        <div class="field" style="grid-column:1/-1"><label>Address</label><input id="stAddr" value="${escapeHtml(s.address||"")}" ${can("changeSettings")?"":"disabled"}></div>
        <div class="field" style="grid-column:1/-1"><label>Receipt Footer</label><input id="stFooter" value="${escapeHtml(s.footer||"")}" ${can("changeSettings")?"":"disabled"}></div>
        <div class="field" style="grid-column:1/-1"><label>Return Policy</label><textarea id="stPolicy" ${can("changeSettings")?"":"disabled"}>${escapeHtml(s.returnPolicy||"")}</textarea></div>
        <div class="field"><label>Currency Symbol</label><input id="stCurr" value="${escapeHtml(s.currency||"₦")}" ${can("changeSettings")?"":"disabled"}></div>
        <div class="field"><label>Default Tax %</label><input type="number" id="stTax" value="${s.taxRate||0}" ${can("changeSettings")?"":"disabled"}></div>
      </div>
      ${can("changeSettings")?`<button class="btn btn-primary" id="stSave" style="margin-top:10px">Save Settings</button>`:`<p style="font-size:12px;color:var(--ink-soft)">Only Admin can change settings.</p>`}
    </div>
    <div class="card">
      <div class="section-head"><h3>Appearance</h3></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)">
        <span>Dark Mode</span><label class="switch"><input type="checkbox" id="darkToggle" ${state.theme==="dark"?"checked":""}><span class="slider"></span></label>
      </div>
      <div class="section-head" style="margin-top:18px"><h3>Backup &amp; Restore</h3></div>
      <p style="font-size:12.5px;color:var(--ink-soft)">Download a full backup of all local data, or restore from a backup file.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" id="backupBtn">⬇️ Download Backup</button>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer">⬆️ Restore Backup<input type="file" id="restoreFile" accept=".json" hidden></label>
        ${can("changeSettings")?`<button class="btn btn-danger btn-sm" id="resetBtn">⚠️ System Reset</button>`:""}
      </div>
      <div class="section-head" style="margin-top:18px"><h3>Firebase Connection</h3></div>
      <p style="font-size:12.5px;color:var(--ink-soft)">Database: <b>${FIREBASE_READY?"Connected":"Not configured — running offline via IndexedDB"}</b><br>
      Authentication: <b>${FIREBASE_AUTH_READY?"Firebase (server-verified sign-in)":FIREBASE_READY?"Not enabled — enable Email/Password sign-in in Firebase Console":"Local only — offline device"}</b><br>
      Add your Firebase project keys in the firebaseConfig object near the top of the script to enable live sync.</p>
    </div>
  </div>`;
  setContent(html);
  if(can("changeSettings")){
    document.getElementById("stSave").addEventListener("click", async ()=>{
      const updated = Object.assign({}, s, { id:"store_info",
        name:document.getElementById("stName").value.trim(), phone:document.getElementById("stPhone").value.trim(),
        address:document.getElementById("stAddr").value.trim(), footer:document.getElementById("stFooter").value.trim(),
        returnPolicy:document.getElementById("stPolicy").value.trim(), currency:document.getElementById("stCurr").value.trim()||"₦",
        taxRate:+document.getElementById("stTax").value||0 });
      await dataSet("settings", updated); state.settings = updated;
      toast("Settings saved","ok");
    });
    document.getElementById("resetBtn").addEventListener("click", ()=> confirmDialog("This will erase ALL local data (products, sales, customers, etc). This cannot be undone. Continue?", async ()=>{
      for(const c of COLLECTIONS){ const all = await idbGetAll(c); for(const r of all) await idbDelete(c, r.id); }
      toast("System reset. Reloading…","ok"); setTimeout(()=>location.reload(), 1200);
    }));
  }
  document.getElementById("darkToggle").addEventListener("change",(e)=>{
    state.theme = e.target.checked?"dark":"light";
    localStorage.setItem("pos_theme", state.theme);
    document.documentElement.setAttribute("data-theme", state.theme);
  });
  document.getElementById("backupBtn").addEventListener("click", async ()=>{
    const dump = {};
    for(const c of COLLECTIONS) dump[c] = await idbGetAll(c);
    const blob = new Blob([JSON.stringify(dump,null,2)], {type:"application/json"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`excellence-store-backup-${Date.now()}.json`; a.click();
  });
  document.getElementById("restoreFile").addEventListener("change",(e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const dump = JSON.parse(reader.result);
        for(const c of COLLECTIONS){ if(dump[c]) for(const r of dump[c]) await idbPut(c, r); }
        toast("Backup restored. Reloading…","ok"); setTimeout(()=>location.reload(), 1200);
      }catch(err){ toast("Invalid backup file","err"); }
    };
    reader.readAsText(file);
  });
}

</script>
<script>
// Register service worker so the app can be installed and used offline.
// This is additive only — it does not read, write, or interfere with any app data.
// Note: browsers (Chrome included) require the service worker script to be
// fetched from a real same-origin URL — a Blob URL is rejected outright.
// So this points to a real file, sw.js, that sits next to index.html.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
