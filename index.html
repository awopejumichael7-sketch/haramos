<style>
/* ============================================================
   HARAMOS ENTERPRISE POS — DESIGN TOKENS
   ============================================================ */
:root{
  --brand:#0F7B55;        /* deep palm green — grocery/produce */
  --brand-dark:#0B5C40;
  --brand-light:#E4F3EC;
  --gold:#E3A008;         /* naira / receipt accent */
  --gold-light:#FCF0D4;
  --ink:#1B2420;
  --ink-soft:#5B6B63;
  --bg:#F6F4EE;
  --card:#FFFFFF;
  --line:#E7E2D6;
  --danger:#C0392B;
  --danger-light:#FBE7E4;
  --warn:#B9770E;
  --warn-light:#FCF3E3;
  --ok:#1E8449;
  --ok-light:#E6F5EB;
  --info:#1F6FB2;
  --info-light:#E7F1FA;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(27,36,32,.04), 0 6px 20px rgba(27,36,32,.06);
  --font-display:'Poppins',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'Roboto Mono',monospace;
}
[data-theme="dark"]{
  --brand:#22B573; --brand-dark:#1A9A61; --brand-light:#0F2A20;
  --ink:#EDEFEC; --ink-soft:#A7B3AC;
  --bg:#0F1512; --card:#161E19; --line:#26312B;
  --gold-light:#2B2412; --danger-light:#301715; --warn-light:#2E2410; --ok-light:#0F2A20; --info-light:#101F2C;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--ink);}
button,input,select,textarea{font-family:inherit;font-size:14px;}
button{cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
.mono{font-family:var(--font-mono);}
.hidden{display:none !important;}
a{color:inherit;}

/* ---------- App shell ---------- */
#app{height:100%;}
.screen{height:100%;}

/* ---------- Login ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 20%, var(--brand-light), var(--bg) 55%);padding:20px;}
.login-card{width:100%;max-width:380px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  padding:36px 32px 28px;border:1px solid var(--line);}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center;}
.login-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:24px;
  box-shadow:0 8px 20px rgba(15,123,85,.35);}
.login-brand h1{font-size:20px;}
.login-brand span{color:var(--ink-soft);font-size:13px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;transition:transform .08s, box-shadow .15s, background .15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-block{width:100%;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-gold{background:var(--gold);color:#3a2a00;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.login-demo{margin-top:18px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--ink-soft);line-height:1.6;}
.login-err{background:var(--danger-light);color:var(--danger);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}

/* ---------- Layout ---------- */
#mainScreen{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:230px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line);}
.sidebar-brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));
  color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;}
.sidebar-brand div h2{font-size:14.5px;}
.sidebar-brand div span{font-size:11px;color:var(--ink-soft);}
.nav{flex:1;overflow-y:auto;padding:10px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink-soft);
  font-size:13.5px;font-weight:500;margin-bottom:2px;cursor:pointer;user-select:none;}
.nav-item:hover{background:var(--brand-light);color:var(--brand-dark);}
.nav-item.active{background:var(--brand);color:#fff;}
.nav-item .ic{width:18px;text-align:center;}
.nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);opacity:.6;
  padding:14px 12px 6px;}
.sidebar-foot{padding:12px;border-top:1px solid var(--line);}
.user-chip{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;background:var(--bg);}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#3a2a00;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:13px;}
.user-chip div{flex:1;min-width:0;}
.user-chip .name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-chip .role{font-size:10.5px;color:var(--ink-soft);text-transform:capitalize;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  border-bottom:1px solid var(--line);background:var(--card);}
.topbar h1{font-size:17px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.status-pill{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:20px;}
.status-online{background:var(--ok-light);color:var(--ok);}
.status-offline{background:var(--danger-light);color:var(--danger);}
.status-syncing{background:var(--warn-light);color:var(--warn);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;}
.icon-btn:hover{background:var(--brand-light);}
.badge-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--card);}
.content{flex:1;overflow-y:auto;padding:22px;}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:760px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.stat-card{display:flex;flex-direction:column;gap:6px;}
.stat-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.stat-card .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.stat-card .val{font-family:var(--font-display);font-size:23px;font-weight:700;}
.stat-card .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:500;}
.stat-card .trend{font-size:11px;font-weight:600;}
.trend-up{color:var(--ok);}
.trend-down{color:var(--danger);}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.section-head h3{font-size:15.5px;}
.section-head p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);
  padding:10px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.pill-ok{background:var(--ok-light);color:var(--ok);}
.pill-warn{background:var(--warn-light);color:var(--warn);}
.pill-danger{background:var(--danger-light);color:var(--danger);}
.pill-info{background:var(--info-light);color:var(--info);}
.pill-gold{background:var(--gold-light);color:var(--warn);}
.row-actions{display:flex;gap:6px;}
.icon-sm{width:29px;height:29px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:inline-flex;
  align-items:center;justify-content:center;font-size:13px;}
.icon-sm:hover{background:var(--brand-light);}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;
  padding:9px 13px;min-width:230px;}
.searchbox input{border:none;background:transparent;flex:1;outline:none;color:var(--ink);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:36px;margin-bottom:10px;}

/* ---------- Sales screen ---------- */
.pos-layout{display:grid;grid-template-columns:1fr 380px;gap:16px;height:100%;}
@media (max-width:1050px){.pos-layout{grid-template-columns:1fr;}}
.pos-catalog{display:flex;flex-direction:column;min-height:0;height:100%;}
.pos-toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;flex-shrink:0;}
.pos-toolbar-row2{display:flex;gap:8px;}
.pos-search{width:100%;}
.pos-catselect{flex:1;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-width:0;}
.pos-heldbtn{flex-shrink:0;white-space:nowrap;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;overflow-y:auto;padding-bottom:8px;}
.product-tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;
  transition:.12s;text-align:left;display:flex;flex-direction:column;gap:6px;}
.product-tile:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow);}
.product-tile:active{transform:scale(.97);}
.product-tile .cat{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.product-tile .nm{font-size:13px;font-weight:600;line-height:1.3;}
.product-tile .pr{font-size:13.5px;color:var(--brand-dark);font-weight:700;}
.product-tile .st{font-size:10.5px;color:var(--ink-soft);}
.product-tile.low{border-color:var(--warn);}
.product-tile.out{opacity:.5;cursor:not-allowed;}
.tile-units{display:flex;flex-direction:column;gap:2px;margin-top:2px;padding-top:6px;border-top:1px dashed var(--line);}
.tile-unit-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:10.5px;padding:2px 4px;border-radius:6px;}
.tile-unit-row:hover{background:var(--bg);}
.tile-unit-name{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile-unit-name b{color:var(--ink);font-weight:600;}
.tile-unit-name i{font-style:normal;color:var(--ink-soft);opacity:.75;}
.tile-unit-price{font-weight:700;color:var(--brand-dark);white-space:nowrap;}
.cart-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;
  box-shadow:var(--shadow);overflow:hidden;min-height:0;}
.cart-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.cart-scroll{flex:1;overflow-y:auto;min-height:0;}
.cust-picker-wrap{padding:10px 14px 0;}
.cart-items{padding:8px 12px;min-height:60px;}
.cart-line{padding:10px 4px;border-bottom:1px solid var(--line);}
.cart-line-top{display:flex;justify-content:space-between;gap:8px;}
.cart-line-nm{font-size:13px;font-weight:600;}
.cart-line-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.cart-line-equiv{font-size:10.5px;color:var(--brand-dark);font-weight:600;margin-top:1px;}
.qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
.qty-ctrl button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg);flex-shrink:0;}
.qty-ctrl input{width:48px;text-align:center;padding:5px 2px;border-radius:6px;border:1px solid var(--line);flex-shrink:0;}
.qty-ctrl select{padding:5px 6px;border-radius:6px;border:1px solid var(--line);font-size:11.5px;min-width:0;}
.cart-summary{padding:10px 16px 4px;background:var(--bg);border-top:1px solid var(--line);}
.cart-num-input{width:90px;max-width:36vw;text-align:right;padding:5px 8px;border-radius:6px;border:1px solid var(--line);}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:4px 0;color:var(--ink-soft);flex-wrap:wrap;}
.cart-row.total{font-size:17px;font-weight:700;color:var(--ink);padding-top:8px;border-top:1px dashed var(--line);margin-top:4px;}

<script type="module">
/* ============================================================
   HARAMOS ENTERPRISE — POS ENGINE
   Vanilla JS ES2023 · Firebase v11 Modular SDK · IndexedDB cache
   ============================================================ */

/* ------------------------------------------------------------------
   1. FIREBASE — v11 Modular SDK
   Fill in your Firebase project credentials below. Until you do, the
   app runs entirely on the local IndexedDB cache (fully functional
   offline POS), and will automatically start syncing to Firestore
   the moment valid credentials are supplied.
------------------------------------------------------------------ */
const firebaseConfig = {
 apiKey: "AIzaSyDROdje0eQ3wdB7PlvjGMdK5tdQEqREJ6w",
    authDomain: "haramos-b29ca.firebaseapp.com",
    projectId: "haramos-b29ca",
    storageBucket: "haramos-b29ca.firebasestorage.app",
    messagingSenderId: "969750732825",
    appId: "1:969750732825:web:2d5257f763096278ce4a88"
};

let fbApp = null, fbDb = null, fbStorage = null, fbAuth = null, FIREBASE_READY = false, FIREBASE_AUTH_READY = false;
let firestoreApi = null, firebaseAuthApi = null;

async function initFirebase(){
  if (!firebaseConfig.apiKey || !firebaseConfig.projectId) {
    console.info("[Firebase] No credentials supplied — running in local/offline mode only.");
    return;
  }
  try{
    const [{ initializeApp }, firestoreMod, { getStorage }, authMod] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js"),
      import("https://www.gstatic.com/firebasejs/11.0.2/firebase-storage.js"),
      import("https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js")
    ]);
    fbApp = initializeApp(firebaseConfig);
    fbDb = firestoreMod.getFirestore(fbApp);
    fbStorage = getStorage(fbApp);
    firestoreApi = firestoreMod;
    FIREBASE_READY = true;
    console.info("[Firebase] Connected to project:", firebaseConfig.projectId);

    // Firebase Authentication — real, server-verified login. Kept in its own
    // try/catch so a Firestore-only project (Auth not yet enabled in console)
    // still works exactly as before, just without server-side auth.
    try{
      firebaseAuthApi = authMod;
      fbAuth = authMod.getAuth(fbApp);
      await authMod.setPersistence(fbAuth, authMod.browserLocalPersistence);
      FIREBASE_AUTH_READY = true;
      console.info("[Firebase Auth] Ready.");
    }catch(authErr){
      console.warn("[Firebase Auth] Not available — falling back to local login only.", authErr);
      FIREBASE_AUTH_READY = false;
    }
  }catch(err){
    console.warn("[Firebase] Failed to initialize — falling back to offline mode.", err);
    FIREBASE_READY = false;
  }
}

/* ------------------------------------------------------------------
   2. INDEXEDDB — offline cache / local database
------------------------------------------------------------------ */
const COLLECTIONS = ["products","sales","customers","suppliers","users","stockHistory",
  "payments","receipts","settings","expenses","categories","debts","advancePayments",
  "returns","heldSales","syncQueue"];
const DB_NAME = "aduragbemi_pos_db";
const DB_VERSION = 1;
let idb = null;

function openIDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      COLLECTIONS.forEach(name=>{
        if(!db.objectStoreNames.contains(name)){
          db.createObjectStore(name, { keyPath: "id" });
        }
      });
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = (e)=> reject(e.target.error);
  });
}
function idbTx(store, mode){ return idb.transaction(store, mode).objectStore(store); }
function idbGetAll(store){
  return new Promise((res,rej)=>{
    const r = idbTx(store,"readonly").getAll();
    r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
  });
}
function idbGet(store,id){
  return new Promise((res,rej)=>{
    const r = idbTx(store,"readonly").get(id);
    r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error);
  });
}
function idbPut(store,obj){
  return new Promise((res,rej)=>{
    const r = idbTx(store,"readwrite").put(obj);
    r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error);
  });
}
function idbDelete(store,id){
  return new Promise((res,rej)=>{
    const r = idbTx(store,"readwrite").delete(id);
    r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error);
  });
}

/* ------------------------------------------------------------------
   3. UNIVERSAL DATA LAYER
   Every write lands in IndexedDB immediately (so the POS never blocks
   on network), then is mirrored to Firestore when available. If
   offline or Firestore fails, the write is queued and flushed once
   connectivity + credentials are available.
------------------------------------------------------------------ */
async function dataGetAll(collection){
  if(FIREBASE_READY && navigator.onLine){
    try{
      const { collection: col, getDocs } = firestoreApi;
      const snap = await getDocs(col(fbDb, collection));
      const rows = []; snap.forEach(d=>rows.push(d.data()));
      for(const r of rows) await idbPut(collection, r); // refresh cache
      return rows;
    }catch(e){ console.warn("Firestore read failed, using cache", e); }
  }
  return idbGetAll(collection);
}
async function dataSet(collection, obj){
  if(!obj.id) obj.id = genId(collection);
  obj.updatedAt = Date.now();
  await idbPut(collection, obj);
  if(FIREBASE_READY && navigator.onLine){
    try{
      const { doc, setDoc } = firestoreApi;
      await setDoc(doc(fbDb, collection, obj.id), obj);
      return obj;
    }catch(e){ console.warn("Firestore write failed, queueing", e); }
  }
  await queueSync(collection, "set", obj);
  return obj;
}
async function dataDelete(collection, id){
  await idbDelete(collection, id);
  if(FIREBASE_READY && navigator.onLine){
    try{
      const { doc, deleteDoc } = firestoreApi;
      await deleteDoc(doc(fbDb, collection, id));
      return true;
    }catch(e){ console.warn("Firestore delete failed, queueing", e); }
  }
  await queueSync(collection, "delete", { id });
  return true;
}
async function queueSync(collection, op, obj){
  await idbPut("syncQueue", { id: genId("syncQueue"), collection, op, obj, queuedAt: Date.now() });
  updateConnPill();
}
async function flushSyncQueue(){
  if(!FIREBASE_READY || !navigator.onLine) return;
  const queue = await idbGetAll("syncQueue");
  if(!queue.length) return;
  setConn("syncing");
  const { doc, setDoc, deleteDoc } = firestoreApi;
  for(const item of queue){
    try{
      if(item.op === "set") await setDoc(doc(fbDb, item.collection, item.obj.id), item.obj);
      else if(item.op === "delete") await deleteDoc(doc(fbDb, item.collection, item.obj.id));
      await idbDelete("syncQueue", item.id);
    }catch(e){
      // A single stuck/invalid item must never stop every other queued item
      // from syncing — log it, count the attempt, and move on to the next
      // item instead of aborting the whole batch (previously: `break`).
      const retries = (item.retries || 0) + 1;
      console.warn(`Sync item failed (attempt ${retries}), will retry later —`, item.collection, item.op, e);
      try{ await idbPut("syncQueue", { ...item, retries, lastError: (e && e.message) || String(e) }); }catch(_){}
    }
  }
  updateConnPill();
}
function genId(prefix){ return prefix.slice(0,3) + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ------------------------------------------------------------------
   7. BOOT SEQUENCE
------------------------------------------------------------------ */
(async function boot(){
  try{
    setBootMsg("Preparing local database…");
    idb = await openIDB();
    await initFirebase();

    // Confirm (or rule out) a persisted Firebase Auth session BEFORE the
    // first Firestore reads/writes below. Firestore rules check
    // request.auth, so without this, seedIfEmpty()/reloadAll() would ask
    // Firestore for data while Firebase still thinks no one is signed in —
    // producing a "Missing or insufficient permissions" error on every load
    // even though the user is really logged in. waitForFirebaseUser()
    // resolves almost instantly (it's reading Firebase's own local
    // persistence, same-device), so this adds no perceptible delay; if
    // there's no session yet (login screen), it resolves right away too.
    if (FIREBASE_AUTH_READY) {
      setBootMsg("Restoring session…");
      await waitForFirebaseUser();
    }

    setBootMsg("Checking product catalogue…");
    await seedIfEmpty();

    setBootMsg("Loading store data…");
    await reloadAll();

    document.documentElement.setAttribute("data-theme", state.theme);
    document.getElementById("bootScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    await restoreSession();
    wireGlobalEvents();
    setInterval(checkNotifications, 60000);
    setInterval(flushSyncQueue, 20000);
    updateConnPill();
  }catch(err){
    console.error(err);
    setBootMsg("Failed to start — please reload. (" + err.message + ")");
  }
})();

function setBootMsg(t){ const el = document.getElementById("bootMsg"); if(el) el.textContent = t; }

async function seedIfEmpty(){
  const settingsArr = await idbGetAll("settings");
  const seededFlag = settingsArr.find(s=>s.id==="app_flags");
  let existingProducts = await idbGetAll("products");

  // The local cache can look empty even when the cloud catalogue isn't —
  // e.g. after clearing browser storage, or on a brand-new device. Before
  // treating that as "first run" and seeding a fresh catalogue, check
  // Firestore itself when it's reachable, so a cleared/new local cache can
  // never cause the seed catalogue to be duplicated in the cloud.
  if(existingProducts.length === 0 && !(seededFlag && seededFlag.productsSeeded) && FIREBASE_READY && navigator.onLine){
    try{
      const { collection: col, getDocs, query, limit } = firestoreApi;
      const snap = await getDocs(query(col(fbDb, "products"), limit(1)));
      if(!snap.empty){
        // Firestore already has products — this is just a cleared/new
        // local cache, not a genuinely new install. Skip seeding; the
        // normal reloadAll() right after this will pull the real
        // catalogue down from Firestore as usual.
        await dataSet("settings", Object.assign({ id:"app_flags", productsSeeded:true }));
        existingProducts = [{ id:"__cloud_has_products__" }]; // skip the seed block below
      }
    }catch(e){
      console.warn("[Seed check] Could not verify Firestore before seeding, proceeding with local check only.", e);
    }
  }

  if(existingProducts.length === 0 && !(seededFlag && seededFlag.productsSeeded)){
    for(const p of SEED_PRODUCTS) await dataSet("products", p);
    await dataSet("settings", Object.assign({ id:"app_flags", productsSeeded:true }));
  }
  const storeSettings = await idbGet("settings", "store_info");
  if(!storeSettings) await dataSet("settings", Object.assign({ id:"store_info" }, STORE));
}

async function reloadAll(){
  state.products = await dataGetAll("products");
  state.customers = await dataGetAll("customers");
  state.suppliers = await dataGetAll("suppliers");
  state.sales = await dataGetAll("sales");
  state.expenses = await dataGetAll("expenses");
  state.debts = await dataGetAll("debts");
  state.advances = await dataGetAll("advancePayments");
  state.receipts = await dataGetAll("receipts");
  const storeSettings = await idbGet("settings", "store_info");
  state.settings = storeSettings || STORE;
}

/* ------------------------------------------------------------------
   8. AUTH
   Login is now verified against Firebase Authentication (email/password)
   whenever the device is online and Firebase Auth is enabled on the
   project. Since staff sign in with a short username rather than an
   email, each username is mapped to a stable pseudo-email under a
   fixed, non-routable domain — this is only ever used as an Auth
   identifier, never for sending mail.

   First login per staff member: if Firebase has no account yet for
   that username, and the username/password matches this device's
   local staff list, a real Firebase Auth account is created for them
   automatically (self-service migration — no manual Firebase Console
   work required). From that moment on, Firebase is the source of
   truth for that account's password and every login is server-verified.

   Offline resilience is preserved: if the device has no network, or
   Firebase Auth cannot be reached, login falls back to the local
   staff list below so the till never gets blocked by a dead connection.
------------------------------------------------------------------ */
const AUTH_EMAIL_DOMAIN = "excellence-store-pos.local"; // not a real mailbox — Auth identifier only
function usernameToAuthEmail(username){
  const clean = String(username||"").trim().toLowerCase().replace(/[^a-z0-9._-]/g,"");
  return `${clean}@${AUTH_EMAIL_DOMAIN}`;
}

// Look up (or create, on first login) this user's profile document in
// Firestore at users/{uid}. This document — not the local USERS array —
// is what Firestore Security Rules check to authorise reads/writes.
async function fetchOrProvisionUserProfile(fbUser, username, localMatch){
  const { doc, getDoc, setDoc } = firestoreApi;
  const ref = doc(fbDb, "users", fbUser.uid);
  try{
    const snap = await getDoc(ref);
    if(snap.exists()){
      const data = snap.data();
      return { id: data.id, uid: fbUser.uid, username: data.username, name: data.name, role: data.role };
    }
  }catch(e){
    console.warn("[Firebase Auth] Could not read user profile, using local record.", e);
    return localMatch ? { ...localMatch, uid: fbUser.uid } : null;
  }
  // No profile yet for this Firebase account — create one from the local record.
  const base = localMatch || USERS.find(x=>x.username===username);
  if(!base) return null;
  const profile = { id: base.id, uid: fbUser.uid, username: base.username, name: base.name, role: base.role, updatedAt: Date.now() };
  try{ await setDoc(ref, profile); }catch(e){ console.warn("[Firebase Auth] Could not save user profile to Firestore.", e); }
  return profile;
}

// Attempts a real Firebase Auth sign-in. Returns:
//   { ok:true,  profile }                     — signed in and verified
//   { ok:false, reason:"invalid" }             — wrong username/password (reject, do not fall back)
//   { ok:false, reason:"unavailable"|"error" } — offline / Auth not configured (caller should fall back locally)
async function firebaseSignIn(username, password){
  if(!FIREBASE_READY || !FIREBASE_AUTH_READY || !navigator.onLine || !firebaseAuthApi){
    return { ok:false, reason:"unavailable" };
  }
  const { signInWithEmailAndPassword, createUserWithEmailAndPassword } = firebaseAuthApi;
  const email = usernameToAuthEmail(username);
  try{
    const cred = await signInWithEmailAndPassword(fbAuth, email, password);
    const profile = await fetchOrProvisionUserProfile(cred.user, username, USERS.find(x=>x.username===username));
    return profile ? { ok:true, profile } : { ok:false, reason:"error" };
  }catch(err){
    // Newer Firebase projects return the same "auth/invalid-credential" code
    // for both "no such account" and "wrong password" (an anti-enumeration
    // protection), so we can no longer trust the sign-in error code alone to
    // tell first-time logins apart from mistyped passwords. Older projects
    // may still send "auth/user-not-found" — handle both the same way.
    const ambiguousOrNotFound = err && (err.code === "auth/user-not-found" || err.code === "auth/invalid-credential");
    if(ambiguousOrNotFound){
      const localMatch = USERS.find(x=>x.username===username && x.password===password);
      if(!localMatch) return { ok:false, reason:"invalid" };
      try{
        // Attempting creation is now how we disambiguate: if the account
        // truly doesn't exist yet, this succeeds (first-time provisioning,
        // same as before). If it already exists, Firebase itself will tell
        // us via "auth/email-already-in-use" — meaning the real problem was
        // a wrong password, not a missing account.
        const cred = await createUserWithEmailAndPassword(fbAuth, email, password);
        const profile = await fetchOrProvisionUserProfile(cred.user, username, localMatch);
        return profile ? { ok:true, profile } : { ok:false, reason:"error" };
      }catch(provisionErr){
        if(provisionErr && provisionErr.code === "auth/email-already-in-use"){
          return { ok:false, reason:"invalid" };
        }
        console.warn("[Firebase Auth] Could not provision account for", username, provisionErr);
        return { ok:false, reason:"error" };
      }
    }
    if(err && err.code === "auth/wrong-password"){
      return { ok:false, reason:"invalid" };
    }
    console.warn("[Firebase Auth] Sign-in error, falling back to offline check.", err);
    return { ok:false, reason:"error" };
  }
}

document.getElementById("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type="submit"]');
  const u = document.getElementById("loginUser").value.trim().toLowerCase();
  const p = document.getElementById("loginPass").value;
  const errEl = document.getElementById("loginErr");
  errEl.style.display = "none";
  if(submitBtn) submitBtn.disabled = true;
  try{
    const result = await firebaseSignIn(u, p);
    if(result.ok){
      sessionStorage.setItem("pos_session", JSON.stringify({ userId: result.profile.id, uid: result.profile.uid, source:"firebase", at: Date.now() }));
      enterApp(result.profile);
      return;
    }
    if(result.reason === "invalid"){
      errEl.style.display="block"; errEl.textContent = "Invalid username or password.";
      return;
    }
    // Firebase Auth unreachable/not configured — offline fallback so the till stays usable.
    const found = USERS.find(x=>x.username === u && x.password === p);
    if(!found){ errEl.style.display="block"; errEl.textContent = "Invalid username or password."; return; }
    sessionStorage.setItem("pos_session", JSON.stringify({ userId: found.id, source:"local", at: Date.now() }));
    enterApp(found);
  } finally {
    if(submitBtn) submitBtn.disabled = false;
  }
});

// Waits (briefly) for Firebase Auth to report its persisted session on
// this device. Firebase restores this from its own local storage, so it
// resolves near-instantly even offline; the timeout is just a safety net.
function waitForFirebaseUser(){
  return new Promise(resolve=>{
    if(!FIREBASE_AUTH_READY || !fbAuth || !firebaseAuthApi){ resolve(null); return; }
    const { onAuthStateChanged } = firebaseAuthApi;
    let settled = false;
    const unsub = onAuthStateChanged(fbAuth, (user)=>{ if(settled) return; settled = true; unsub(); resolve(user); });
    setTimeout(()=>{ if(settled) return; settled = true; resolve(fbAuth.currentUser || null); }, 2500);
  });
}

async function restoreSession(){
  const raw = sessionStorage.getItem("pos_session");
  if(!raw) return;
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ return; }
  const { userId, uid, source } = parsed;
  if(source === "firebase"){
    const fbUser = await waitForFirebaseUser();
    if(fbUser && fbUser.uid === uid){
      const profile = await fetchOrProvisionUserProfile(fbUser, null, USERS.find(x=>x.id===userId));
      if(profile){ enterApp(profile); return; }
    }
    // Could not verify the Firebase session (e.g. signed out, or first run
    // offline before Firebase ever confirmed it) — fall back to local record
    // so a cached staff member isn't locked out of an already-open device.
  }
  const u = USERS.find(x=>x.id===userId);
  if(u) enterApp(u);
}

function enterApp(user){
  state.user = user;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.remove("hidden");
  document.getElementById("userName").textContent = user.name;
  document.getElementById("userRole").textContent = user.role;
  document.getElementById("userAvatar").textContent = user.name[0];
  renderNav();
  goPage(DEFAULT_PAGE_FOR_ROLE[user.role] || "dashboard");
  resetIdleTimer();
  toast(`Welcome back, ${user.name.split(" ")[0]}!`, "ok");
}

document.getElementById("logoutBtn").addEventListener("click", logout);
function logout(){
  sessionStorage.removeItem("pos_session");
  if(FIREBASE_AUTH_READY && fbAuth && firebaseAuthApi){
    firebaseAuthApi.signOut(fbAuth).catch(e=>console.warn("[Firebase Auth] Sign-out error", e));
  }
  state.user = null; state.cart = [];
  document.getElementById("mainScreen").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("loginForm").reset();
}

let idleMs = 10*60*1000; // auto logout after 10 minutes inactivity
function resetIdleTimer(){
  clearTimeout(state.idleTimer);
  state.idleTimer = setTimeout(()=>{ if(state.user){ toast("Logged out due to inactivity","warn"); logout(); } }, idleMs);
}
["click","keydown","mousemove","touchstart"].forEach(ev=> document.addEventListener(ev, ()=>{ if(state.user) resetIdleTimer(); }));

function can(perm){ return state.user && PERMISSIONS[state.user.role][perm]; }

// A Sales role account may only open these five pages — everything else
// (Dashboard, Products, Inventory, Categories, Suppliers, Reports,
// Settings) is Admin-only. Receipt History is included, but deleting a
// receipt from it still requires the separate "deleteSales" permission
// (see the delete button + deleteSale() below and firestore.rules), so a
// Sales rep can view/print/reprint receipts but never remove one.
const SALES_REP_PAGES = ["sales","receipts","credit","customers","expenses"];
const DEFAULT_PAGE_FOR_ROLE = { admin:"dashboard", sales:"sales" };

function canAccessPage(id){
  if(!state.user) return false;
  if(state.user.role === "sales") return SALES_REP_PAGES.includes(id);
  return true; // admin (and any future non-restricted role) keeps full access
}

function renderNav(){
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  NAV.forEach(group=>{
    const items = group.items.filter(it=> canAccessPage(it.id) && (!it.perm || can(it.perm) || state.user.role==="admin"));
    if(!items.length) return;
    const h = document.createElement("div"); h.className="nav-section"; h.textContent=group.section; nav.appendChild(h);
    items.forEach(it=>{
      const d = document.createElement("div");
      d.className = "nav-item" + (state.page===it.id?" active":"");
      d.innerHTML = `<span class="ic">${it.ic}</span><span>${it.label}</span>`;
      d.onclick = ()=>{ goPage(it.id); if(window.__closeMobileSidebar) window.__closeMobileSidebar(); };
      nav.appendChild(d);
    });
  });
}
function goPage(id){
  // Defense-in-depth: even if something outside the sidebar (a stale link,
  // a restored page state, or the browser console) tries to open a page a
  // Sales rep isn't allowed on, send them back to their own Sales Screen
  // instead of rendering it.
  if(!canAccessPage(id)){
    toast("You don't have access to that page.", "err");
    id = DEFAULT_PAGE_FOR_ROLE[state.user.role] || "sales";
  }
  state.page = id;
  document.getElementById("pageTitle").textContent = (NAV.flatMap(g=>g.items).find(i=>i.id===id)||{}).label || "Dashboard";
  renderNav();
  const renderers = { dashboard:renderDashboard, sales:renderSales, receipts:renderReceipts, credit:renderCredit,
    products:renderProducts, inventory:renderInventory, categories:renderCategories, customers:renderCustomers,
    suppliers:renderSuppliers, expenses:renderExpenses, reports:renderReports, settings:renderSettings };
  (renderers[id] || renderDashboard)();
}

function toast(msg, type="", ms=3200){
  const host = document.getElementById("toastHost");
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition=".3s"; setTimeout(()=>el.remove(),300); }, ms);
}
function openModal(html, opts={}){
  const host = document.getElementById("modalHost");
  host.innerHTML = `<div class="overlay" id="ov"><div class="modal ${opts.lg?'modal-lg':''}">${html}</div></div>`;
  host.querySelector("#ov").addEventListener("mousedown", (e)=>{ if(e.target.id==="ov" && opts.dismissable!==false) closeModal(); });
}
function closeModal(){ document.getElementById("modalHost").innerHTML=""; }
function confirmDialog(message, onYes){

    <div class="modal-head"><h3>Please confirm</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>

function wireGlobalEvents(){

async function checkNotifications(){
  const lowStock = state.products.filter(p=> unitStockInPieces(p) <= (p.minStock||0) );
  const dot = document.getElementById("notifDot");
  const hasAlerts = lowStock.length>0;
  dot.classList.toggle("hidden", !hasAlerts);
}
function unitStockInPieces(p){ return p.currentStock; }
function showNotificationsPanel(){
  const lowStock = state.products.filter(p=> p.currentStock <= (p.minStock||0));
  const outStock = state.products.filter(p=> p.currentStock <= 0);
  const debts = state.debts.filter(d=> d.balance > 0);
  const pendingAdv = state.advances.filter(a=> a.collectionStatus !== "Fully Collected");
  let html = `<div class="modal-head"><h3>Notifications</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">`;
  const section = (title,rows,render)=> rows.length ? `<h4 style="font-size:13px;margin:14px 0 8px">${title} (${rows.length})</h4>` +
    rows.slice(0,6).map(render).join("") : "";
  html += section("⚠️ Low Stock", lowStock, p=>`<div class="cart-line-sub">${p.name} — ${fmtQty(p.currentStock)} ${p.stockUnit} left</div>`);
  html += section("⛔ Out of Stock", outStock, p=>`<div class="cart-line-sub">${p.name}</div>`);
  html += section("💰 Outstanding Debts", debts, d=>`<div class="cart-line-sub">${d.customerName} owes ${money(d.balance)}</div>`);
  html += section("📦 Pending Collections", pendingAdv, a=>`<div class="cart-line-sub">${a.customerName} — ${a.collectionStatus}</div>`);
  if(!lowStock.length && !outStock.length && !debts.length && !pendingAdv.length) html += `<p style="color:var(--ink-soft);font-size:13px">You're all caught up. No alerts right now.</p>`;
  html += `</div><div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">Close</button></div>`;
  openModal(html);
}

/* ------------------------------------------------------------------
   13. FORMAT HELPERS
------------------------------------------------------------------ */
function money(n){ return (state.settings.currency||"₦") + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtQty(n){ n=Number(n||0); return Number.isInteger(n) ? n : n.toFixed(2).replace(/\.00$/,""); }
function fmtDate(ts){ return new Date(ts).toLocaleString("en-NG", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }); }
function todayStr(){ return new Date().toDateString(); }
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ------------------------------------------------------------------
   14. DASHBOARD
------------------------------------------------------------------ */
function renderDashboard(){
  const sales = state.sales;
  const today = sales.filter(s=> new Date(s.createdAt).toDateString() === todayStr());
  const weekAgo = Date.now() - 7*86400000, monthAgo = Date.now() - 30*86400000;
  const weekSales = sales.filter(s=> s.createdAt >= weekAgo);
  const monthSales = sales.filter(s=> s.createdAt >= monthAgo);
  const sum = (arr,f)=> arr.reduce((a,s)=>a+f(s),0);
  const todaySalesTotal = sum(today, s=>s.total);
  const todayProfit = sum(today, s=> s.items.reduce((a,i)=>a + (i.unitPrice - (i.unitCost||0))*i.qtyInStockUnit,0));
  const stockValue = state.products.reduce((a,p)=> a + p.currentStock * (p.costPrice||0), 0);
  const lowStock = state.products.filter(p=>p.currentStock<=p.minStock);
  const debtors = state.debts.filter(d=>d.balance>0);
  const advances = state.advances.filter(a=>a.collectionStatus!=="Fully Collected");
  const needsPricing = state.products.filter(p=>p.needsPricing).length;

  const cards = [

  const dayTotals = days.map(d=> state.sales.filter(s=>new Date(s.createdAt).toDateString()===d.toDateString())
    .reduce((a,s)=>a+s.total,0));
  mkChart("chartDaily","line",{ labels:days.map(d=>d.toLocaleDateString("en-NG",{weekday:'short'})),
    datasets:[{ label:"Sales (₦)", data:dayTotals, borderColor:"#0F7B55", backgroundColor:"rgba(15,123,85,.15)", fill:true, tension:.35 }]});

  const byMethod = {};
  state.sales.forEach(s=> byMethod[s.paymentMethod] = (byMethod[s.paymentMethod]||0)+s.total);
  mkChart("chartPay","doughnut",{ labels:Object.keys(byMethod).length?Object.keys(byMethod):["No data"],
    datasets:[{ data:Object.keys(byMethod).length?Object.values(byMethod):[1], backgroundColor:["#0F7B55","#E3A008","#1F6FB2","#C0392B","#8e44ad","#16a085"] }]});

  const prodQty = {};
  state.sales.forEach(s=> s.items.forEach(i=> prodQty[i.productName]=(prodQty[i.productName]||0)+i.qtySold));
  const top = Object.entries(prodQty).sort((a,b)=>b[1]-a[1]).slice(0,6);
  mkChart("chartBest","bar",{ labels: top.length? top.map(t=>t[0]) : ["No sales yet"],

const chartRegistry = {};
function mkChart(id,type,data){
  const el = document.getElementById(id); if(!el) return;
  if(chartRegistry[id]) chartRegistry[id].destroy();
  chartRegistry[id] = new Chart(el, { type, data, options:{ responsive:true, plugins:{legend:{display:type!=="line"}} } });
}

/* ------------------------------------------------------------------
   15. UNIT CONVERSION ENGINE
   Every product tracks stock in its own `stockUnit`. `unitConversions`
   lists extra sellable units and how many stockUnits each equals.
   Selling in ANY unit deducts the correct fraction of stock.
------------------------------------------------------------------ */
function sellableUnits(product){
  const list = [{ unit: product.stockUnit, factor: 1, price: product.sellingPrice }];
  (product.unitConversions||[]).forEach(u=> list.push(u));
  return list;
}
function stockDeductionFor(product, unitName, qty){
  const u = sellableUnits(product).find(x=>x.unit===unitName) || { factor: 1 };
  return u.factor * qty;
}
// Price for a given sellable unit: uses the admin-set per-unit price if
// one was entered on the product form, otherwise derives it from the
// stock unit's selling price and the unit's conversion factor.
function unitPriceFor(product, unitName){
  if(!product) return 0;
  const u = sellableUnits(product).find(x=>x.unit===unitName);
  if(!u) return product.sellingPrice||0;
  return (u.price!=null && u.price>0) ? u.price : (product.sellingPrice||0)*u.factor;
}
// Human-readable quantity equivalence for a sellable unit, e.g.
// "1 Dozen = 12 Piece" or "1 Carton = 11 Piece".
function unitEquivLabel(product, u){
  if(u.factor===1) return "";
  if(u.factor>1) return `1 ${u.unit} = ${fmtQty(u.factor)} ${product.stockUnit}`;
  return `1 ${product.stockUnit} = ${fmtQty(1/u.factor)} ${u.unit}`;
}

// Fixed combo payment methods: each is a real transaction split across
// two or three tender types with amounts entered directly on the sales
// screen (no separate popup needed).
const COMBO_METHODS = {
  "POS + Cash": ["POS","Cash"],
  "Transfer + Cash": ["Transfer","Cash"],
  "Transfer + POS + Cash": ["Transfer","POS","Cash"]
};
// Standard single-tender methods vs. combo/credit methods — rendered as two
// labelled groups so the panel stays scannable, especially on small screens.
const PAYMENT_METHODS_STANDARD = ["Cash","Transfer","POS","Bank","Mobile Money","Cheque","Wallet"];
const PAYMENT_METHODS_SPECIAL = ["POS + Cash","Transfer + Cash","Transfer + POS + Cash","Split Payment","Advance Payment","Credit"];
const PAYMENT_METHODS = [...PAYMENT_METHODS_STANDARD, ...PAYMENT_METHODS_SPECIAL];
const PAYMENT_METHOD_ICONS = {
  "Cash":"💵","Transfer":"🏦","POS":"💳","Bank":"🏛️","Mobile Money":"📱","Cheque":"🖊️","Wallet":"👛",
  "POS + Cash":"💳➕💵","Transfer + Cash":"🏦➕💵","Transfer + POS + Cash":"🏦➕💳➕💵",
  "Split Payment":"🔀","Advance Payment":"⏳","Credit":"🧾"
};

/* Renders the contextual info / input panel under the payment method
   radios, based on whichever method is currently selected. Keeps all
   the "necessary information" (customer requirement, partial-payment
   fields, combo breakdown) visible directly on the Sales screen instead
   of behind a popup. */
function updatePayDetails(){
  const host = document.getElementById("payDetails");
  if(!host) return;
  const checked = document.querySelector('input[name="paym"]:checked');
  const method = checked ? checked.value : "Cash";
  const total = state.cart.reduce((a,c)=>a+c.qty*c.unitPrice,0) - (+(document.getElementById("discountInput")?.value||0));
  const taxPct = +(document.getElementById("taxInput")?.value||0);
  const grandTotal = Math.max(0,total) * (1+taxPct/100);

  if(COMBO_METHODS[method]){
    const parts = COMBO_METHODS[method];
    host.innerHTML = `<div class="pay-detail-box">
      <p class="pay-detail-note">Enter how much was paid by each method. They should add up to the total (${money(grandTotal)}). If they fall short, the remainder is recorded as credit — select a customer first.</p>
      ${parts.map((p,i)=>`<div class="cart-row"><span>${escapeHtml(p)}</span>
        <input type="number" class="comboAmt" data-method="${escapeHtml(p)}" min="0" value="${i===0?fmtQty(grandTotal):0}" style="width:120px;text-align:right;padding:5px 8px;border-radius:6px;border:1px solid var(--line)"></div>`).join("")}
      <div class="cart-row total"><span>Remaining</span><span id="comboRemaining">${money(0)}</span></div>
    </div>`;
    const updateRemaining = ()=>{
      const sum = [...host.querySelectorAll(".comboAmt")].reduce((a,i)=>a+(+i.value||0),0);
      document.getElementById("comboRemaining").textContent = money(Math.max(0, grandTotal-sum));
    };
    host.querySelectorAll(".comboAmt").forEach(i=> i.addEventListener("input", updateRemaining));
    updateRemaining();
  } else if(method==="Split Payment"){
    host.innerHTML = `<div class="pay-detail-box"><p class="pay-detail-note">You'll break the payment down across any combination of methods in a popup right after you click "Charge & Print". If the total entered is less than the amount due, select a customer so the shortfall can be saved as credit.</p></div>`;
  } else if(method==="Credit"){
    host.innerHTML = `<div class="pay-detail-box">
      <p class="pay-detail-note">${state.activeCustomer? "Customer: <b>"+escapeHtml(state.activeCustomer.name)+"</b>." : "⚠️ Select a customer above — Credit sales must be linked to a customer."} Enter anything paid now; the rest is saved as a debt on their account.</p>
      <div class="cart-row"><span>Amount Paid Now</span><input type="number" id="creditPaidNow" min="0" max="${grandTotal}" value="0" style="width:120px;text-align:right;padding:5px 8px;border-radius:6px;border:1px solid var(--line)"></div>
    </div>`;
  } else if(method==="Advance Payment"){
    host.innerHTML = `<div class="pay-detail-box">
      <p class="pay-detail-note">${state.activeCustomer? "Customer: <b>"+escapeHtml(state.activeCustomer.name)+"</b>." : "⚠️ Select a customer above — Advance Payments must be linked to a customer."} Goods are reserved and collected later. Enter what's paid today (defaults to the full total). You can pay <b>more than the total</b> — the extra is kept as store credit on the customer's account.</p>
      <div class="cart-row"><span>Amount Paid Now</span><input type="number" id="advPaidNow" min="0" value="${fmtQty(grandTotal)}" style="width:120px;text-align:right;padding:5px 8px;border-radius:6px;border:1px solid var(--line)"></div>
    </div>`;
  } else {
    host.innerHTML = "";
  }
}

function renderPosGrid(){
  const q = (document.getElementById("posSearch").value||"").toLowerCase();
  const cat = document.getElementById("posCat").value;
  const grid = document.getElementById("posGrid");
  let items = state.products.filter(p=> (cat==="All"||p.category===cat) &&
    (p.name.toLowerCase().includes(q) || p.barcode.includes(q)));
  if(!items.length){ grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="ic">📦</div>No products match your search</div>`; return; }
  grid.innerHTML = items.map(p=>{
    const out = p.currentStock<=0, low = !out && p.currentStock<=p.minStock;
    const units = sellableUnits(p);
    const unitsHtml = units.map(u=>{
      const equiv = unitEquivLabel(p, u);
      const price = p.needsPricing ? "—" : money(unitPriceFor(p, u.unit));
      return `<div class="tile-unit-row" data-unit="${escapeHtml(u.unit)}">
        <span class="tile-unit-name"><b>${escapeHtml(u.unit)}</b>${equiv?` <i>(${equiv})</i>`:''}</span>
        <span class="tile-unit-price">${price}</span>
      </div>`;
    }).join("");
    return `<button class="product-tile ${low?'low':''} ${out?'out':''}" ${out?"disabled":""} data-id="${p.id}">
      <span class="cat">${escapeHtml(p.category)}</span>
      <span class="nm">${escapeHtml(p.name)}</span>
      <span class="pr">${p.needsPricing?'<span class="pill pill-warn">Set price</span>':money(p.sellingPrice)}</span>
      <span class="st">${fmtQty(p.currentStock)} ${escapeHtml(p.stockUnit)} left</span>
      <div class="tile-units">${unitsHtml}</div>
    </button>`;
  }).join("");
  grid.querySelectorAll(".product-tile").forEach(btn=> btn.addEventListener("click", (e)=>{
    const p = state.products.find(x=>x.id===btn.dataset.id);
    if(p.needsPricing){ toast("Set a selling price for this product first (Products page).", "warn"); return; }
    const unitRow = e.target.closest(".tile-unit-row");
    addToCart(p, unitRow?unitRow.dataset.unit:p.stockUnit);
  }));
}
function addToCart(product, unitName){
  const unit = unitName || product.stockUnit;
  const existing = state.cart.find(c=>c.productId===product.id && c.unit===unit);
  if(existing) existing.qty += 1;
  else state.cart.push({ productId:product.id, productName:product.name, unit,
    qty:1, unitPrice:unitPriceFor(product, unit), unitCost:product.costPrice, override:false });
  renderCart();
}
function renderCart(){
  const box = document.getElementById("cartItems"); if(!box) return;
  if(!state.cart.length){ box.innerHTML = `<div class="empty-state"><div class="ic">🛒</div>Cart is empty<br><span style="font-size:11.5px">Tap a product to add it</span></div>`; }
  else{
    box.innerHTML = state.cart.map((c,idx)=>{
      const product = state.products.find(p=>p.id===c.productId);
      const units = sellableUnits(product).map(u=>u.unit);
      const uInfo = sellableUnits(product).find(u=>u.unit===c.unit) || {factor:1};
      const pieceEquiv = uInfo.factor!==1
        ? `<div class="cart-line-equiv">= ${fmtQty(c.qty*uInfo.factor)} ${escapeHtml(product.stockUnit)}</div>` : "";
      return `<div class="cart-line" data-idx="${idx}">
        <div class="cart-line-top">
          <div><div class="cart-line-nm">${escapeHtml(c.productName)}</div>
          <div class="cart-line-sub">${fmtQty(c.qty)} ${escapeHtml(c.unit)} &times; ${money(c.unitPrice)}</div>
          ${pieceEquiv}</div>
          <div style="display:flex;align-items:flex-start;gap:8px">
            <div class="cart-line-amt" style="font-weight:700;white-space:nowrap;padding-top:1px">${money(c.qty*c.unitPrice)}</div>
            <button class="icon-sm removeLine">✕</button>
          </div>
        </div>
        <div class="qty-ctrl">
          <button class="decQty">−</button>
          <input type="number" min="0.01" step="0.01" class="qtyInput" value="${c.qty}">
          <button class="incQty">+</button>
          <select class="unitSelect">${units.map(u=>`<option ${u===c.unit?"selected":""}>${u}</option>`).join("")}</select>
          ${can("priceOverride")?`<input type="number" class="priceOverride" title="Override price" value="${c.unitPrice}" style="width:70px;padding:4px;border-radius:6px;border:1px solid var(--line)">`:""}
        </div>
      </div>`;
    }).join("");
    box.querySelectorAll(".removeLine").forEach(b=> b.addEventListener("click",(e)=>{ state.cart.splice(+e.target.closest(".cart-line").dataset.idx,1); renderCart(); }));
    box.querySelectorAll(".decQty").forEach(b=> b.addEventListener("click",(e)=>{ const i=+e.target.closest(".cart-line").dataset.idx; state.cart[i].qty=Math.max(0.01,state.cart[i].qty-1); renderCart(); }));
    box.querySelectorAll(".incQty").forEach(b=> b.addEventListener("click",(e)=>{ const i=+e.target.closest(".cart-line").dataset.idx; state.cart[i].qty+=1; renderCart(); }));
    box.querySelectorAll(".qtyInput").forEach(b=> b.addEventListener("change",(e)=>{ const i=+e.target.closest(".cart-line").dataset.idx; state.cart[i].qty=Math.max(0.01,+e.target.value||1); renderCart(); }));
    box.querySelectorAll(".unitSelect").forEach(b=> b.addEventListener("change",(e)=>{ const i=+e.target.closest(".cart-line").dataset.idx; const line=state.cart[i]; line.unit=e.target.value; if(!line.override){ const prod=state.products.find(x=>x.id===line.productId); line.unitPrice=unitPriceFor(prod, line.unit); } renderCart(); }));
    box.querySelectorAll(".priceOverride").forEach(b=> b.addEventListener("change",(e)=>{ const i=+e.target.closest(".cart-line").dataset.idx; state.cart[i].unitPrice=Math.max(0,+e.target.value||0); state.cart[i].override=true; renderCart(); }));
  }
  const subtotal = state.cart.reduce((a,c)=>a+c.qty*c.unitPrice,0);
  const discount = +(document.getElementById("discountInput")?.value||0);
  const taxPct = +(document.getElementById("taxInput")?.value||0);
  const taxable = Math.max(0, subtotal-discount);
  const tax = taxable*taxPct/100;
  const total = taxable+tax;
  const totalUnits = state.cart.reduce((a,c)=>a+c.qty,0);
  if(document.getElementById("sumSub")){
    document.getElementById("sumUnits").textContent = fmtQty(totalUnits);
    document.getElementById("sumSub").textContent = money(subtotal);
    document.getElementById("sumTax").textContent = money(tax);
    document.getElementById("sumTotal").textContent = money(total);
  }
  const mcbCount = document.getElementById("mcbCount"), mcbTotal = document.getElementById("mcbTotal");
  if(mcbCount){
    const itemCount = state.cart.reduce((a,c)=>a+c.qty,0);
    mcbCount.textContent = `${fmtQty(itemCount)} item${itemCount===1?"":"s"}`;
    mcbTotal.textContent = money(total);
    document.getElementById("mobileCartBar").classList.toggle("show", state.cart.length>0);
  }
  updatePayDetails();
}

async function checkout(){
  if(!state.cart.length) return toast("Cart is empty","warn");
  const method = document.querySelector('input[name="paym"]:checked').value;
  const discount = +(document.getElementById("discountInput").value||0);
  const taxPct = +(document.getElementById("taxInput").value||0);
  const subtotal = state.cart.reduce((a,c)=>a+c.qty*c.unitPrice,0);
  const taxable = Math.max(0, subtotal-discount);
  const tax = taxable*taxPct/100;
  const total = taxable+tax;
  const notes = document.getElementById("saleNotes").value.trim();

  // validate & compute stock deductions, prevent overselling / negative stock
  const lines = [];
  for(const c of state.cart){
    const product = state.products.find(p=>p.id===c.productId);
    const deduction = stockDeductionFor(product, c.unit, c.qty);
    if(deduction > product.currentStock + 1e-9){
      toast(`Not enough stock for ${product.name}. Available: ${fmtQty(product.currentStock)} ${product.stockUnit}`, "err");
      return;
    }
    lines.push({ productId:product.id, productName:product.name, unit:c.unit, qtySold:c.qty,
      qtyInStockUnit:deduction, unitPrice:c.unitPrice, unitCost:product.costPrice });
  }

  let amountPaid = total, balance = 0, paymentBreakdown = null;
  if(method==="Credit"){
    if(!state.activeCustomer){ toast(`Select or add a customer first — ${method} needs a customer on file.`, "err"); return; }
    const paid = Math.min(total, Math.max(0, +document.getElementById("creditPaidNow")?.value||0));
    amountPaid = paid; balance = total-paid;
  } else if(method==="Advance Payment"){
    if(!state.activeCustomer){ toast(`Select or add a customer first — ${method} needs a customer on file.`, "err"); return; }
    const paid = Math.max(0, +document.getElementById("advPaidNow")?.value||0);
    amountPaid = paid; balance = Math.max(0, total-paid);
  } else if(method==="Split Payment"){
    const res = await promptSplitPaymentModal(total);
    if(res===null) return;
    paymentBreakdown = res.lines; amountPaid = res.total; balance = total-res.total;
    if(balance>0.009 && !state.activeCustomer){
      toast("Split payment is short of the total — select a customer to record the remaining balance as credit.", "err");
      return;
    }
  } else if(COMBO_METHODS[method]){
    const rows = [...document.querySelectorAll(".comboAmt")].map(i=>({ method:i.dataset.method, amount:Math.max(0,+i.value||0) })).filter(l=>l.amount>0);
    if(!rows.length){ toast("Enter at least one amount for the payment breakdown","err"); return; }
    const sum = rows.reduce((a,l)=>a+l.amount,0);
    if(sum > total + 0.01){ toast("The amounts entered exceed the total due","err"); return; }
    paymentBreakdown = rows; amountPaid = sum; balance = total-sum;
    if(balance>0.009 && !state.activeCustomer){
      toast(`${method} is short of the total — select a customer to record the remaining balance as credit.`, "err");
      return;
    }
  }

  const receiptNumber = "AGB-" + Date.now().toString().slice(-8);
  const sale = {
    id: genId("sale"), receiptNumber, createdAt: Date.now(),
    cashierId: state.user.id, cashierName: state.user.name,
    customerId: state.activeCustomer?.id||null, customerName: state.activeCustomer?.name||"Walk-in",
    items: lines, subtotal, discount, taxPct, tax, total, amountPaid, balance, paymentBreakdown,
    paymentMethod: method, notes, status: balance>0.009 ? "Partial/Owing" : "Paid"
  };
  await dataSet("sales", sale);
  state.sales.push(sale);

  // stock deduction + history
  for(const l of lines){
    const product = state.products.find(p=>p.id===l.productId);
    product.currentStock = +(product.currentStock - l.qtyInStockUnit).toFixed(4);
    await dataSet("products", product);
    await dataSet("stockHistory", { id:genId("stk"), productId:product.id, productName:product.name,
      type:"sale", change:-l.qtyInStockUnit, reference:receiptNumber, createdAt:Date.now(), by:state.user.name });
  }

  // save each payment method to the payments ledger
  if(paymentBreakdown){
    for(const l of paymentBreakdown){
      await dataSet("payments", { id:genId("pay"), type:"split", saleId:sale.id, receiptNumber,
        method:l.method, amount:l.amount, createdAt:Date.now(), by:state.user.name });
    }
  } else {
    await dataSet("payments", { id:genId("pay"), type:"sale", saleId:sale.id, receiptNumber,
      method, amount:amountPaid, createdAt:Date.now(), by:state.user.name });
  }

  // route the outstanding balance / reservation to the right place
  if(balance>0.009 && state.activeCustomer){
    if(method!=="Advance Payment"){
      // Credit, Split Payment, or any of the combo methods (POS+Cash, Transfer+Cash, Transfer+POS+Cash)
      const debt = { id:genId("debt"), customerId:state.activeCustomer.id, customerName:state.activeCustomer.name,
        phone:state.activeCustomer.phone||"", saleId:sale.id, receiptNumber, total, amountPaid, balance,
        dueDate:null, createdAt:Date.now(), history:[{amount:amountPaid, date:Date.now()}] };
      await dataSet("debts", debt); state.debts.push(debt);
    } else if(method==="Advance Payment"){
      const adv = { id:genId("adv"), customerId:state.activeCustomer.id, customerName:state.activeCustomer.name,
        phone:state.activeCustomer.phone||"", saleId:sale.id, receiptNumber, amountPaid, total, balance, creditBalance:0,
        products: lines.map(l=>({ productName:l.productName, reserved:l.qtySold, unit:l.unit, collected:0, unitPrice:l.unitPrice })),
        collectionStatus:"Not Collected", createdAt:Date.now() };
      await dataSet("advancePayments", adv); state.advances.push(adv);
      await syncAdvanceDebt(adv);
    }
  } else if(method==="Advance Payment" && state.activeCustomer){
    // fully paid in advance (possibly more than the total) — any amount
    // beyond the goods' value is kept as store credit on the record
    const creditBalance = Math.max(0, amountPaid-total);
    const adv = { id:genId("adv"), customerId:state.activeCustomer.id, customerName:state.activeCustomer.name,
      phone:state.activeCustomer.phone||"", saleId:sale.id, receiptNumber, amountPaid, total, balance:0, creditBalance,
      products: lines.map(l=>({ productName:l.productName, reserved:l.qtySold, unit:l.unit, collected:0, unitPrice:l.unitPrice })),
      collectionStatus:"Not Collected", createdAt:Date.now() };
    await dataSet("advancePayments", adv); state.advances.push(adv);
    await syncAdvanceDebt(adv);
  }
  await dataSet("receipts", { id: sale.id, ...sale });
  state.receipts.push(sale);

  state.cart = []; state.activeCustomer = null;
  toast(`Sale completed — ${receiptNumber}`, "ok");
  showReceiptModal(sale);
  renderSales();
}
function promptPaymentSplit(total){
  return new Promise(resolve=>{
    openModal(`<div class="modal-head"><h3>Amount Paid Now</h3><button class="close-x" id="cancelSplit">✕</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--ink-soft)">Total due: <b>${money(total)}</b>. Enter what the customer is paying now — the rest will be recorded as balance owing.</p>
      <div class="field"><label>Amount Paid Now</label><input type="number" id="paidNowInput" value="0" min="0" max="${total}"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" id="cancelSplit2">Cancel</button><button class="btn btn-primary" id="confirmSplit">Confirm</button></div>`, {dismissable:false});
    const close = (val)=>{ closeModal(); resolve(val); };
    document.getElementById("cancelSplit").onclick = ()=>close(null);
    document.getElementById("cancelSplit2").onclick = ()=>close(null);
    document.getElementById("confirmSplit").onclick = ()=>{
      const paid = Math.min(total, Math.max(0, +document.getElementById("paidNowInput").value||0));
      close({ paid });
    };
  });
}
function promptSplitPaymentModal(total){
  return new Promise(resolve=>{
    const methods = ["Cash","Transfer","POS","Bank","Mobile Money","Cheque","Wallet"];
    openModal(`<div class="modal-head"><h3>Split Payment</h3><button class="close-x" id="spCancel1">✕</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--ink-soft)">Total due: <b>${money(total)}</b>. Break the payment down across two or more methods.</p>
      <div id="spRows"></div>
      <button class="btn btn-ghost btn-sm" id="spAddRow" style="margin-top:6px">+ Add payment method</button>
      <div class="cart-row total" style="margin-top:14px"><span>Remaining</span><span id="spRemaining">${money(total)}</span></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" id="spCancel2">Cancel</button><button class="btn btn-primary" id="spConfirm">Confirm</button></div>`, {dismissable:false});
    const rowsHost = document.getElementById("spRows");
    const updateRemaining = ()=>{
      const sum = [...rowsHost.children].reduce((a,r)=>a+(+r.querySelector(".spAmt").value||0),0);
      document.getElementById("spRemaining").textContent = money(Math.max(0,total-sum));
    };
    const addRow = (method, amount)=>{
      const row = document.createElement("div");
      row.style.cssText = "display:flex;gap:8px;margin-bottom:8px;align-items:center;";
      row.innerHTML = `<select class="spMethod" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--line)">${methods.map(m=>`<option ${m===method?"selected":""}>${m}</option>`).join("")}</select>
        <input type="number" class="spAmt" value="${amount||0}" min="0" style="width:120px;padding:8px;border-radius:8px;border:1px solid var(--line)">
        <button class="icon-sm spRem">✕</button>`;
      row.querySelector(".spAmt").addEventListener("input", updateRemaining);
      row.querySelector(".spRem").addEventListener("click", ()=>{ row.remove(); updateRemaining(); });
      rowsHost.appendChild(row);
    };
    addRow("Cash", total); addRow("Transfer", 0);
    document.getElementById("spAddRow").addEventListener("click", ()=> addRow(methods[0], 0));
    updateRemaining();
    const close = (val)=>{ closeModal(); resolve(val); };
    document.getElementById("spCancel1").onclick = ()=>close(null);
    document.getElementById("spCancel2").onclick = ()=>close(null);
    document.getElementById("spConfirm").onclick = ()=>{
      const lines = [...rowsHost.children].map(r=>({ method:r.querySelector(".spMethod").value, amount:+r.querySelector(".spAmt").value||0 })).filter(l=>l.amount>0);
      if(!lines.length){ toast("Add at least one payment line","err"); return; }
      const sum = lines.reduce((a,l)=>a+l.amount,0);
      if(sum > total + 0.01){ toast("Split amounts exceed the total due","err"); return; }
      close({ lines, total: sum });
    };
  });
}

function buildReceiptHTML(sale, layout){
  const s = state.settings;
  const itemsRows = sale.items.map(i=>{
    const product = state.products.find(p=>p.id===i.productId);
    const equiv = (product && i.unit!==product.stockUnit && i.qtyInStockUnit!=null)
      ? `<div style="font-size:9.5px;opacity:.75">= ${fmtQty(i.qtyInStockUnit)} ${escapeHtml(product.stockUnit)}</div>` : "";
    return `<tr><td>${escapeHtml(i.productName)}</td><td>${fmtQty(i.qtySold)} ${escapeHtml(i.unit)}${equiv}</td>
    <td style="text-align:right">${money(i.unitPrice)}</td><td style="text-align:right">${money(i.qtySold*i.unitPrice)}</td></tr>`;
  }).join("");
  const balanceLine = sale.balance>0 ? `<div class="r-row"><b>BALANCE OWING</b><b>${money(sale.balance)}</b></div>` : "";
  const breakdownLines = sale.paymentBreakdown ? sale.paymentBreakdown.map(l=>
    `<div class="r-row"><span>&nbsp;&nbsp;${escapeHtml(l.method)}</span><span>${money(l.amount)}</span></div>`).join("") : "";
  return `
  <div class="receipt ${layout}" id="receiptRoot">
    <div class="r-center"><b style="font-size:15px">${escapeHtml(s.name||"HARAMOS ENTERPRISE")}</b><br>${escapeHtml(s.phone||"")}<br>${escapeHtml(s.address||"")}</div>
    <hr>
    <div class="r-row"><span>Receipt#</span><span>${sale.receiptNumber}</span></div>
    <div class="r-row"><span>Date</span><span>${fmtDate(sale.createdAt)}</span></div>
    <div class="r-row"><span>Cashier</span><span>${escapeHtml(sale.cashierName)}</span></div>
    <div class="r-row"><span>Customer</span><span>${escapeHtml(sale.customerName||"Walk-in")}</span></div>
    <hr>
    <table><thead><tr><th>Item</th><th>Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Amt</th></tr></thead>
    <tbody>${itemsRows}</tbody></table>
    <div class="r-row" style="font-weight:600"><span>Total Pieces</span><span>${fmtQty(sale.items.reduce((a,i)=>a+(i.qtyInStockUnit!=null?i.qtyInStockUnit:i.qtySold),0))}</span></div>
    <hr>
    <div class="r-row"><span>Subtotal</span><span>${money(sale.subtotal)}</span></div>
    <div class="r-row"><span>Discount</span><span>-${money(sale.discount)}</span></div>
    <div class="r-row"><span>Tax</span><span>${money(sale.tax)}</span></div>
    <div class="r-row" style="font-weight:700;font-size:1.1em"><span>TOTAL</span><span>${money(sale.total)}</span></div>
    <div class="r-row"><span>Paid</span><span>${money(sale.amountPaid)}</span></div>
    ${balanceLine}
    <div class="r-row"><span>Payment</span><span>${escapeHtml(sale.paymentMethod)}</span></div>
    ${breakdownLines}
    ${sale.history && sale.history.length ? `<hr><div class="r-center" style="font-weight:700">Payment History</div>${sale.history.map(h=>`<div class="r-row"><span>${fmtDate(h.date)}</span><span>${money(h.amount)}</span></div>`).join("")}` : ""}
    ${sale.advanceProducts && sale.advanceProducts.length ? `<hr><div class="r-center" style="font-weight:700">Collection Status</div>
    <table><thead><tr><th>Product</th><th style="text-align:right">Collected</th><th style="text-align:right">Remaining</th></tr></thead>
    <tbody>${sale.advanceProducts.map(p=>`<tr><td>${escapeHtml(p.productName)}</td><td style="text-align:right">${fmtQty(p.collected)} ${escapeHtml(p.unit)}</td><td style="text-align:right">${fmtQty(p.reserved-p.collected)} ${escapeHtml(p.unit)}</td></tr>`).join("")}</tbody></table>
    <div class="r-row"><span>Total Products Collected</span><span>${fmtQty(sale.advanceProducts.reduce((a,p)=>a+p.collected,0))}</span></div>
    <div class="r-row"><span>Total Products Remaining</span><span>${fmtQty(sale.advanceProducts.reduce((a,p)=>a+(p.reserved-p.collected),0))}</span></div>` : ""}
    <hr>
    <div class="r-center" id="rcBarcode"></div>
    <div class="r-center" id="rcQr" style="margin-top:6px"></div>
    <hr>
    <div class="r-center">${escapeHtml(s.footer||"Thank you for shopping with us!")}<br>
    <span style="font-size:.85em">${escapeHtml(s.returnPolicy||"")}</span></div>
  </div>`;
}

function downloadReceiptPDF(sale){
  try{
    const { jsPDF } = window.jspdf;
    const extraHeight = sale.advanceProducts && sale.advanceProducts.length ? 40+sale.advanceProducts.length*24 : 0;
    const pdf = new jsPDF({ unit:"pt", format:[227, 500+sale.items.length*30+extraHeight] });
    let y = 26;
    const s = state.settings;
    pdf.setFont("courier","bold"); pdf.setFontSize(12);
    pdf.text(s.name||"HARAMOS ENTERPRISE", 113, y, {align:"center"}); y+=14;
    pdf.setFont("courier","normal"); pdf.setFontSize(9);
    pdf.text(s.phone||"", 113, y, {align:"center"}); y+=16;
    pdf.text(`Receipt# ${sale.receiptNumber}`, 14, y); y+=12;
    pdf.text(`Date: ${fmtDate(sale.createdAt)}`, 14, y); y+=12;
    pdf.text(`Cashier: ${sale.cashierName}`, 14, y); y+=12;
    pdf.text(`Customer: ${sale.customerName||"Walk-in"}`, 14, y); y+=16;
    sale.items.forEach(i=>{
      const product = state.products.find(p=>p.id===i.productId);
      pdf.text(`${i.productName} (${fmtQty(i.qtySold)} ${i.unit})`, 14, y); y+=11;
      pdf.text(`  ${money(i.unitPrice)} x ${fmtQty(i.qtySold)} = ${money(i.unitPrice*i.qtySold)}`, 14, y); y+=13;
      if(product && i.unit!==product.stockUnit && i.qtyInStockUnit!=null){
        pdf.setFontSize(8);
        pdf.text(`  = ${fmtQty(i.qtyInStockUnit)} ${product.stockUnit}`, 14, y); y+=11;
        pdf.setFontSize(9);
      }
    });
    y+=4;
    pdf.setFont("courier","bold");
    pdf.text(`Total Pieces: ${fmtQty(sale.items.reduce((a,i)=>a+(i.qtyInStockUnit!=null?i.qtyInStockUnit:i.qtySold),0))}`, 14, y); y+=13;
    pdf.setFont("courier","normal");
    y+=6;
    [["Subtotal",sale.subtotal],["Discount",-sale.discount],["Tax",sale.tax],["TOTAL",sale.total],
     ["Paid",sale.amountPaid],["Balance",sale.balance]].forEach(([lbl,val])=>{
      pdf.text(String(lbl), 14, y); pdf.text(money(val), 213, y, {align:"right"}); y+=13;
    });
    if(sale.advanceProducts && sale.advanceProducts.length){
      y+=6;
      pdf.setFont("courier","bold"); pdf.text("Collection Status", 14, y); y+=13;
      pdf.setFont("courier","normal");
      sale.advanceProducts.forEach(p=>{
        pdf.text(`${p.productName}: collected ${fmtQty(p.collected)}/${fmtQty(p.reserved)} ${p.unit}`, 14, y); y+=11;
        pdf.text(`  remaining ${fmtQty(p.reserved-p.collected)} ${p.unit}`, 14, y); y+=13;
      });
      const totalCollected = sale.advanceProducts.reduce((a,p)=>a+p.collected,0);
      const totalRemaining = sale.advanceProducts.reduce((a,p)=>a+(p.reserved-p.collected),0);
      pdf.text(`Total Collected: ${fmtQty(totalCollected)}`, 14, y); y+=12;
      pdf.text(`Total Remaining: ${fmtQty(totalRemaining)}`, 14, y); y+=12;
    }
    y+=10;
    pdf.text(s.footer||"Thank you for shopping with us!", 113, y, {align:"center"});
    pdf.save(`${sale.receiptNumber}.pdf`);
  }catch(e){ console.error(e); toast("Could not generate PDF in this browser.","err"); }
}

   18. RECEIPT HISTORY
------------------------------------------------------------------ */
/* Build a receipt-ready "sale" object from a Credit/Debt record.
   If the debt is linked to an original Sales-screen transaction, reuse
   that sale's full item list (and just overlay the current running
   paid/balance + payment history). Otherwise — for debts added manually
   from the Credit & Advance tab — synthesize a one-line receipt. */
function buildDebtReceiptSale(d){
  const original = d.saleId && state.sales.find(s=>s.id===d.saleId);
  const base = original ? { ...original } : {
    receiptNumber: d.receiptNumber, createdAt: d.createdAt,
    cashierName: state.user?.name || "Store", customerName: d.customerName,
    items: [{ productName: d.notes ? `Credit / Debt — ${d.notes}` : "Credit / Debt balance", unit:"", qtySold:1, unitPrice:d.total, unitCost:0 }],
    subtotal: d.total, discount:0, taxPct:0, tax:0, total: d.total,
    paymentMethod:"Credit", paymentBreakdown:null
  };
  return Object.assign({}, base, { amountPaid:d.amountPaid, balance:d.balance, history:d.history||[] });
}
/* Same idea for Advance Payments. Falls back to listing the reserved
   products (with an even price split, since exact per-item pricing may
   not have been recorded) when there's no linked sale. */
function buildAdvanceReceiptSale(a){
  const original = a.saleId && state.sales.find(s=>s.id===a.saleId);
  if(original) return Object.assign({}, original, { amountPaid:a.amountPaid, balance:a.balance, advanceProducts:a.products||[] });
  const total = a.total!=null ? a.total : a.amountPaid;
  const qtyTotal = (a.products||[]).reduce((sum,p)=>sum+p.reserved,0) || 1;
  const items = (a.products && a.products.length) ? a.products.map(p=>({
    productName: p.productName + (p.collected>0 ? ` (collected ${fmtQty(p.collected)}/${fmtQty(p.reserved)} ${p.unit})` : ""),
    unit:p.unit, qtySold:p.reserved, unitPrice: +(total*(p.reserved/qtyTotal)/p.reserved || 0).toFixed(2), unitCost:0
  })) : [{ productName:"Advance payment", unit:"", qtySold:1, unitPrice:a.amountPaid, unitCost:0 }];
  return { receiptNumber:a.receiptNumber, createdAt:a.createdAt, cashierName: state.user?.name||"Store",
    customerName:a.customerName, items, subtotal:total, discount:0, taxPct:0, tax:0, total,
    amountPaid:a.amountPaid, balance:a.balance, paymentMethod:"Advance Payment", paymentBreakdown:null,
    advanceProducts: a.products||[] };
}
window.viewDebtReceipt = function(id){
  const d = state.debts.find(x=>x.id===id); if(!d) return;
  showReceiptModal(buildDebtReceiptSale(d));
};
window.viewAdvanceReceipt = function(id){
  const a = state.advances.find(x=>x.id===id); if(!a) return;
  showReceiptModal(buildAdvanceReceiptSale(a));
};
/* Given a plain sales-history record, look up whether it has a linked
   Advance Payment record and, if so, overlay that record's live
   amountPaid/balance/collection-progress onto the receipt — so the
   Sales History receipt always reflects the current collection state,
   not just a snapshot from the moment of the original transaction. */
function enrichSaleWithAdvance(sale){
  const adv = state.advances.find(a=>a.saleId===sale.id);
  if(!adv) return sale;
  return Object.assign({}, sale, { amountPaid:adv.amountPaid, balance:adv.balance,
    advanceProducts:adv.products||[], collectionStatus:adv.collectionStatus });
}
/* Same idea for Credit/Debt sales — a sale paid on credit gets a linked
   `debts` record that keeps its own running amountPaid/balance/history as
   the customer pays it down over time. Overlay that live state onto the
   original sale so its Sales-History row/receipt always shows the current
   paid amount, balance and status instead of a stale snapshot from the
   moment of the original transaction. */
function enrichSaleWithDebt(sale){
  const debt = state.debts.find(d=>d.saleId===sale.id);
  if(!debt) return sale;
  return Object.assign({}, sale, { amountPaid:debt.amountPaid, balance:debt.balance,
    history:debt.history||[], debtId:debt.id,
    status: debt.balance<=0.009 ? "Paid" : (debt.amountPaid>0 ? "Partial/Owing" : "Owing") });
}
/* Convenience wrapper: apply whichever overlay (debt or advance) applies
   to this sale — a given sale can only ever have one of the two linked. */
function enrichSale(sale){
  return enrichSaleWithDebt(enrichSaleWithAdvance(sale));
}
function renderReceipts(){
  const html = `
  <div class="card">
    <div class="section-head">

  </div>`;
  setContent(html);
  const draw = ()=>{
    const q = document.getElementById("rxSearch").value.toLowerCase();
    const rows = [...state.sales].sort((a,b)=>b.createdAt-a.createdAt).filter(s=>
      !q || s.receiptNumber.toLowerCase().includes(q) || (s.customerName||"").toLowerCase().includes(q) ||

      // Status pill: if this sale has a linked credit/debt record, always reflect its
      // live balance rather than the sale's original (one-time) status field, so the
      // moment a debt is paid down or cleared, Sales History updates automatically.
      const liveStatus = debt ? (debt.balance<=0.009 ? "Paid" : (debt.amountPaid>0 ? "Partial/Owing" : "Owing")) : s.status;
      return `
