/* ------------------------------------------------------------------
   15. UNIT CONVERSION ENGINE
   Every product tracks stock in its own `stockUnit`. `unitConversions`
   lists extra sellable units and how many stockUnits each equals.
   Selling in ANY unit deducts the correct fraction of stock.
------------------------------------------------------------------ */
function sellableUnits(product){
  const list = [{ unit: product.stockUnit, factor: 1, price: product.sellingPrice }];
  (product.unitConversions||[]).forEach(u=> list.push(u));
  return list;
}
function stockDeductionFor(product, unitName, qty){
  const u = sellableUnits(product).find(x=>x.unit===unitName) || { factor: 1 };
  return u.factor * qty;
}
// Price for a given sellable unit: uses the admin-set per-unit price if
// one was entered on the product form, otherwise derives it from the
// stock unit's selling price and the unit's conversion factor.
function unitPriceFor(product, unitName){
  if(!product) return 0;
  const u = sellableUnits(product).find(x=>x.unit===unitName);
  if(!u) return product.sellingPrice||0;
  return (u.price!=null && u.price>0) ? u.price : (product.sellingPrice||0)*u.factor;
}
// Human-readable quantity equivalence for a sellable unit, e.g.
// "1 Dozen = 12 Piece" or "1 Carton = 11 Piece".
function unitEquivLabel(product, u){
  if(u.factor===1) return "";
  if(u.factor>1) return `1 ${u.unit} = ${fmtQty(u.factor)} ${product.stockUnit}`;
  return `1 ${product.stockUnit} = ${fmtQty(1/u.factor)} ${u.unit}`;
}

/* ------------------------------------------------------------------
   16. SALES SCREEN (POS)
------------------------------------------------------------------ */
// Fixed combo payment methods: each is a real transaction split across
// two or three tender types with amounts entered directly on the sales
// screen (no separate popup needed).
const COMBO_METHODS = {
  "POS + Cash": ["POS","Cash"],
  "Transfer + Cash": ["Transfer","Cash"],
  "Transfer + POS + Cash": ["Transfer","POS","Cash"]
};
// Standard single-tender methods vs. combo/credit methods — rendered as two
// labelled groups so the panel stays scannable, especially on small screens.
const PAYMENT_METHODS_STANDARD = ["Cash","Transfer","POS","Bank","Mobile Money","Cheque","Wallet"];
const PAYMENT_METHODS_SPECIAL = ["POS + Cash","Transfer + Cash","Transfer + POS + Cash","Split Payment","Advance Payment","Credit"];
const PAYMENT_METHODS = [...PAYMENT_METHODS_STANDARD, ...PAYMENT_METHODS_SPECIAL];
const PAYMENT_METHOD_ICONS = {
  "Cash":"💵","Transfer":"🏦","POS":"💳","Bank":"🏛️","Mobile Money":"📱","Cheque":"🖊️","Wallet":"👛",
  "POS + Cash":"💳➕💵","Transfer + Cash":"🏦➕💵","Transfer + POS + Cash":"🏦➕💳➕💵",
  "Split Payment":"🔀","Advance Payment":"⏳","Credit":"🧾"
};

// Total spendable store credit a customer has accumulated across every
// Advance Payment record on file for them (e.g. from having overpaid a
// prior deposit). This is the single source of truth for "how much store
// credit can this customer redeem right now" — used both at checkout and
// on the Customer profile.
function customerStoreCredit(customerId){
  if(!customerId) return 0;
  return state.advances.filter(a=>a.customerId===customerId).reduce((sum,a)=>sum+Math.max(0,a.creditBalance||0),0);
}

/* ------------------------------------------------------------------
   16A. CUSTOMER ACCOUNT ON THE SALES SCREEN (store credit / debit)
   Credit = unspent store credit (advance deposits / credited returns).
   Debit  = money the customer still owes (sum of open debt balances),
            using the same grouping rule as Customer Accounts.
   Everything is rounded to 2 decimals so figures never drift.
------------------------------------------------------------------ */
const r2 = n => Math.round(((Number(n)||0) + Number.EPSILON) * 100) / 100;
let creditManualFor = null; // customer id whose credit amount the rep typed by hand
// One source of truth for the cart maths — the cart panel, payment box and checkout all read these
// figures, rounded to 2 decimals, so what is shown is always exactly what is charged.
function cartTotals(){
  const subtotal = r2(state.cart.reduce((a,c)=>a+c.qty*c.unitPrice,0));
  const discount = r2(Math.min(Math.max(0, +(document.getElementById("discountInput")?.value||0)), subtotal));
  const taxPct = Math.max(0, +(document.getElementById("taxInput")?.value||0));
  const taxable = r2(Math.max(0, subtotal - discount));
  const tax = r2(taxable * taxPct / 100);
  return { subtotal, discount, taxPct, taxable, tax, total: r2(taxable + tax) };
}
function customerDebit(customer){
  if(!customer) return 0;
  const nm = String(customer.name||"").trim().toLowerCase();
  return r2(state.debts
    .filter(d=> d.customerId ? d.customerId===customer.id : String(d.customerName||"").trim().toLowerCase()===nm)
    .reduce((sum,d)=>sum+Math.max(0,+d.balance||0),0));
}
// Open (unpaid) debts of a customer, oldest first — same matching rule as customerDebit().
function customerOpenDebts(customer){
  if(!customer) return [];
  const nm = String(customer.name||"").trim().toLowerCase();
  return state.debts
    .filter(d=> (d.customerId ? d.customerId===customer.id : String(d.customerName||"").trim().toLowerCase()===nm) && (+d.balance||0) > 0.009)
    .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}
// Push a debt's current progress back onto the sale it came from, so Receipt History always reflects the real balance.
async function pushDebtToLinkedSale(debt){
  if(!debt.saleId) return;
  const linkedSale = state.sales.find(s=>s.id===debt.saleId);
  if(!linkedSale) return;
  linkedSale.amountPaid = debt.amountPaid;
  linkedSale.balance = debt.balance;
  linkedSale.status = debt.balance<=0.009 ? "Paid" : "Partial/Owing";
  await dataSet("sales", linkedSale);
  await dataSet("receipts", { id:linkedSale.id, ...linkedSale });
  const rxIdx = state.receipts.findIndex(r=>r.id===linkedSale.id);
  if(rxIdx>-1) state.receipts[rxIdx] = { id:linkedSale.id, ...linkedSale };
}
// Apply a payment to one debt (no ledger entry — callers decide how the money is recorded).
// A debt that mirrors an Advance Payment shortfall is settled by crediting the payment onto the advance itself and
// re-deriving the balance from it; decrementing debt.balance as well would count the same payment twice.
async function applyDebtPayment(debt, amt, method, ref){
  debt.history = debt.history || [];
  const entry = { amount:amt, date:Date.now(), method, by:state.user.name };
  if(ref) entry.ref = ref;
  if(debt.advanceId){
    debt.history.push(entry);
    const adv = state.advances.find(a=>a.id===debt.advanceId);
    if(adv){
      adv.amountPaid = r2(adv.amountPaid + amt);
      await dataSet("advancePayments", adv);
      await syncAdvanceDebt(adv);
    } else {
      debt.amountPaid = r2(debt.amountPaid + amt); debt.balance = r2(debt.balance - amt);
      await dataSet("debts", debt);
    }
  } else {
    debt.amountPaid = r2(debt.amountPaid + amt); debt.balance = r2(debt.balance - amt);
    debt.history.push(entry);
    await dataSet("debts", debt);
  }
  await pushDebtToLinkedSale(debt);
}
// Exact reverse of applyDebtPayment (used when a receipt that cleared debts is deleted).
async function unapplyDebtPayment(debt, amt, ref){
  debt.history = debt.history || [];
  const i = debt.history.findIndex(h=>h.ref===ref && Math.abs((+h.amount||0)-amt)<0.01);
  if(i>=0) debt.history.splice(i,1);
  if(debt.advanceId){
    const adv = state.advances.find(a=>a.id===debt.advanceId);
    if(adv){
      adv.amountPaid = r2(Math.max(0, adv.amountPaid - amt));
      await dataSet("advancePayments", adv);
      await syncAdvanceDebt(adv);
      return;
    }
  }
  debt.amountPaid = r2(Math.max(0, debt.amountPaid - amt)); debt.balance = r2(debt.balance + amt);
  await dataSet("debts", debt);
  await pushDebtToLinkedSale(debt);
}
// A customer paid MORE than the sale needed. The extra goes (1) to their oldest unpaid debts first, then
// (2) whatever is left becomes store credit (an Advance record) — so it appears in their account automatically.
async function allocateExcess(customer, amount, method, sale){
  let remaining = r2(amount), toDebt = 0, toCredit = 0;
  const allocations = [];
  for(const debt of customerOpenDebts(customer)){
    if(remaining <= 0.009) break;
    const pay = r2(Math.min(debt.balance, remaining));
    if(pay <= 0.009) continue;
    await applyDebtPayment(debt, pay, method, sale.receiptNumber);
    allocations.push({ debtId:debt.id, receiptNumber:debt.receiptNumber, amount:pay });
    toDebt = r2(toDebt + pay); remaining = r2(remaining - pay);
  }
  if(remaining > 0.009){
    const adv = { id:genId("adv"), customerId:customer.id, customerName:customer.name, phone:customer.phone||"", saleId:null,
      receiptNumber:"ADV-"+Date.now().toString().slice(-8), amountPaid:remaining, total:0, balance:0, creditBalance:remaining,
      products:[], collectionStatus:"Fully Collected", isDeposit:true, excessOf:sale.id,
      notes:`Excess payment on receipt ${sale.receiptNumber}`, createdBy:state.user.name, createdAt:Date.now() };
    await dataSet("advancePayments", adv); state.advances.push(adv);
    toCredit = remaining;
  }
  return { toDebt, toCredit, allocations };
}
// Live "what happens to the money" box under the payment method (amount received vs amount due).
let excessModePref = "account";
function updatePayOutcome(){
  const host = document.getElementById("payOutcome"); if(!host) return;
  const checked = document.querySelector('input[name="paym"]:checked');
  const method = checked ? checked.value : "Cash";
  const combo = !!COMBO_METHODS[method];
  const single = !combo && method!=="Split Payment" && method!=="Credit" && method!=="Advance Payment";
  if((!single && !combo) || !state.cart.length){ host.innerHTML = ""; return; }
  const cust = state.activeCustomer;
  const { total } = cartTotals();
  const creditAvail = cust ? customerStoreCredit(cust.id) : 0;
  const applied = r2(Math.min(creditAvail, total, Math.max(0, +(document.getElementById("storeCreditApply")?.value||0))));
  const due = r2(Math.max(0, total - applied));
  let received;
  if(single){ const el = document.getElementById("amountReceived"); received = r2(Math.max(0, el && el.value!=="" ? +el.value : due)); }
  else received = r2([...document.querySelectorAll(".comboAmt")].reduce((a,i)=>a+(+i.value||0),0));
  const diff = r2(received - due);
  let html = "";
  if(diff > 0.009){
    if(cust){
      const owing = customerDebit(cust);
      const sel = `<div class="cart-row"><span>Extra amount</span><select id="excessMode" style="padding:5px 8px;border-radius:6px;border:1px solid var(--line)">
        <option value="account" ${excessModePref==="account"?"selected":""}>Keep on customer's account</option>
        <option value="change" ${excessModePref==="change"?"selected":""}>Give back as change (cash)</option></select></div>`;
      if(excessModePref==="change"){
        html = `${sel}<div class="ca-row ca-ok"><span>Change to give back</span><b>${money(diff)}</b></div>`;
      } else {
        const toDebt = r2(Math.min(owing, diff)), toCredit = r2(diff - toDebt);
        html = `${sel}<div class="ca-row"><span>Excess received</span><b>${money(diff)}</b></div>
          ${toDebt>0.009 ? `<div class="ca-row"><span>→ clears previous debit</span><span class="ca-ok">${money(toDebt)}</span></div>` : ""}
          ${toCredit>0.009 ? `<div class="ca-row"><span>→ added to store credit</span><span class="ca-ok">${money(toCredit)}</span></div>` : ""}`;
      }
    } else {
      html = `<div class="ca-row ca-ok"><span>Change to give back</span><b>${money(diff)}</b></div>`;
    }
  } else if(diff < -0.009){
    html = cust
      ? `<div class="ca-row"><span>Short by</span><b class="ca-bad">${money(-diff)}</b></div><div class="ca-hint">The shortfall is saved as a debt on ${escapeHtml(cust.name)}'s account.</div>`
      : `<div class="ca-hint ca-bad">⚠️ Short by ${money(-diff)} — select a customer to record the balance as credit.</div>`;
  } else if(received > 0.009){
    html = `<div class="ca-hint ca-ok">✔ Exact payment</div>`;
  }
  host.innerHTML = html;
  const sel = document.getElementById("excessMode");
  if(sel) sel.addEventListener("change", ()=>{ excessModePref = sel.value; updatePayOutcome(); });
}
function renderCustAccountPanel(total){
  const host = document.getElementById("custAccountPanel"); if(!host) return;
  const c = state.activeCustomer;
  if(!c){ host.style.display = "none"; host.innerHTML = ""; return; }
  const credit = r2(customerStoreCredit(c.id)), debit = customerDebit(c);
  const applied = r2(Math.min(credit, total, Math.max(0, +(document.getElementById("storeCreditApply")?.value||0))));
  const saleDue = r2(Math.max(0, total - applied));
  const hasCart = state.cart.length > 0;
  host.style.display = "";
  host.innerHTML = `<div class="ca-head">👤 ${escapeHtml(c.name)} — Account</div>
    <div class="ca-row"><span>Store Credit</span><span class="${credit>0.009?'ca-ok':''}">${money(credit)}</span></div>
    <div class="ca-row"><span>Debit (owing)</span><span class="${debit>0.009?'ca-bad':''}">${money(debit)}</span></div>
    ${hasCart ? `<div class="ca-sep"></div>
    <div class="ca-row"><span>This sale</span><span>${money(total)}</span></div>
    ${applied>0.009 ? `<div class="ca-row"><span>Store credit applied</span><span class="ca-ok">-${money(applied)}</span></div>` : ""}
    <div class="ca-row"><span>Due for this sale</span><b>${money(saleDue)}</b></div>
    ${debit>0.009 ? `<div class="ca-row"><span>Previous debit</span><span class="ca-bad">+${money(debit)}</span></div>
    <div class="ca-row ca-total"><span>Total payable (sale + previous debit)</span><span>${money(r2(saleDue+debit))}</span></div>
    <div class="ca-hint">Any extra paid clears the previous debit first (oldest first), then is kept as store credit.</div>` : `<div class="ca-hint">Any extra paid is kept as store credit on the customer's account.</div>`}` : ""}`;
}

/* Renders the contextual info / input panel under the payment method
   radios, based on whichever method is currently selected. Keeps all
   the "necessary information" (customer requirement, partial-payment
   fields, combo breakdown) visible directly on the Sales screen instead
   of behind a popup. */
function updatePayDetails(){
  const host = document.getElementById("payDetails");
  if(!host) return;
  const checked = document.querySelector('input[name="paym"]:checked');
  const method = checked ? checked.value : "Cash";
  const grandTotal = cartTotals().total;
  // Store credit, if applied, reduces only what still needs to be collected
  // by the chosen payment method below — it never changes the real total.
  const creditAvail = state.activeCustomer ? customerStoreCredit(state.activeCustomer.id) : 0;
  const creditApplied = Math.min(creditAvail, grandTotal, Math.max(0, +(document.getElementById("storeCreditApply")?.value||0)));
  const dueAfterCredit = Math.max(0, grandTotal - creditApplied);
  const creditNote = creditApplied>0.009 ? `<p class="pay-detail-note">🎟️ Store credit of <b>${money(creditApplied)}</b> applied — <b>${money(dueAfterCredit)}</b> still due below.</p>` : "";

  if(COMBO_METHODS[method]){
    const parts = COMBO_METHODS[method];
    host.innerHTML = `<div class="pay-detail-box">
      ${creditNote}
      <p class="pay-detail-note">Enter how much was paid by each method. They should add up to the amount due (${money(dueAfterCredit)}). If they fall short, the remainder is recorded as credit — select a customer first. If they pay more, the extra is kept on the customer's account (or given as change).</p>
      ${parts.map((p,i)=>`<div class="cart-row"><span>${escapeHtml(p)}</span>
        <input type="number" class="comboAmt" data-method="${escapeHtml(p)}" min="0" value="${i===0?fmtQty(dueAfterCredit):0}" style="width:120px;text-align:right;padding:5px 8px;border-radius:6px;border:1px solid var(--line)"></div>`).join("")}
      <div class="cart-row total"><span>Remaining</span><span id="comboRemaining">${money(0)}</span></div>
      <div id="payOutcome"></div>
    </div>`;
    const updateRemaining = ()=>{
      const sum = [...host.querySelectorAll(".comboAmt")].reduce((a,i)=>a+(+i.value||0),0);
      document.getElementById("comboRemaining").textContent = money(Math.max(0, dueAfterCredit-sum));
      updatePayOutcome();
    };
    host.querySelectorAll(".comboAmt").forEach(i=> i.addEventListener("input", updateRemaining));
    updateRemaining();
  } else if(method==="Split Payment"){
    host.innerHTML = `<div class="pay-detail-box">${creditNote}<p class="pay-detail-note">You'll break the payment down across any combination of methods in a popup right after you click "Charge & Print". If the total entered is less than the amount due, select a customer so the shortfall can be saved as credit. If it is more, the extra is kept on the customer's account (or given back as cash change).</p></div>`;
  } else if(method==="Credit"){
    host.innerHTML = `<div class="pay-detail-box">
      ${creditNote}
      <p class="pay-detail-note">${state.activeCustomer? "Customer: <b>"+escapeHtml(state.activeCustomer.name)+"</b>." : "⚠️ Select a customer above — Credit sales must be linked to a customer."} Enter anything paid now; the rest is saved as a debt on their account.</p>
      <div class="cart-row"><span>Amount Paid Now</span><input type="number" id="creditPaidNow" min="0" max="${dueAfterCredit}" value="0" style="width:120px;text-align:right;padding:5px 8px;border-radius:6px;border:1px solid var(--line)"></div>
    </div>`;
  } else if(method==="Advance Payment"){

function addToCart(product, unitName){
  if(product.needsPricing){ toast("Set a selling price for this product first (Products page).", "warn"); return; }
  if(product.currentStock<=0){ toast(`${product.name} is out of stock.`, "warn"); return; }
  const unit = unitName || product.stockUnit;
  const existing = state.cart.find(c=>c.productId===product.id && c.unit===unit);
  if(existing) existing.qty += 1;
  else state.cart.push({ productId:product.id, productName:product.name, unit,
    qty:1, unitPrice:unitPriceFor(product, unit), unitCost:product.costPrice, override:false });
  renderCart();
}

        </div>
      </div>`;
      }

      return `<div class="cart-line" data-idx="${idx}">

            <button class="icon-sm removeLine">✕</button>
          </div>
        </div>
        <div class="qty-ctrl">
          <button class="decQty">−</button>
          <input type="number" min="0.01" step="0.01" class="qtyInput" value="${c.qty}">
          <button class="incQty">+</button>
          <select class="unitSelect">${units.map(u=>`<option ${u===c.unit?"selected":""}>${u}</option>`).join("")}</select>
          ${can("priceOverride")?`<input type="number" class="priceOverride" title="Override price" value="${c.unitPrice}" style="width:70px;padding:4px;border-radius:6px;border:1px solid var(--line)">`:""}
        </div>
      </div>`;
    }).join("");
    box.querySelectorAll(".removeLine").forEach(b=> b.addEventListener("click",(e)=>{ state.cart.splice(+e.target.closest(".cart-line").dataset.idx,1); renderCart(); }));
    box.querySelectorAll(".decQty").forEach(b=> b.addEventListener("click",(e)=>{ const i=+e.target.closest(".cart-line").dataset.idx; state.cart[i].qty=Math.max(0.01,state.cart[i].qty-1); renderCart(); }));
    box.querySelectorAll(".incQty").forEach(b=> b.addEventListener("click",(e)=>{ const i=+e.target.closest(".cart-line").dataset.idx; state.cart[i].qty+=1; renderCart(); }));

    box.querySelectorAll(".unitSelect").forEach(b=> b.addEventListener("change",(e)=>{ const i=+e.target.closest(".cart-line").dataset.idx; const line=state.cart[i]; line.unit=e.target.value; if(!line.override){ const prod=state.products.find(x=>x.id===line.productId); line.unitPrice=unitPriceFor(prod, line.unit); } renderCart(); }));
    box.querySelectorAll(".priceOverride").forEach(b=> b.addEventListener("change",(e)=>{ const i=+e.target.closest(".cart-line").dataset.idx; state.cart[i].unitPrice=Math.max(0,+e.target.value||0); state.cart[i].override=true; renderCart(); }));

  if(document.getElementById("sumSub")){

    document.getElementById("sumSub").textContent = money(subtotal);
    document.getElementById("sumTax").textContent = money(tax);
    document.getElementById("sumTotal").textContent = money(total);
  }
  const mcbCount = document.getElementById("mcbCount"), mcbTotal = document.getElementById("mcbTotal");
  if(mcbCount){
    const itemCount = state.cart.reduce((a,c)=>a+c.qty,0);
    mcbCount.textContent = `${fmtQty(itemCount)} item${itemCount===1?"":"s"}`;
    mcbTotal.textContent = money(total);
    document.getElementById("mobileCartBar").classList.toggle("show", state.cart.length>0);
  }
  const creditRow = document.getElementById("storeCreditRow");
  if(creditRow){
    const avail = state.activeCustomer ? customerStoreCredit(state.activeCustomer.id) : 0;
    const creditInput = document.getElementById("storeCreditApply");
    if(avail>0.009){
      creditRow.style.display = "";
      document.getElementById("storeCreditAvail").textContent = `(${money(avail)} available)`;
      const cap = Math.min(avail, total);
      creditInput.max = cap.toFixed(2);
      if(+creditInput.value > cap) creditInput.value = cap.toFixed(2);
      // Auto-apply the credit against the cart total unless the rep typed their own amount.
      if(creditManualFor !== state.activeCustomer.id) creditInput.value = cap.toFixed(2);
    } else {
      creditRow.style.display = "none";
      creditInput.value = 0;
    }
  }
  renderCustAccountPanel(total);
  updatePayDetails();
}

  document.querySelectorAll(".resumeBtn").forEach(b=> b.addEventListener("click", async ()=>{
    const h = held.find(x=>x.id===b.dataset.id); if(!h) return;

      await idbPut("heldSales", { id:genId("hold"), cart:state.cart, customer:state.activeCustomer, createdAt:Date.now(), cashier:state.user.name });
    }

  }));

// Advance payment with NO products: the money is kept as store credit.
async function depositCheckout(){
  const cust = state.activeCustomer;
  if(!cust){ toast("Select or add a customer first — an advance payment needs a customer on file.","err"); return; }
  const amount = r2(Math.max(0, +document.getElementById("advPaidNow")?.value||0));
  if(!(amount>0)){ toast("Enter the amount the customer is paying in advance.","err"); return; }
  const note = document.getElementById("saleNotes").value.trim();
  const adv = { id:genId("adv"), customerId:cust.id, customerName:cust.name, phone:cust.phone||"", saleId:null,
    receiptNumber:"ADV-"+Date.now().toString().slice(-8), amountPaid:amount, total:0, balance:0, creditBalance:amount,
    products:[], collectionStatus:"Fully Collected", isDeposit:true, notes: note || "Advance deposit (no products selected)",
    createdBy: state.user.name, createdAt: Date.now() };
  await dataSet("advancePayments", adv); state.advances.push(adv);
  await dataSet("payments", { id:genId("pay"), type:"advance", advanceId:adv.id, receiptNumber:adv.receiptNumber,
    method:"Advance Payment", amount, createdAt:Date.now(), by:state.user.name, customerId:cust.id });
  state.cart = []; state.activeCustomer = null;
  toast(`Advance deposit of ${money(amount)} saved — ${adv.receiptNumber}`, "ok");
  showReceiptModal(enrichSaleWithReturns(buildAdvanceReceiptSale(adv)));
  renderSales();
}
let checkoutBusy = false;
// Wrapper: locks the button while a sale is being saved so a double-tap can never
// record the same sale (and deduct the same stock) twice, and surfaces any failure.
async function checkout(){
  if(checkoutBusy) return;
  checkoutBusy = true;
  const btn = document.getElementById("checkoutBtn");
  if(btn) btn.disabled = true;
  try{ await checkoutInner(); }
  catch(err){
    console.error("Checkout failed", err);
    toast("Checkout did not finish: " + ((err && err.message) || err) + " — check Receipt History before trying again.", "err", 7000);
  }
  finally{
    checkoutBusy = false;
    const b = document.getElementById("checkoutBtn"); if(b) b.disabled = false;
  }
}
async function checkoutInner(){
  const checked = document.querySelector('input[name="paym"]:checked');
  const method = checked ? checked.value : "Cash";
  if(!state.cart.length){
    if(method==="Advance Payment") return depositCheckout();
    return toast("Cart is empty","warn");
  }
  const { subtotal, discount, taxPct, tax, total } = cartTotals();
  const notes = document.getElementById("saleNotes").value.trim();

  // Store credit the active customer has available (accumulated from a past
  // Advance Payment where they paid more than the goods were worth). If
  // applied, it only reduces how much still needs to be collected by the
  // chosen payment method below — the sale's real total/value is untouched.
  const creditAvailable = state.activeCustomer ? customerStoreCredit(state.activeCustomer.id) : 0;
  const creditApplied = r2(Math.min(creditAvailable, total, Math.max(0, +(document.getElementById("storeCreditApply")?.value||0))));
  const payDue = r2(Math.max(0, total - creditApplied));
  const prevDebit = state.activeCustomer ? customerDebit(state.activeCustomer) : 0; // owed BEFORE this sale

  // validate & compute stock deductions, prevent overselling / negative stock.
  // Stock is checked per PRODUCT across all cart lines (e.g. 1 Bag + 1 Half Bag of
  // the same product), not per line, so the same stock can't be sold twice.
  const lines = [];
  const stockNeeded = new Map();
  for(const c of state.cart){
    if(c.custom){
      // Manual "other item": no product / stock. qtyInStockUnit = qty keeps every report formula numeric.
      lines.push({ productId:null, productName:c.productName, unit:c.unit, qtySold:c.qty, qtyInStockUnit:c.qty,
        unitPrice:c.unitPrice, unitCost:0, isCustom:true });
      continue;
    }
    const product = state.products.find(p=>p.id===c.productId);
    if(!product){ toast(`"${c.productName}" is no longer in the product list — remove it from the sale.`, "err"); return; }
    if(product.needsPricing && !(c.unitPrice>0)){ toast(`Set a selling price for ${product.name} first (Products page).`, "err"); return; }
    const deduction = stockDeductionFor(product, c.unit, c.qty);
    const needed = (stockNeeded.get(product.id)||0) + deduction;
    stockNeeded.set(product.id, needed);
    if(needed > product.currentStock + 1e-9){
      toast(`Not enough stock for ${product.name}. Available: ${fmtQty(product.currentStock)} ${product.stockUnit}`, "err");
      return;
    }
    lines.push({ productId:product.id, productName:product.name, unit:c.unit, qtySold:c.qty,
      qtyInStockUnit:deduction, unitPrice:c.unitPrice, unitCost:product.costPrice });
  }

  let amountPaid = payDue, balance = 0, paymentBreakdown = null;
  let tenderLines = [];                       // money actually received, one line per payment method
  let tendered = 0, excess = 0, changeGiven = 0;
  const isTender = method!=="Credit" && method!=="Advance Payment";
  const coveredByCredit = payDue <= 0.009;    // store credit paid for everything — nothing left to collect
  if(method==="Credit"){
    if(!state.activeCustomer){ toast(`Select or add a customer first — ${method} needs a customer on file.`, "err"); return; }
    const paid = r2(Math.min(payDue, Math.max(0, +document.getElementById("creditPaidNow")?.value||0)));
    amountPaid = paid; balance = r2(payDue-paid);
  } else if(method==="Advance Payment"){
    if(!state.activeCustomer){ toast(`Select or add a customer first — ${method} needs a customer on file.`, "err"); return; }
    const paid = r2(Math.max(0, +document.getElementById("advPaidNow")?.value||0));
    amountPaid = paid; balance = r2(Math.max(0, payDue-paid));
  } else if(coveredByCredit && (method==="Split Payment" || COMBO_METHODS[method])){
    amountPaid = 0; balance = 0;
  } else if(method==="Split Payment"){
    const res = await promptSplitPaymentModal(payDue);
    if(res===null) return;
    tenderLines = res.lines.map(l=>({ method:l.method, amount:r2(l.amount) }));
  } else if(COMBO_METHODS[method]){
    const rows = [...document.querySelectorAll(".comboAmt")].map(i=>({ method:i.dataset.method, amount:r2(Math.max(0,+i.value||0)) })).filter(l=>l.amount>0);
    if(!rows.length){ toast("Enter at least one amount for the payment breakdown","err"); return; }
    tenderLines = rows;
  } else {
    const typed = document.getElementById("amountReceived");
    const received = r2(Math.max(0, (typed && typed.value!=="") ? +typed.value : payDue));
    if(received > 0.009) tenderLines = [{ method, amount:received }];
  }
  if(isTender){
    tendered = r2(tenderLines.reduce((a,l)=>a+l.amount,0));
    if(tendered > payDue + 0.009){
      // The customer handed over MORE than this sale needs.
      excess = r2(tendered - payDue);
      let mode = document.getElementById("excessMode")?.value || "account";
      if(!state.activeCustomer) mode = "change";
      if(mode==="change"){
        const cashIn = tenderLines.filter(l=>l.method==="Cash").reduce((a,l)=>a+l.amount,0);
        if(cashIn < excess - 0.009){
          toast("Change can only be given out of the Cash received. Reduce the amount received, or select a customer so the extra is kept on their account.","err", 6000);
          return;
        }
        let left = excess;
        for(const l of tenderLines.filter(x=>x.method==="Cash")){ const cut = Math.min(l.amount, left); l.amount = r2(l.amount-cut); left = r2(left-cut); }
        tenderLines = tenderLines.filter(l=>l.amount>0.009);
        changeGiven = excess; excess = 0;
      }
    }
    const netTendered = r2(tenderLines.reduce((a,l)=>a+l.amount,0));
    const paidToSale = r2(Math.min(netTendered, payDue));
    amountPaid = paidToSale; balance = r2(Math.max(0, payDue - paidToSale));
    if(balance > 0.009 && !state.activeCustomer){
      toast("The amount received is less than the amount due — select a customer so the balance can be recorded as credit.", "err", 6000);
      return;
    }
    if(method==="Split Payment" || COMBO_METHODS[method]) paymentBreakdown = tenderLines.length ? tenderLines.map(l=>({ method:l.method, amount:l.amount })) : null;
  }
  // Fold the applied store credit into the recorded amountPaid — it was a
  // real form of payment for this sale, just not new cash. total - amountPaid
  // still correctly equals balance since balance was derived from payDue.
  if(creditApplied>0.009) amountPaid = r2(amountPaid + creditApplied);

  const receiptNumber = "AGB-" + Date.now().toString().slice(-8);
  const sale = {
    id: genId("sale"), receiptNumber, createdAt: Date.now(),
    cashierId: state.user.id, cashierName: state.user.name,
    customerId: state.activeCustomer?.id||null, customerName: state.activeCustomer?.name||"Walk-in",
    items: lines, subtotal, discount, taxPct, tax, total, amountPaid, balance, paymentBreakdown,
    amountReceived: isTender ? tendered : r2(amountPaid - creditApplied), changeGiven,
    paymentMethod: method, notes, status: balance>0.009 ? "Partial/Owing" : "Paid", creditApplied,
    // Account snapshot at the moment of sale (printed on the receipt)
    creditBefore: state.activeCustomer ? r2(creditAvailable) : 0,
    prevDebit: r2(prevDebit),
    debitAfter: state.activeCustomer ? r2(prevDebit + (method!=="Advance Payment" ? Math.max(0,balance) : 0)) : 0
  };
  await dataSet("sales", sale);
  state.sales.push(sale);

  // stock deduction + history
  for(const l of lines){
    if(l.isCustom) continue; // other items never touch stock
    const product = state.products.find(p=>p.id===l.productId);
    product.currentStock = +(product.currentStock - l.qtyInStockUnit).toFixed(4);
    await dataSet("products", product);
    await dataSet("stockHistory", { id:genId("stk"), productId:product.id, productName:product.name,
      type:"sale", change:-l.qtyInStockUnit, reference:receiptNumber, createdAt:Date.now(), by:state.user.name });
  }

  // save each payment method to the payments ledger (the ledger always equals the money really received, once)
  if(paymentBreakdown){
    for(const l of paymentBreakdown){
      await dataSet("payments", { id:genId("pay"), type:"split", saleId:sale.id, receiptNumber,
        method:l.method, amount:l.amount, createdAt:Date.now(), by:state.user.name });
    }
  } else if(!isTender){
    // Credit / Advance: amountPaid includes folded-in store credit — the ledger only gets the actual tender.
    const tenderPaid = r2(amountPaid - creditApplied);
    if(tenderPaid > 0.009){
      await dataSet("payments", { id:genId("pay"), type:"sale", saleId:sale.id, receiptNumber,
        method, amount:tenderPaid, createdAt:Date.now(), by:state.user.name });
    }
  } else {
    for(const l of tenderLines){
      await dataSet("payments", { id:genId("pay"), type:"sale", saleId:sale.id, receiptNumber,
        method:l.method, amount:l.amount, createdAt:Date.now(), by:state.user.name });
    }
  }

  // If store credit was applied, actually spend it off the customer's
  // Advance Payment record(s) — oldest first — and log it in the payments
  // ledger under its own type, separate from real cash/transfer/POS tender.
  if(creditApplied>0.009 && state.activeCustomer){
    let remaining = creditApplied;
    const customerAdvances = state.advances
      .filter(a=>a.customerId===state.activeCustomer.id && (a.creditBalance||0)>0.009)
      .sort((a,b)=>a.createdAt-b.createdAt);
    for(const adv of customerAdvances){
      if(remaining<=0.009) break;
      const take = Math.min(adv.creditBalance, remaining);
      adv.creditBalance = +(adv.creditBalance-take).toFixed(2);
      adv.creditUsed = r2((adv.creditUsed||0) + take);
      await dataSet("advancePayments", adv);
      remaining = +(remaining-take).toFixed(2);
    }
    await dataSet("payments", { id:genId("pay"), type:"storeCredit", saleId:sale.id, receiptNumber,
      amount:creditApplied, createdAt:Date.now(), by:state.user.name });
  }

  // route the outstanding balance / reservation to the right place
  const advProducts = lines.filter(l=>!l.isCustom).map(l=>({ productId:l.productId, productName:l.productName, reserved:l.qtySold, unit:l.unit, collected:0, unitPrice:l.unitPrice }));
  if(balance>0.009 && state.activeCustomer){
    if(method!=="Advance Payment"){
      // Credit, Split Payment, or any of the combo methods (POS+Cash, Transfer+Cash, Transfer+POS+Cash)
      const debt = { id:genId("debt"), customerId:state.activeCustomer.id, customerName:state.activeCustomer.name,
        phone:state.activeCustomer.phone||"", saleId:sale.id, receiptNumber, total, amountPaid, balance,
        dueDate:null, createdAt:Date.now(), history:[{amount:amountPaid, date:Date.now()}] };
      await dataSet("debts", debt); state.debts.push(debt);
    } else if(method==="Advance Payment"){
      const adv = { id:genId("adv"), customerId:state.activeCustomer.id, customerName:state.activeCustomer.name,
        phone:state.activeCustomer.phone||"", saleId:sale.id, receiptNumber, amountPaid, total, balance, creditBalance:0,
        products: advProducts, collectionStatus:"Not Collected", createdAt:Date.now() };
      await dataSet("advancePayments", adv); state.advances.push(adv);
      await syncAdvanceDebt(adv);
    }
  } else if(method==="Advance Payment" && state.activeCustomer){
    // fully paid in advance (possibly more than the total) — any amount
    // beyond the goods' value is kept as store credit on the record
    const creditBalance = Math.max(0, r2(amountPaid-total));
    const adv = { id:genId("adv"), customerId:state.activeCustomer.id, customerName:state.activeCustomer.name,
      phone:state.activeCustomer.phone||"", saleId:sale.id, receiptNumber, amountPaid, total, balance:0, creditBalance,
      products: advProducts, collectionStatus:"Not Collected", createdAt:Date.now() };
    await dataSet("advancePayments", adv); state.advances.push(adv);
    await syncAdvanceDebt(adv);
  }
  // Excess payment -> customer's account: oldest debts first, the rest becomes store credit.
  if(excess > 0.009 && state.activeCustomer){
    const res = await allocateExcess(state.activeCustomer, excess, method, sale);
    sale.excessToDebt = res.toDebt; sale.excessToCredit = res.toCredit; sale.excessAllocations = res.allocations;
  }
  // Account position AFTER everything above — printed on the receipt.
  if(state.activeCustomer){
    sale.creditAfter = r2(customerStoreCredit(state.activeCustomer.id));
    sale.debitAfter = customerDebit(state.activeCustomer);
  }
  await dataSet("sales", sale);
  await dataSet("receipts", { id: sale.id, ...sale });
  state.receipts.push(sale);

  state.cart = []; state.activeCustomer = null;
  toast(`Sale completed — ${receiptNumber}`, "ok");
  showReceiptModal(sale);
  renderSales();
}
function promptPaymentSplit(total){
  return new Promise(resolve=>{
    openModal(`<div class="modal-head"><h3>Amount Paid Now</h3><button class="close-x" id="cancelSplit">✕</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--ink-soft)">Total due: <b>${money(total)}</b>. Enter what the customer is paying now — the rest will be recorded as balance owing.</p>
      <div class="field"><label>Amount Paid Now</label><input type="number" id="paidNowInput" value="0" min="0" max="${total}"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" id="cancelSplit2">Cancel</button><button class="btn btn-primary" id="confirmSplit">Confirm</button></div>`, {dismissable:false});
    const close = (val)=>{ closeModal(); resolve(val); };
    document.getElementById("cancelSplit").onclick = ()=>close(null);
    document.getElementById("cancelSplit2").onclick = ()=>close(null);
    document.getElementById("confirmSplit").onclick = ()=>{
      const paid = Math.min(total, Math.max(0, +document.getElementById("paidNowInput").value||0));
      close({ paid });
    };
  });
}
function promptSplitPaymentModal(total){
  return new Promise(resolve=>{
    const methods = ["Cash","Transfer","POS","Bank","Mobile Money","Cheque","Wallet"];
    openModal(`<div class="modal-head"><h3>Split Payment</h3><button class="close-x" id="spCancel1">✕</button></div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--ink-soft)">Total due: <b>${money(total)}</b>. Break the payment down across two or more methods.</p>
      <div id="spRows"></div>
      <button class="btn btn-ghost btn-sm" id="spAddRow" style="margin-top:6px">+ Add payment method</button>
      <div class="cart-row total" style="margin-top:14px"><span>Remaining</span><span id="spRemaining">${money(total)}</span></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" id="spCancel2">Cancel</button><button class="btn btn-primary" id="spConfirm">Confirm</button></div>`, {dismissable:false});
    const rowsHost = document.getElementById("spRows");
    const updateRemaining = ()=>{
      const sum = [...rowsHost.children].reduce((a,r)=>a+(+r.querySelector(".spAmt").value||0),0);
      document.getElementById("spRemaining").textContent = sum > total + 0.009 ? "Excess " + money(sum-total) : money(Math.max(0,total-sum));
    };
    const addRow = (method, amount)=>{
      const row = document.createElement("div");
      row.style.cssText = "display:flex;gap:8px;margin-bottom:8px;align-items:center;";
      row.innerHTML = `<select class="spMethod" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--line)">${methods.map(m=>`<option ${m===method?"selected":""}>${m}</option>`).join("")}</select>
        <input type="number" class="spAmt" value="${amount||0}" min="0" style="width:120px;padding:8px;border-radius:8px;border:1px solid var(--line)">
        <button class="icon-sm spRem">✕</button>`;
      row.querySelector(".spAmt").addEventListener("input", updateRemaining);
      row.querySelector(".spRem").addEventListener("click", ()=>{ row.remove(); updateRemaining(); });
      rowsHost.appendChild(row);
    };
    addRow("Cash", total); addRow("Transfer", 0);
    document.getElementById("spAddRow").addEventListener("click", ()=> addRow(methods[0], 0));
    updateRemaining();
    const close = (val)=>{ closeModal(); resolve(val); };
    document.getElementById("spCancel1").onclick = ()=>close(null);
    document.getElementById("spCancel2").onclick = ()=>close(null);
    document.getElementById("spConfirm").onclick = ()=>{
      const lines = [...rowsHost.children].map(r=>({ method:r.querySelector(".spMethod").value, amount:+r.querySelector(".spAmt").value||0 })).filter(l=>l.amount>0);
      if(!lines.length){ toast("Add at least one payment line","err"); return; }
      const sum = lines.reduce((a,l)=>a+l.amount,0);
      close({ lines, total: sum }); // more than the total due is allowed — checkout keeps the extra on the customer's account or gives change
    };
  });
}

------------------------------------------------------------------ */
/* Account summary block (store credit / debit snapshot taken at checkout). */
// Shared by the on-screen/print receipt and the PDF so both always show the same figures.
function accountSummaryRows(sale){
  if(!sale.customerId) return [];
  const rows = [];
  const add = (label, value, strong)=> rows.push({ label, value, strong:!!strong });
  const cb = +sale.creditBefore||0, pd = +sale.prevDebit||0, da = +sale.debitAfter||0, ca = +sale.creditApplied||0;
  const recv = +sale.amountReceived||0, chg = +sale.changeGiven||0, toD = +sale.excessToDebt||0, toC = +sale.excessToCredit||0;
  if(sale.creditAfter!=null){
    const ck = +sale.creditAfter||0;
    const saleDue = r2(Math.max(0, (+sale.total||0) - ca));
    if(cb>0.009) add("Store Credit Before Sale", money(cb));
    if(pd>0.009) add("Previous Debit", money(pd));
    add("This Sale", money(sale.total));
    if(ca>0.009) add("Store Credit Applied", "-"+money(ca));
    if(pd>0.009) add("Total Due (Sale + Previous Debit)", money(r2(saleDue+pd)), true);
    if(recv>0.009) add("Amount Received", money(recv));
    if(chg>0.009) add("Change Given", "-"+money(chg));
    if(toD>0.009) add("Extra Applied to Previous Debit", money(toD));
    if(toC>0.009) add("Extra Added to Store Credit", money(toC));
    rows.push({ rule:true });
    if(da>0.009) add("Overall Debit (Owing)", money(da), true);
    if(ck>0.009) add("Store Credit Balance", money(ck), true);
    if(da<=0.009 && ck<=0.009) add("Account Balance", "Cleared", true);
    return rows;
  }
  // receipts made before this feature keep their original layout
  if(!(cb>0.009 || pd>0.009 || da>0.009)) return [];
  if(cb>0.009) add("Store Credit Before Sale", money(cb));
  if(pd>0.009) add("Previous Debit", money(pd));
  if(da>0.009 || pd>0.009) add("Total Debit After Sale", money(da), true);
  return rows;
}
function accountSummaryHTML(sale){
  const rows = accountSummaryRows(sale);
  if(!rows.length) return "";
  return `<hr><div class="r-center" style="font-weight:700">Account Summary</div>` + rows.map(r=> r.rule ? `<hr>` :
    `<div class="r-row" style="${r.strong?"font-weight:700":""}"><span>${escapeHtml(r.label)}</span><span>${escapeHtml(r.value)}</span></div>`).join("");
}
/* Dated log of products collected against an advance payment. */
function advanceCollectionsHTML(sale){
  const list = sale.advanceCollections;
  if(!list || !list.length) return "";
  return `<hr><div class="r-center" style="font-weight:700">Collection History</div>
    <table><thead><tr><th>Date</th><th>Product</th><th style="text-align:right">Qty</th></tr></thead>
    <tbody>${list.map(e=>`<tr><td>${acctDay(e.date)}</td><td>${escapeHtml(e.productName)}</td><td style="text-align:right">${fmtQty(e.qty)} ${escapeHtml(e.unit||"")}</td></tr>`).join("")}</tbody></table>`;
}
function buildReceiptHTML(sale, layout){
  const s = state.settings;
  const itemsRows = sale.items.map(i=>{
    const product = state.products.find(p=>p.id===i.productId);
    const equiv = (product && i.unit!==product.stockUnit && i.qtyInStockUnit!=null)
      ? `<div style="font-size:9.5px;opacity:.75">= ${fmtQty(i.qtyInStockUnit)} ${escapeHtml(product.stockUnit)}</div>` : "";
    const returnedQty = returnedQtyFor(sale, i.productName, i.unit);
    const returnedNote = returnedQty>0.009 ? `<tr><td colspan="4" style="font-size:.85em;color:#b3261e;padding-top:0">↩ Returned ${fmtQty(returnedQty)} ${escapeHtml(i.unit)} — net kept ${fmtQty(i.qtySold-returnedQty)} ${escapeHtml(i.unit)}</td></tr>` : "";
    return `<tr><td>${escapeHtml(i.productName)}</td><td>${fmtQty(i.qtySold)} ${escapeHtml(i.unit)}${equiv}</td>
    <td style="text-align:right">${money(i.unitPrice)}</td><td style="text-align:right">${money(i.qtySold*i.unitPrice)}</td></tr>${returnedNote}`;
  }).join("");
  const balanceLine = sale.balance>0 ? `<div class="r-row"><b>BALANCE OWING</b><b>${money(sale.balance)}</b></div>` : "";
  const breakdownLines = sale.paymentBreakdown ? sale.paymentBreakdown.map(l=>
    `<div class="r-row"><span>&nbsp;&nbsp;${escapeHtml(l.method)}</span><span>${money(l.amount)}</span></div>`).join("") : "";
  // Store credit redeemed on this transaction (set at checkout when the
  // customer had credit available) and, separately, whatever store credit
  // they still have left after this transaction — shown whenever either is
  // non-zero so the customer always sees where they stand.
  const creditAppliedLine = sale.creditApplied>0.009 ? `<div class="r-row"><span>Store Credit Applied</span><span>-${money(sale.creditApplied)}</span></div>` : "";
  const storeCreditRemaining = sale.customerId ? customerStoreCredit(sale.customerId) : (sale.creditBalance||0);
  const storeCreditLine = (sale.creditAfter==null && storeCreditRemaining>0.009) ? `<div class="r-row" style="font-weight:600"><span>Store Credit Balance</span><span>${money(storeCreditRemaining)}</span></div>` : "";
  return `
  <div class="receipt ${layout}" id="receiptRoot">
    <div class="r-center"><b style="font-size:15px">${escapeHtml(s.name||"HARAMOS ENTERPRISE")}</b><br>${escapeHtml(s.phone||"")}<br>${escapeHtml(s.address||"")}</div>
    <hr>
    <div class="r-row"><span>Receipt#</span><span>${sale.receiptNumber}</span></div>
    <div class="r-row"><span>Date</span><span>${fmtDate(sale.createdAt)}</span></div>
    <div class="r-row"><span>Cashier</span><span>${escapeHtml(sale.cashierName)}</span></div>
    <div class="r-row"><span>Customer</span><span>${escapeHtml(sale.customerName||"Walk-in")}</span></div>
    <hr>
    <table><thead><tr><th>Item</th><th>Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Amt</th></tr></thead>
    <tbody>${itemsRows}</tbody></table>
    <div class="r-row" style="font-weight:600"><span>Total Pieces</span><span>${fmtQty(sale.items.reduce((a,i)=>a+(i.qtyInStockUnit!=null?i.qtyInStockUnit:i.qtySold),0))}</span></div>
    <hr>
    <div class="r-row"><span>Subtotal</span><span>${money(sale.subtotal)}</span></div>
    <div class="r-row"><span>Discount</span><span>-${money(sale.discount)}</span></div>
    <div class="r-row"><span>Tax</span><span>${money(sale.tax)}</span></div>
    <div class="r-row" style="font-weight:700;font-size:1.1em"><span>TOTAL</span><span>${money(sale.total)}</span></div>
    <div class="r-row"><span>Paid</span><span>${money(sale.amountPaid)}</span></div>
    ${creditAppliedLine}
    ${(!sale.customerId && sale.changeGiven>0.009) ? `<div class="r-row"><span>Amount Received</span><span>${money(sale.amountReceived)}</span></div><div class="r-row"><span>Change</span><span>${money(sale.changeGiven)}</span></div>` : ""}
    ${balanceLine}
    <div class="r-row"><span>Payment</span><span>${escapeHtml(sale.paymentMethod)}</span></div>
    ${breakdownLines}
    ${sale.history && sale.history.length ? `<hr><div class="r-center" style="font-weight:700">Payment History</div>${sale.history.map(h=>`<div class="r-row"><span>${fmtDate(h.date)}</span><span>${money(h.amount)}</span></div>`).join("")}` : ""}
    ${sale.advanceProducts && sale.advanceProducts.length ? `<hr><div class="r-center" style="font-weight:700">Collection Status</div>
    <table><thead><tr><th>Product</th><th style="text-align:right">Collected</th><th style="text-align:right">Remaining</th></tr></thead>
    <tbody>${sale.advanceProducts.map(p=>`<tr><td>${escapeHtml(p.productName)}</td><td style="text-align:right">${fmtQty(p.collected)} ${escapeHtml(p.unit)}</td><td style="text-align:right">${fmtQty(p.reserved-p.collected)} ${escapeHtml(p.unit)}</td></tr>`).join("")}</tbody></table>
    <div class="r-row"><span>Total Products Collected</span><span>${fmtQty(sale.advanceProducts.reduce((a,p)=>a+p.collected,0))}</span></div>
    <div class="r-row"><span>Total Products Remaining</span><span>${fmtQty(sale.advanceProducts.reduce((a,p)=>a+(p.reserved-p.collected),0))}</span></div>
    <div class="r-row" style="font-weight:600"><span>Value of Goods Collected</span><span>${money(sale.advanceProducts.reduce((a,p)=>a+p.collected*(p.unitPrice||0),0))}</span></div>
    <div class="r-row"><span>Value of Goods Remaining</span><span>${money(sale.advanceProducts.reduce((a,p)=>a+(p.reserved-p.collected)*(p.unitPrice||0),0))}</span></div>` : ""}
    ${returnsReceiptBlockHTML(sale)}
    ${advanceCollectionsHTML(sale)}
    ${accountSummaryHTML(sale)}
    ${storeCreditLine ? `<hr>${storeCreditLine}` : ""}
    <hr>
    <div class="r-center" id="rcBarcode"></div>
    <div class="r-center" id="rcQr" style="margin-top:6px"></div>
    <hr>

}

// jsPDF's built-in fonts only cover basic Latin: "₦" and accented letters (e.g. Yoruba ẹ, ọ, ṣ)
// would print as garbage, so text going into a PDF is normalised first.
function pdfSafeText(t){
  return String(t==null ? "" : t).replace(/₦/g,"NGN ").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\xFF]/g,"?");
}
function downloadReceiptPDF(sale){
  try{
    const { jsPDF } = window.jspdf;
    const s = state.settings;
    const L = 14, R = 213, CX = 113;
    const pm = n => acctPdfMoney(n), pt = pdfSafeText;
    // All drawing lives in one function so it can be run twice: once on a tall scratch
    // page to measure the exact height needed, then for real on a page of that height
    // (no more guessing the length, so long receipts are never cut off).
    const draw = (pdf)=>{
      let y = 26;
      const text = (txt, o={})=>{
        const { x=L, bold=false, size=9, center=false, color=[0,0,0], gap=11 } = o;
        pdf.setFont("courier", bold?"bold":"normal"); pdf.setFontSize(size); pdf.setTextColor(...color);
        const parts = center ? [pt(txt)] : pdf.splitTextToSize(pt(txt), R-x);
        parts.forEach(p=>{ pdf.text(p, center?CX:x, y, center?{align:"center"}:undefined); y+=gap; });
        pdf.setTextColor(0,0,0);
      };
      const row = (label, value, bold=false)=>{
        pdf.setFont("courier", bold?"bold":"normal"); pdf.setFontSize(9); pdf.setTextColor(0,0,0);
        // a long label would run into the amount — put the amount on its own line instead
        if(pt(label).length + pt(value).length > 33){ pdf.text(pt(label), L, y); y+=11; pdf.text(pt(value), R, y, {align:"right"}); y+=12; return; }
        pdf.text(pt(label), L, y); pdf.text(pt(value), R, y, {align:"right"}); y+=12;
      };
      text(s.name||"HARAMOS ENTERPRISE", { bold:true, size:12, center:true, gap:14 });
      if(s.phone) text(s.phone, { center:true, gap:11 });
      if(s.address) text(s.address, { center:true, gap:11 });
      y+=6;
      text(`Receipt# ${sale.receiptNumber}`, { gap:12 });
      text(`Date: ${fmtDate(sale.createdAt)}`, { gap:12 });
      text(`Cashier: ${sale.cashierName||""}`, { gap:12 });
      text(`Customer: ${sale.customerName||"Walk-in"}`, { gap:16 });
      sale.items.forEach(i=>{
        const product = state.products.find(p=>p.id===i.productId);
        text(`${i.productName} (${fmtQty(i.qtySold)} ${i.unit||""})`, { gap:11 });
        text(`  ${pm(i.unitPrice)} x ${fmtQty(i.qtySold)} = ${pm(i.unitPrice*i.qtySold)}`, { gap:13 });
        if(product && i.unit!==product.stockUnit && i.qtyInStockUnit!=null)
          text(`  = ${fmtQty(i.qtyInStockUnit)} ${product.stockUnit}`, { size:8, gap:11 });
        const returnedQty = returnedQtyFor(sale, i.productName, i.unit);
        if(returnedQty>0.009)
          text(`  Returned ${fmtQty(returnedQty)} ${i.unit} (net kept ${fmtQty(i.qtySold-returnedQty)})`, { size:8, color:[150,40,35], gap:11 });
      });
      y+=4;
      text(`Total Pieces: ${fmtQty(sale.items.reduce((a,i)=>a+(i.qtyInStockUnit!=null?i.qtyInStockUnit:i.qtySold),0))}`, { bold:true, gap:13 });
      y+=6;
      row("Subtotal", pm(sale.subtotal));
      row("Discount", "-"+pm(sale.discount||0));
      row("Tax", pm(sale.tax||0));
      row("TOTAL", pm(sale.total), true);
      row("Paid", pm(sale.amountPaid));
      if(sale.creditApplied>0.009) row("Store Credit Applied", "-"+pm(sale.creditApplied));
      row("Balance", pm(sale.balance||0));
      row("Payment", sale.paymentMethod||"");
      (sale.paymentBreakdown||[]).forEach(l=> row("  "+l.method, pm(l.amount)));
      if(!sale.customerId && sale.changeGiven>0.009){ row("Amount Received", pm(sale.amountReceived)); row("Change", pm(sale.changeGiven)); }
      if(sale.history && sale.history.length){
        y+=4; text("Payment History", { bold:true, gap:12 });
        sale.history.forEach(h=> row(acctDay(h.date), pm(h.amount)));
      }
      if(sale.advanceProducts && sale.advanceProducts.length){
        y+=6; text("Collection Status", { bold:true, gap:13 });
        sale.advanceProducts.forEach(p=>{
          text(`${p.productName}: collected ${fmtQty(p.collected)}/${fmtQty(p.reserved)} ${p.unit||""}`, { gap:11 });
          text(`  remaining ${fmtQty(p.reserved-p.collected)} ${p.unit||""}`, { gap:13 });
        });
        text(`Total Collected: ${fmtQty(sale.advanceProducts.reduce((a,p)=>a+p.collected,0))}`, { gap:12 });
        text(`Total Remaining: ${fmtQty(sale.advanceProducts.reduce((a,p)=>a+(p.reserved-p.collected),0))}`, { gap:12 });
      }
      y = drawReturnsPdfSection(pdf, sale, y);
      const collLog = sale.advanceCollections || [];
      if(collLog.length){
        y+=4; text("Collection History", { bold:true, gap:12 });
        collLog.forEach(e=>{ text(`${acctDay(e.date)} ${fmtQty(e.qty)} ${e.unit||""}`, { gap:11 }); text(`  ${e.productName}`, { gap:13 }); });
      }
      if(sale.customerId){
        const sumRows = accountSummaryRows(sale);
        if(sumRows.length){
          y+=4; text("Account Summary", { bold:true, gap:12 });
          sumRows.forEach(r=>{ if(r.rule){ y+=2; } else row(r.label, r.value, r.strong); });
        }
        const left = customerStoreCredit(sale.customerId);
        if(sale.creditAfter==null && left>0.009) row("Store Credit Balance", pm(left));
      }
      y+=10;
      text(s.footer||"Thank you for shopping with us!", { center:true, gap:12 });
      if(s.returnPolicy) text(s.returnPolicy, { size:8, center:true, gap:11 });
      return y;
    };
    const probe = new jsPDF({ unit:"pt", format:[227, 8000] });
    const endY = draw(probe);
    const pdf = new jsPDF({ unit:"pt", format:[227, Math.max(220, Math.ceil(endY)+24)] });
    draw(pdf);
    pdf.save(`${sale.receiptNumber}.pdf`);
  }catch(e){ console.error(e); toast("Could not generate PDF in this browser.","err"); }
}

/* ------------------------------------------------------------------
   18. RECEIPT HISTORY/* ------------------------------------------------------------------
   18. RECEIPT HISTORY
------------------------------------------------------------------ */
/* Build a receipt-ready "sale" object from a Credit/Debt record.
   If the debt is linked to an original Sales-screen transaction, reuse
   that sale's full item list (and just overlay the current running
   paid/balance + payment history). Otherwise — for debts added manually
   from the Credit & Advance tab — synthesize a one-line receipt. */
function buildDebtReceiptSale(d){
  const original = d.saleId && state.sales.find(s=>s.id===d.saleId);
  const base = original ? { ...original } : {
    receiptNumber: d.receiptNumber, createdAt: d.createdAt,
    cashierName: state.user?.name || "Store", customerName: d.customerName, customerId: d.customerId,
    items: [{ productName: d.notes ? `Credit / Debt — ${d.notes}` : "Credit / Debt balance", unit:"", qtySold:1, unitPrice:d.total, unitCost:0 }],
    subtotal: d.total, discount:0, taxPct:0, tax:0, total: d.total,
    paymentMethod:"Credit", paymentBreakdown:null
  };
  return Object.assign({}, base, { amountPaid:d.amountPaid, balance:d.balance, history:d.history||[] });
}
/* Same idea for Advance Payments. Falls back to listing the reserved
   products (with an even price split, since exact per-item pricing may
   not have been recorded) when there's no linked sale. */
function buildAdvanceReceiptSale(a){
  const original = a.saleId && state.sales.find(s=>s.id===a.saleId);
  if(original) return Object.assign({}, original, { amountPaid:a.amountPaid, balance:a.balance, advanceProducts:a.products||[], advanceCollections:a.collections||[], creditBalance:a.creditBalance||0 });
  // A deposit with no products: the receipt total is simply the amount deposited.
  const total = a.isDeposit ? a.amountPaid : (a.total!=null ? a.total : a.amountPaid);
  const qtyTotal = (a.products||[]).reduce((sum,p)=>sum+p.reserved,0) || 1;
  const items = (a.products && a.products.length) ? a.products.map(p=>({
    productName: p.productName + (p.collected>0 ? ` (collected ${fmtQty(p.collected)}/${fmtQty(p.reserved)} ${p.unit})` : ""),
    unit:p.unit, qtySold:p.reserved, unitPrice: +(total*(p.reserved/qtyTotal)/p.reserved || 0).toFixed(2), unitCost:0
  })) : [{ productName:"Advance payment", unit:"", qtySold:1, unitPrice:a.amountPaid, unitCost:0 }];
  return { receiptNumber:a.receiptNumber, createdAt:a.createdAt, cashierName: state.user?.name||"Store",
    customerName:a.customerName, customerId:a.customerId, items, subtotal:total, discount:0, taxPct:0, tax:0, total,
    amountPaid:a.amountPaid, balance:a.balance, paymentMethod:"Advance Payment", paymentBreakdown:null,
    advanceProducts: a.products||[], advanceCollections: a.collections||[], creditBalance:a.creditBalance||0 };
}
window.viewDebtReceipt = function(id){
  const d = state.debts.find(x=>x.id===id); if(!d) return;
  showReceiptModal(enrichSaleWithReturns(buildDebtReceiptSale(d)));
};
window.viewAdvanceReceipt = function(id){
  const a = state.advances.find(x=>x.id===id); if(!a) return;
  showReceiptModal(enrichSaleWithReturns(buildAdvanceReceiptSale(a)));
};
/* Given a plain sales-history record, look up whether it has a linked
   Advance Payment record and, if so, overlay that record's live
   amountPaid/balance/collection-progress onto the receipt — so the
   Sales History receipt always reflects the current collection state,
   not just a snapshot from the moment of the original transaction. */
/* ------------------------------------------------------------------
   19C. RETURNS ON THE RECEIPT

   WHY THIS EXISTS
   Processing a return (section 17/"Process Return") already restocks
   goods and settles the refund — but the original sale's receipt never
   showed that a return had happened. This section closes that gap by
   overlaying the CURRENT list of returns for a sale onto its receipt,
   using the exact same live-overlay pattern already established by
   enrichSaleWithDebt/enrichSaleWithAdvance: nothing about the original
   sale record is changed, the receipt just reads state.returns fresh
   every time it is built. That is also what makes it keep updating —
   every reprint (from Sales History, Receipt History, a debt receipt,
   or an advance receipt) re-reads state.returns at that moment, so a
   second or third return against the same sale shows up automatically
   the next time the receipt is opened, with no extra step required.

   ACCURACY
   The original Subtotal/Discount/Tax/Total/Paid/Balance lines are left
   completely untouched — they remain the exact historical record of
   the transaction as it happened. Everything here is additive: a
   returned-quantity note under the affected item line, and a dedicated
   RETURNS section with a running "Net Total (after returns)" figure.
   Every figure is sourced directly from the same `returns` records the
   existing Process Return flow already writes — refund totals are
   never recalculated or guessed, only summed and grouped by the refund
   method actually chosen at the time, so the receipt can never disagree
   with the Returns page or the Debtors/Customer-Accounts figures.
------------------------------------------------------------------ */
function saleReturnsFor(saleId){
  if(!saleId) return [];
  return state.returns.filter(r=>r.saleId===saleId).sort((a,b)=>a.createdAt-b.createdAt);
}
/* How much of one specific line item has been returned so far, summed
   across every return event on this sale — matches the same productName
   + unit key that the existing Process Return modal itself matches on
   (see alreadyReturnedQty), so the two can never disagree. */
function returnedQtyFor(sale, productName, unit){
  if(!sale.returnedByKey) return 0;
  return sale.returnedByKey[productName+"||"+unit] || 0;
}
/* Overlays the sale's returns onto a receipt-ready object. A no-op
   (returns the same object) when the sale has no id or no returns yet,
   so it is always safe to wrap any sale-like object with this. */
function enrichSaleWithReturns(sale){
  const returns = saleReturnsFor(sale.id);
  if(!returns.length) return sale;
  const returnedByKey = {};
  returns.forEach(r=> r.items.forEach(i=>{
    const k = i.productName+"||"+i.unit;
    returnedByKey[k] = +((returnedByKey[k]||0) + i.qty).toFixed(4);
  }));
  const sumBy = method => +returns.filter(r=>r.refundMethod===method).reduce((a,r)=>a+(r.totalRefund||0),0).toFixed(2);
  const totalReturnedValue = +returns.reduce((a,r)=>a+(r.totalRefund||0),0).toFixed(2);
  return Object.assign({}, sale, {
    returnsList: returns,
    returnedByKey,
    totalReturnedValue,
    netTotal: +((sale.total||0) - totalReturnedValue).toFixed(2),
    cashRefunded: sumBy("Cash"),
    creditIssued: sumBy("Store Credit"),
    appliedToBalance: sumBy("Reduce Balance")
  });
}
/* The RETURNS section of the on-screen / printed receipt (thermal and
   A4 share this — same markup, the surrounding .receipt.wA4/.w80/.w58
   class already handles the width/font differences). Renders to "" when
   there is nothing to show, so it is invisible on every receipt that has
   no returns. */
function returnsReceiptBlockHTML(sale){
  if(!sale.returnsList || !sale.returnsList.length) return "";
  const rows = sale.returnsList.map(r=>{
    const items = r.items.map(i=>`${fmtQty(i.qty)} ${escapeHtml(i.unit)} ${escapeHtml(i.productName)} (${money(i.refundAmount)})`).join(", ");
    return `<div class="r-row" style="align-items:flex-start;gap:10px">
      <span>${fmtDate(r.createdAt)}<div style="font-size:.86em;opacity:.85">${items}${r.reason?` — <i>${escapeHtml(r.reason)}</i>`:""}</div></span>
      <span style="white-space:nowrap;font-weight:600">-${money(r.totalRefund)}</span></div>`;
  }).join("");
  const line = (label,val) => val>0.009 ? `<div class="r-row"><span>${label}</span><span>-${money(val)}</span></div>` : "";
  return `<hr><div class="r-center" style="font-weight:700">RETURNS</div>
    ${rows}
    <div class="r-row" style="font-weight:600;border-top:1px dashed #999;margin-top:4px;padding-top:4px"><span>Total Returned</span><span>-${money(sale.totalReturnedValue)}</span></div>
    <div class="r-row" style="font-weight:700;font-size:1.05em"><span>NET TOTAL (after returns)</span><span>${money(sale.netTotal)}</span></div>
    ${line("Refunded to Customer (Cash)", sale.cashRefunded)}
    ${line("Store Credit Issued", sale.creditIssued)}
    ${line("Applied to Outstanding Balance", sale.appliedToBalance)}`;
}
/* Extra vertical space the PDF's fixed-height page needs to fit the
   RETURNS section, computed up front since jsPDF needs the page height
   before anything is drawn (mirrors how advanceProducts already does
   this via `extraHeight` in downloadReceiptPDF — same idea, new block). */
function returnsReceiptPdfHeight(sale){
  if(!sale.returnsList || !sale.returnsList.length) return 0;
  const itemLines = sale.returnsList.reduce((a,r)=>a + 1 + (r.reason?1:0), 0); // date+items line, +1 if a reason is shown
  return 40 + itemLines*13 + 60; // heading + per-return lines + summary lines
}
/* Draws the RETURNS section into an in-progress receipt PDF at the given
   y and returns the new y — called from downloadReceiptPDF right after
   the existing Collection Status block, before the footer. Restores the
   font/colour it started with so nothing after it is affected. */
function drawReturnsPdfSection(pdf, sale, y){
  if(!sale.returnsList || !sale.returnsList.length) return y;
  y += 6;
  pdf.setFont("courier","bold"); pdf.setFontSize(9); pdf.setTextColor(0,0,0);
  pdf.text("RETURNS", 113, y, {align:"center"}); y += 13;
  pdf.setFont("courier","normal");
  sale.returnsList.forEach(r=>{
    pdf.setTextColor(0,0,0);
    pdf.text(fmtDate(r.createdAt), 14, y); y += 11;
    pdf.setTextColor(150,40,35);
    const items = pdfSafeText(r.items.map(i=>`${fmtQty(i.qty)} ${i.unit} ${i.productName}`).join(", "));
    pdf.text(pdf.splitTextToSize(`  ${items}`, 199), 14, y); y += 11;
    pdf.setTextColor(0,0,0);
    pdf.text("Refund", 14, y); pdf.text(`-${acctPdfMoney(r.totalRefund)}`, 213, y, {align:"right"}); y += 12;
    if(r.reason){ pdf.setFontSize(8); pdf.text(pdf.splitTextToSize(pdfSafeText(`  Reason: ${r.reason}`),199), 14, y); y += 11; pdf.setFontSize(9); }
  });
  pdf.setFont("courier","bold");
  pdf.text("Total Returned", 14, y); pdf.text(`-${acctPdfMoney(sale.totalReturnedValue)}`, 213, y, {align:"right"}); y += 13;
  pdf.text("NET TOTAL", 14, y); pdf.text(acctPdfMoney(sale.netTotal), 213, y, {align:"right"}); y += 14;
  pdf.setFont("courier","normal");
  [["Refunded to Customer (Cash)", sale.cashRefunded], ["Store Credit Issued", sale.creditIssued], ["Applied to Outstanding Balance", sale.appliedToBalance]]
    .forEach(([lbl,val])=>{ if(val>0.009){ pdf.text(lbl, 14, y); pdf.text(`-${acctPdfMoney(val)}`, 213, y, {align:"right"}); y += 12; } });
  return y + 4;
}

function enrichSaleWithAdvance(sale){
  const adv = state.advances.find(a=>a.saleId===sale.id);
  if(!adv) return sale;
  return Object.assign({}, sale, { amountPaid:adv.amountPaid, balance:adv.balance,
    advanceProducts:adv.products||[], advanceCollections:adv.collections||[], collectionStatus:adv.collectionStatus, creditBalance:adv.creditBalance||0 });
}
/* Same idea for Credit/Debt sales — a sale paid on credit gets a linked
   `debts` record that keeps its own running amountPaid/balance/history as
   the customer pays it down over time. Overlay that live state onto the
   original sale so its Sales-History row/receipt always shows the current
   paid amount, balance and status instead of a stale snapshot from the
   moment of the original transaction. */
function enrichSaleWithDebt(sale){
  const debt = state.debts.find(d=>d.saleId===sale.id);
  if(!debt) return sale;
  return Object.assign({}, sale, { amountPaid:debt.amountPaid, balance:debt.balance,
    history:debt.history||[], debtId:debt.id,
    status: debt.writtenOff ? "Written Off" : (debt.balance<=0.009 ? "Paid" : (debt.amountPaid>0 ? "Partial/Owing" : "Owing")) });
}
/* Convenience wrapper: apply whichever overlay (debt or advance) applies
   to this sale — a given sale can only ever have one of the two linked. */
function enrichSale(sale){
  return enrichSaleWithReturns(enrichSaleWithDebt(enrichSaleWithAdvance(sale)));
}
/* "Collected: 2 Bag Giwa; 1 Carton Soap" — products already taken under an advance payment. */
function advCollectedSummaryHTML(adv){
  const got = (adv.products||[]).filter(p=>(p.collected||0)>0.009);
  if(!got.length) return "";
  return `<div class="rx-collected">📦 Collected: ${got.map(p=>`${fmtQty(p.collected)} ${escapeHtml(p.unit||"")} ${escapeHtml(p.productName)}`).join("; ")}</div>`;
}
function renderReceipts(){

  </div>`;
  setContent(html);
  const draw = ()=>{
    const q = document.getElementById("rxSearch").value.toLowerCase();
    const rows = [...state.sales].sort((a,b)=>b.createdAt-a.createdAt).filter(s=>{

      const collectionCell = adv

        : debt

        : `<span style="color:var(--ink-soft)">—</span>`;
      // Status pill: if this sale has a linked credit/debt record, always reflect its
      // live balance rather than the sale's original (one-time) status field, so the
      // moment a debt is paid down or cleared, Sales History updates automatically.
      const liveStatus = debt ? (debt.writtenOff ? "Written Off" : (debt.balance<=0.009 ? "Paid" : (debt.amountPaid>0 ? "Partial/Owing" : "Owing"))) : s.status;
      return `

      <td><span class="pill ${liveStatus==="Paid"?"pill-ok":liveStatus==="Written Off"?"pill-danger":"pill-warn"}">${liveStatus}</span></td>
      <td>${collectionCell}</td>
      <td>${fmtDate(s.createdAt)}</td>
      <td class="row-actions">
        <button class="icon-sm" title="View / Print" onclick="viewReceiptById('${s.id}')">👁️</button>
        <button class="icon-sm" title="Download PDF" onclick="downloadReceiptPDFById('${s.id}')">⬇️</button>
        <button class="icon-sm" title="Process Return" onclick="openProcessReturnModal('${s.id}')">↩️</button>
        ${adv?`<button class="icon-sm" title="Manage Collection" onclick="viewAdvance('${adv.id}')">📦</button>`:""}
        ${debt?`<button class="icon-sm" title="Record Payment" onclick="recordDebtPayment('${debt.id}')" ${debt.balance<=0.009?"disabled":""}>💳</button>`:""}
        ${can("deleteSales")?`<button class="icon-sm" title="Delete &amp; restore stock" onclick="deleteSale('${s.id}')">🗑️</button>`:""}
      </td></tr>`;};
    // Advance payments that have no sale behind them (deposits / manual advances) so they appear here too.
    const advOnly = state.advances.filter(a=> !a.saleId && /^ADV-/.test(a.receiptNumber||"") && (!q ||
      (a.receiptNumber||"").toLowerCase().includes(q) || (a.customerName||"").toLowerCase().includes(q) ||
      (a.products||[]).some(p=>p.productName.toLowerCase().includes(q))));
    const advRowHtml = a=>{
      const hasProd = (a.products||[]).length>0;
      return `<tr><td class="mono">${a.receiptNumber}</td><td>${escapeHtml(a.customerName||"")}</td><td>${escapeHtml(a.createdBy||"—")}</td>
      <td>${hasProd ? a.products.length : "Deposit"}</td><td>${money(hasProd ? a.total : a.amountPaid)}</td>
      <td><span class="pill pill-info">Advance</span></td>
      <td>${hasProd ? `<span class="pill ${a.collectionStatus==="Fully Collected"?"pill-ok":a.collectionStatus==="Partially Collected"?"pill-warn":"pill-info"}">${a.collectionStatus}</span>${advCollectedSummaryHTML(a)}` : `<span style="color:var(--ink-soft)">No products</span>`}</td>
      <td>${fmtDate(a.createdAt)}</td>
      <td class="row-actions"><button class="icon-sm" title="View / Print" onclick="viewAdvanceReceipt('${a.id}')">👁️</button>
        <button class="icon-sm" title="Manage Collection" onclick="viewAdvance('${a.id}')">📦</button></td></tr>`;
    };
    const merged = [ ...rows.map(s=>({ t:s.createdAt, html:saleRowHtml(s) })), ...advOnly.map(a=>({ t:a.createdAt, html:advRowHtml(a) })) ]
      .sort((x,y)=>y.t-x.t);
    document.getElementById("rxBody").innerHTML = merged.length ? merged.map(m=>m.html).join("")
      : `<tr><td colspan="9"><div class="empty-state"><div class="ic">🧾</div>No receipts found</div></td></tr>`;
  };
  document.getElementById("rxSearch").addEventListener("input", draw);
  draw();
}

// How much of a given line item on this sale has already been returned,
// across every prior return processed against it — so a second return
// can never let someone give back more than was actually sold.
function alreadyReturnedQty(saleId, productName, unit){
  return state.returns.filter(r=>r.saleId===saleId)
    .flatMap(r=>r.items)
    .filter(i=>i.productName===productName && i.unit===unit)
    .reduce((sum,i)=>sum+i.qty, 0);
}

window.openProcessReturnModal = function(saleId){
  const sale = state.sales.find(x=>x.id===saleId);
  if(!sale){ toast("Sale not found","err"); return; }
  const debt = state.debts.find(d=>d.saleId===saleId);
  const rows = sale.items.map((it,idx)=>{
    const already = alreadyReturnedQty(saleId, it.productName, it.unit);
    const remaining = Math.max(0, it.qtySold - already);
    return { ...it, idx, already, remaining };
  });
  const anyReturnable = rows.some(r=>r.remaining>0.009);
  openModal(`<div class="modal-head"><h3>Process Return — ${sale.receiptNumber}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">
    <p style="font-size:12.5px;color:var(--ink-soft)">${escapeHtml(sale.customerName||"Walk-in")} &middot; ${fmtDate(sale.createdAt)}</p>
    ${anyReturnable ? `
    <div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Product</th><th>Sold</th><th>Already Returned</th><th>Return Qty</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${escapeHtml(r.productName)}</td><td>${fmtQty(r.qtySold)} ${escapeHtml(r.unit)}</td><td>${fmtQty(r.already)}</td>
      <td><input type="number" class="retQty" data-idx="${r.idx}" min="0" max="${r.remaining}" step="0.01" value="0" style="width:80px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)" ${r.remaining<=0?"disabled":""}></td></tr>`).join("")}</tbody></table></div>
    <div class="field" style="margin-top:12px"><label>Reason (optional)</label><input id="retReason" placeholder="e.g. Damaged bag, wrong item"></div>
    <div class="cart-row total" style="margin-top:10px"><span>Total Refund</span><span id="retTotalDisplay">₦0.00</span></div>
    <div class="field" style="margin-top:10px"><label>Refund Method</label>
      <select id="retMethod">
        <option value="Cash">Cash / Tender (money handed back)</option>
        ${sale.customerId ? `<option value="Store Credit">Store Credit (for their next purchase)</option>` : ""}
        ${debt && debt.balance>0.009 ? `<option value="Reduce Balance">Reduce Outstanding Balance (${money(debt.balance)} owed)</option>` : ""}
      </select>
    </div>
    ` : `<p style="margin-top:14px;color:var(--ink-soft);font-size:13px">Everything on this sale has already been returned.</p>`}
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">Cancel</button>
  ${anyReturnable ? `<button class="btn btn-primary" id="retSave">Process Return</button>` : ""}</div>`, {lg:true});
  if(!anyReturnable) return;

  const updateTotal = ()=>{
    const total = [...document.querySelectorAll(".retQty")].reduce((sum,inp)=>{
      const r = rows[+inp.dataset.idx];
      return sum + Math.max(0, Math.min(r.remaining, +inp.value||0)) * r.unitPrice;
    }, 0);
    document.getElementById("retTotalDisplay").textContent = money(total);
  };
  document.querySelectorAll(".retQty").forEach(inp=> inp.addEventListener("input", updateTotal));
  updateTotal();

  document.getElementById("retSave").addEventListener("click", async ()=>{
    const returnedItems = [...document.querySelectorAll(".retQty")].map(inp=>{
      const r = rows[+inp.dataset.idx];
      const qty = Math.max(0, Math.min(r.remaining, +inp.value||0));
      return qty>0 ? { productId:r.productId||null, isCustom:!!r.isCustom, productName:r.productName, unit:r.unit, qty, unitPrice:r.unitPrice, refundAmount:+(qty*r.unitPrice).toFixed(2) } : null;
    }).filter(Boolean);
    if(!returnedItems.length){ toast("Enter a return quantity for at least one item","err"); return; }
    const totalRefund = +returnedItems.reduce((a,i)=>a+i.refundAmount,0).toFixed(2);
    const method = document.getElementById("retMethod").value;
    const reason = document.getElementById("retReason").value.trim();

    // Restock every returned item and log it, exactly like every other
    // stock movement in the app — a Return is just as auditable as a sale.
    for(const item of returnedItems){
      if(item.isCustom) continue; // a manually-typed "other item" was never in stock
      // match by product id (survives a rename); older records fall back to the name
      const product = (item.productId && state.products.find(p=>p.id===item.productId)) || state.products.find(p=>p.name===item.productName);
      if(!product) continue;
      const restore = stockDeductionFor(product, item.unit, item.qty);
      product.currentStock = +(product.currentStock + restore).toFixed(4);
      await dataSet("products", product);
      await dataSet("stockHistory", { id:genId("stk"), productId:product.id, productName:product.name,
        type:"Return", change:restore, reference:sale.receiptNumber, createdAt:Date.now(), by:state.user.name });
    }

    // Settle the refund according to the chosen method.
    if(method === "Store Credit"){
      const creditAdv = { id:genId("adv"), customerId:sale.customerId, customerName:sale.customerName,
        phone:"", saleId:null, receiptNumber:"RTN-"+Date.now().toString().slice(-8),
        amountPaid:totalRefund, total:0, balance:0, creditBalance:totalRefund, products:[],
        collectionStatus:"Fully Collected", notes:`Store credit from return on ${sale.receiptNumber}`, createdAt:Date.now() };
      await dataSet("advancePayments", creditAdv); state.advances.push(creditAdv);
      await syncAdvanceDebt(creditAdv);
    } else if(method === "Reduce Balance" && debt){
      const appliedToBalance = Math.min(totalRefund, debt.balance);
      const excess = +(totalRefund - appliedToBalance).toFixed(2);
      debt.balance = +(debt.balance - appliedToBalance).toFixed(2);
      debt.history = debt.history || [];
      debt.history.push({ amount:appliedToBalance, date:Date.now(), by:state.user.name, note:`Return credit — ${sale.receiptNumber}` });
      await dataSet("debts", debt);
      if(debt.saleId){
        const linkedSale = state.sales.find(x=>x.id===debt.saleId);
        if(linkedSale){
          linkedSale.balance = debt.balance;
          linkedSale.status = debt.balance<=0.009 ? "Paid" : "Partial/Owing";
          await dataSet("sales", linkedSale);
          await dataSet("receipts", { id:linkedSale.id, ...linkedSale });
          const rxIdx = state.receipts.findIndex(r=>r.id===linkedSale.id);
          if(rxIdx>-1) state.receipts[rxIdx] = { id:linkedSale.id, ...linkedSale };
        }
      }
      if(excess > 0.009){
        const creditAdv = { id:genId("adv"), customerId:sale.customerId, customerName:sale.customerName,
          phone:"", saleId:null, receiptNumber:"RTN-"+Date.now().toString().slice(-8),
          amountPaid:excess, total:0, balance:0, creditBalance:excess, products:[],
          collectionStatus:"Fully Collected", notes:`Store credit — return refund exceeded the balance owed on ${sale.receiptNumber}`, createdAt:Date.now() };
        await dataSet("advancePayments", creditAdv); state.advances.push(creditAdv);
        await syncAdvanceDebt(creditAdv);
      }
    } else {
      await dataSet("payments", { id:genId("pay"), type:"refund", saleId, receiptNumber:sale.receiptNumber,
        method:"Cash", amount:totalRefund, createdAt:Date.now(), by:state.user.name });
    }

    const returnRecord = { id:genId("rtn"), saleId, receiptNumber:sale.receiptNumber,
      customerId:sale.customerId||null, customerName:sale.customerName||"Walk-in",
      items:returnedItems, totalRefund, refundMethod:method, reason, createdAt:Date.now(), by:state.user.name };
    await dataSet("returns", returnRecord); state.returns.push(returnRecord);

    closeModal();
    toast(`Return processed — ${money(totalRefund)} refunded via ${method}`, "ok");
    renderReceipts();
  });
};
