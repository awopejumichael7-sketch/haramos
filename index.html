// Shows a supplier's running balance and full purchase/payment history, and
// lets staff record a new purchase (increases what's owed) or a payment
// (reduces it) — an auditable trail in place of the old free-typed number,
// mirroring the same principle already used for Credit & Advance.
window.viewSupplierLedger = function(id){
  const s = state.suppliers.find(x=>x.id===id);
  if(!s) return;
  const history = (s.history||[]).slice().sort((a,b)=>b.date-a.date);
  openModal(`<div class="modal-head"><h3>Ledger — ${escapeHtml(s.name)}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="card stat-card" style="margin-bottom:14px"><div class="lbl">Outstanding Balance</div><div class="val" style="font-size:20px">${money(s.balance||0)}</div></div>
    <div class="form-grid">
      <div class="field"><label>Record Purchase (increases balance)</label><input type="number" id="supPurchaseAmt" min="0" placeholder="Amount"></div>
      <div class="field"><label>Record Payment (reduces balance)</label><input type="number" id="supPaymentAmt" min="0" max="${s.balance||0}" placeholder="Amount"></div>
    </div>
    <div class="field"><label>Note (optional)</label><input id="supEntryNote" placeholder="e.g. Invoice #, delivery details"></div>
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-ghost btn-sm" id="supAddPurchase">+ Add Purchase</button>
      <button class="btn btn-primary btn-sm" id="supAddPayment">Record Payment</button>
    </div>
    <h4 style="font-size:13px;margin:16px 0 8px">History</h4>
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th><th>By</th></tr></thead>
    <tbody>${history.length? history.map(h=>`<tr><td>${fmtDate(h.date)}</td><td>${escapeHtml(h.type)}</td><td>${h.type==="Payment"?"-":""}${money(h.amount)}</td><td>${escapeHtml(h.note||"-")}</td><td>${escapeHtml(h.by||"-")}</td></tr>`).join("")
      : `<tr><td colspan="5"><div class="empty-state"><div class="ic">📒</div>No entries yet</div></td></tr>`}</tbody></table></div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">Close</button></div>`);
  document.getElementById("supAddPurchase").addEventListener("click", async ()=>{
    const amt = Math.max(0, +document.getElementById("supPurchaseAmt").value||0);
    if(amt<=0){ toast("Enter a purchase amount","err"); return; }
    const note = document.getElementById("supEntryNote").value.trim();
    s.balance = +(((s.balance||0) + amt).toFixed(2));
    s.history = s.history || [];
    s.history.push({ type:"Purchase", amount:amt, note, date:Date.now(), by:state.user.name });
    await dataSet("suppliers", s);
    const i = state.suppliers.findIndex(x=>x.id===s.id); if(i>=0) state.suppliers[i]=s;
    toast("Purchase recorded","ok"); viewSupplierLedger(id);
  });
  document.getElementById("supAddPayment").addEventListener("click", async ()=>{
    const amt = Math.min(s.balance||0, Math.max(0, +document.getElementById("supPaymentAmt").value||0));
    if(amt<=0){ toast("Enter a payment amount","err"); return; }
    const note = document.getElementById("supEntryNote").value.trim();
    s.balance = +(((s.balance||0) - amt).toFixed(2));
    s.history = s.history || [];
    s.history.push({ type:"Payment", amount:amt, note, date:Date.now(), by:state.user.name });
    await dataSet("suppliers", s);
    const i = state.suppliers.findIndex(x=>x.id===s.id); if(i>=0) state.suppliers[i]=s;
    await dataSet("payments", { id:genId("pay"), type:"supplierPayment", supplierId:s.id, amount:amt, createdAt:Date.now(), by:state.user.name });
    toast("Payment recorded","ok"); viewSupplierLedger(id);
  });
};

function renderReports(){
  const html = `<div class="card">

      <div class="toolbar">
        <input type="date" id="repFrom"><input type="date" id="repTo">
        <select id="repType"><option value="sales">Sales</option><option value="profit">Profit</option>
          <option value="expense">Expense</option><option value="inventory">Inventory</option>
          <option value="customer">Customer</option><option value="debtors">Debtors</option>
          <option value="advance">Advance Payments</option><option value="payments">Payments Ledger</option>
          <option value="salesrep">Sales Rep</option></select>
        <button class="btn btn-ghost btn-sm" id="runReport">Run</button>
        <button class="btn btn-gold btn-sm" id="exportReport">Export CSV</button>
        <button class="btn btn-ghost btn-sm" id="printReport">🖨️ Print</button>
      </div>
    </div>
    <div id="reportOut"></div>
  </div>`;
  setContent(html);
  const today = localDateStr();
  document.getElementById("repFrom").value = today; document.getElementById("repTo").value = today;
  document.getElementById("runReport").addEventListener("click", runReport);
  document.getElementById("exportReport").addEventListener("click", ()=>{
    const rows = window.__lastReportRows||[];
    exportCSV(rows, "report.csv");
  });
  document.getElementById("printReport").addEventListener("click", ()=>{
    const area=document.getElementById("printArea");
    area.innerHTML = `<div style="padding:20px">${document.getElementById("reportOut").innerHTML}</div>`;
    area.style.display="block"; setTimeout(()=>{window.print(); area.style.display="none";},200);
  });
  runReport();
}
function runReport(){
  const from = parseLocalDate(document.getElementById("repFrom").value, false) ?? 0;
  const to = parseLocalDate(document.getElementById("repTo").value, true) ?? Number.MAX_SAFE_INTEGER;
  const type = document.getElementById("repType").value;
  const inRange = s=> s.createdAt>=from && s.createdAt<=to;
  let rows = [], cols = [];
  if(type==="sales"){
    const data = state.sales.filter(inRange);
    cols=["Receipt","Customer","Cashier","Total","Method","Date"];
    rows = data.map(s=>({ Receipt:s.receiptNumber, Customer:s.customerName, Cashier:s.cashierName, Total:s.total, Method:s.paymentMethod, Date:fmtDate(s.createdAt) }));
  } else if(type==="profit"){
    const data = state.sales.filter(inRange);
    cols=["Receipt","Revenue","Cost","Profit"];
    rows = data.map(s=>{ const f=saleFinancials(s); return { Receipt:s.receiptNumber, Revenue:f.revenue, Cost:f.cost, Profit:f.profit }; });
  } else if(type==="expense"){
    const data = state.expenses.filter(inRange);
    cols=["Category","Amount","Notes","Date"];
    rows = data.map(e=>({ Category:e.category, Amount:e.amount, Notes:e.notes, Date:fmtDate(e.createdAt) }));
  } else if(type==="inventory"){
    cols=["Product","Category","Stock","Unit","Value"];
    rows = state.products.map(p=>({ Product:p.name, Category:p.category, Stock:p.currentStock, Unit:p.stockUnit, Value:p.currentStock*p.costPrice }));
  } else if(type==="customer"){
    cols=["Customer","Phone","Purchases","Total Spent"];
    rows = state.customers.map(c=>{ const s=state.sales.filter(x=>x.customerId===c.id); return { Customer:c.name, Phone:c.phone, Purchases:s.length, "Total Spent":s.reduce((a,x)=>a+x.total,0) }; });
  } else if(type==="debtors"){
    cols=["Customer","Phone","Receipt","Total","Paid","Balance","Due Date","Status"];
    rows = state.debts.filter(d=>d.balance>0 && inRange(d)).map(d=>({ Customer:d.customerName, Phone:d.phone, Receipt:d.receiptNumber,
      Total:d.total, Paid:d.amountPaid, Balance:d.balance, "Due Date": d.dueDate ? fmtDate(new Date(d.dueDate).getTime()).split(",")[0] : "—",
      Status: isDebtOverdue(d) ? "Overdue" : "Owing" }));
  } else if(type==="advance"){
    cols=["Customer","Receipt","Paid","Balance","Store Credit","Status"];
    rows = state.advances.filter(inRange).map(a=>({ Customer:a.customerName, Receipt:a.receiptNumber, Paid:a.amountPaid,
      Balance: a.total===null||a.total===undefined?"Unknown":a.balance, "Store Credit":a.creditBalance||0, Status:a.collectionStatus }));
  } else if(type==="payments"){
    const data = (state.payments||[]).filter(inRange);
    cols=["Type","Receipt","Method","Amount","By","Date"];
    rows = data.map(p=>({ Type:p.type, Receipt:p.receiptNumber||"—", Method:p.method||"—", Amount:p.amount, By:p.by||"—", Date:fmtDate(p.createdAt) }));
  } else if(type==="salesrep"){
    const data = state.sales.filter(inRange);
    const byRep = {};
    data.forEach(s=>{ byRep[s.cashierName]=byRep[s.cashierName]||{count:0,total:0}; byRep[s.cashierName].count++; byRep[s.cashierName].total+=s.total; });
    cols=["Sales Rep","Transactions","Total Sales"];
    rows = Object.entries(byRep).map(([k,v])=>({ "Sales Rep":k, Transactions:v.count, "Total Sales":v.total }));
  }
  window.__lastReportRows = rows;
  const out = document.getElementById("reportOut");
  if(!rows.length){ out.innerHTML = `<div class="empty-state"><div class="ic">📈</div>No data for this range</div>`; return; }
  out.innerHTML = `<div class="table-wrap" style="margin-top:14px"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${typeof r[c]==="number"?money(r[c]).replace(/^\D+/,'').length&&["Total","Amount","Balance","Profit","Revenue","Cost","Total Spent","Value","Total Sales","Paid","Store Credit"].includes(c)?money(r[c]):r[c]:escapeHtml(String(r[c]??""))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

    const dump = {};
    for(const c of COLLECTIONS) dump[c] = await idbGetAll(c);
    const blob = new Blob([JSON.stringify(dump,null,2)], {type:"application/json"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`haramos-backup-${Date.now()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  });
  document.getElementById("restoreFile").addEventListener("change",(e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      try{
        const dump = JSON.parse(reader.result);
        if(!dump || typeof dump!=="object" || Array.isArray(dump)) throw new Error("not a backup");
        let restored = 0;
        for(const c of COLLECTIONS){
          // staff logins and the pending-sync list are never restored from a file (old copies would undo password changes / resend stale writes)
          if(c==="users" || c==="syncQueue" || !Array.isArray(dump[c])) continue;
          for(const r of dump[c]){
            if(!r || !r.id) continue;
            await idbPut(c, r); restored++;
            // also queue it for the cloud — otherwise, once online, the app reads the cloud copy and the restored data never appears
            if(c!=="heldSales") await queueSync(c, "set", r);
          }
        }
        if(!restored) throw new Error("empty backup");
        await flushSyncQueue();
        toast("Backup restored. Reloading…","ok"); setTimeout(()=>location.reload(), 1200);
      }catch(err){ toast("Invalid backup file","err"); }
    };
    reader.readAsText(file);
  });
  });
}

// Admin-only: edit a staff member's name, role, or active status from the
// Manage Staff card in Settings. Writes straight to their existing cloud
// profile (users/{uid}) so the change applies everywhere immediately —
// see the note below for the one case this can't do yet.
window.openEditStaffModal = async function(username){
  const record = await effectiveStaffRecord(username);
  if(!record){ toast("Staff record not found","err"); return; }
  const canEdit = !!record.uid;
  openModal(`<div class="modal-head"><h3>Edit Staff — ${escapeHtml(record.username)}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">
    ${canEdit ? "" : `<p style="font-size:12.5px;background:var(--warn-light);color:var(--warn);border-radius:8px;padding:9px 12px;margin-bottom:12px">
      This account hasn't signed in yet, so there's no cloud profile for it to edit — the app can't reliably save a change for them until then. Ask them to log in once first, then edit their details here.</p>`}
    <div class="field"><label>Full Name</label><input id="esName" value="${escapeHtml(record.name)}" ${canEdit?"":"disabled"}></div>
    <div class="field"><label>Role</label><select id="esRole" ${canEdit?"":"disabled"}>
      <option value="admin" ${record.role==="admin"?"selected":""}>Admin</option>
      <option value="sales" ${record.role==="sales"?"selected":""}>Sales</option>
    </select></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);margin-top:10px">
      <span>Account Active</span><label class="switch"><input type="checkbox" id="esActive" ${record.active!==false?"checked":""} ${canEdit?"":"disabled"}><span class="slider"></span></label>
    </div>
    ${canEdit ? `
    <div class="section-head" style="margin-top:16px"><h3 style="font-size:13px">Reset Password</h3></div>
    <p style="font-size:11.5px;color:var(--ink-soft)">Sets a new password right away for offline sign-in. Making it work for their online sign-in too needs one more step, shown after you reset it.</p>
    <div class="field"><label>New Password</label><input type="password" id="esNewPass" autocomplete="new-password"></div>
    <div class="field"><label>Confirm New Password</label><input type="password" id="esConfirmPass" autocomplete="new-password"></div>
    <p id="esPassError" style="display:none;color:var(--danger);font-size:12px;margin-top:4px"></p>
    <button class="btn btn-ghost btn-sm" id="esResetPass" style="margin-top:6px">Reset Password</button>
    ` : ""}
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">${canEdit?"Cancel":"Close"}</button>
  ${canEdit?`<button class="btn btn-primary" id="esSave">Save</button>`:""}</div>`);
  if(!canEdit) return;
  document.getElementById("esSave").addEventListener("click", async ()=>{
    const name = document.getElementById("esName").value.trim();
    const role = document.getElementById("esRole").value;
    const active = document.getElementById("esActive").checked;
    if(!name){ toast("Name is required","err"); return; }
    if(state.user && record.username===state.user.username && (active===false || role!=="admin")){
      toast("You can't deactivate or demote your own account — ask another Admin.","err"); return;
    }
    const updated = { id:record.id, uid:record.uid, username:record.username, name, role, active, passwordHash:null, updatedAt:Date.now() };
    try{
      const cached = (await idbGetAll("users")).find(u=>u.username===username);
      const base = USERS.find(x=>x.username===username);
      updated.passwordHash = (cached && cached.passwordHash) || (base && base.passwordHash) || null;
    }catch(e){ console.warn("[Staff] Could not read cached password hash.", e); }
    try{
      const { doc, setDoc } = firestoreApi;
      await setDoc(doc(fbDb, "users", record.uid), updated);
    }catch(err){
      toast("Could not save — check your connection and Firestore rules for the users collection.","err");
      return;
    }
    try{ await idbPut("users", updated); }catch(e){ console.warn("[Staff] Could not cache locally.", e); }
    closeModal(); toast(active===false?"Account deactivated":"Staff record updated","ok"); renderSettings();
  });
  // Resetting a password only ever updates the profile's stored hash —
  // it deliberately never touches Firebase Auth itself, since that would
  // require capabilities (an Admin SDK / backend) this app doesn't have.
  // See the follow-up dialog below for exactly what that means in practice.
  document.getElementById("esResetPass").addEventListener("click", async ()=>{
    const newPass = document.getElementById("esNewPass").value;
    const confirmPass = document.getElementById("esConfirmPass").value;
    const errEl = document.getElementById("esPassError");
    errEl.style.display = "none";
    if(!newPass || newPass.length < 6){ errEl.textContent = "New password should be at least 6 characters."; errEl.style.display = "block"; return; }
    if(newPass !== confirmPass){ errEl.textContent = "Passwords don't match."; errEl.style.display = "block"; return; }
    const btn = document.getElementById("esResetPass");
    btn.disabled = true; btn.textContent = "Resetting…";
    const newHash = await sha256Hex(newPass);
    let updatedProfile;
    try{
      const cached = (await idbGetAll("users")).find(u=>u.username===username) || {};
      updatedProfile = { id:record.id, uid:record.uid, username:record.username,
        name: cached.name || record.name, role: cached.role || record.role,
        active: typeof cached.active === "boolean" ? cached.active : record.active,
        passwordHash: newHash, updatedAt: Date.now() };
      const { doc, setDoc } = firestoreApi;
      await setDoc(doc(fbDb, "users", record.uid), updatedProfile);
    }catch(err){
      btn.disabled = false; btn.textContent = "Reset Password";
      errEl.textContent = "Could not save — check your connection."; errEl.style.display = "block";
      return;
    }
    try{ await idbPut("users", updatedProfile); }catch(e){ console.warn("[Staff] Could not cache locally.", e); }
    closeModal();
    toast(`Password reset for ${record.name} — they can sign in offline right away.`, "ok");
    const email = usernameToAuthEmail(record.username);
    openModal(`<div class="modal-head"><h3>One More Step for Online Sign-In</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="font-size:13.5px">${escapeHtml(record.name)} can already sign in <b>offline</b> with the new password.</p>
      <p style="font-size:13.5px;margin-top:10px">To let them sign in <b>online</b> too, Firebase itself needs their old sign-in removed first — this app genuinely can't do that part automatically. In the Firebase Console:</p>
      <ol style="font-size:13.5px;padding-left:20px;margin-top:8px;color:var(--ink-soft)">
        <li>Go to <b>Authentication → Users</b></li>
        <li>Find <span class="mono">${escapeHtml(email)}</span></li>
        <li>Delete that entry</li>
      </ol>
      <p style="font-size:13.5px;margin-top:10px">Their very next online login will then create a fresh account automatically using the new password — no further steps needed after that.</p>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="window.__closeModal()">Got it</button></div>`);
  });
};


// Self-service password change, available to any signed-in role from the
// "My Account" card in Settings. See changeMyPassword() for why this
// requires an active internet connection.
function openChangePasswordModal(){
  openModal(`<div class="modal-head"><h3>Change My Password</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="field"><label>Current Password</label><input type="password" id="cpCurrent" autocomplete="current-password"></div>
    <div class="field"><label>New Password</label><input type="password" id="cpNew" autocomplete="new-password"></div>
    <div class="field"><label>Confirm New Password</label><input type="password" id="cpConfirm" autocomplete="new-password"></div>
    <p id="cpError" style="display:none;color:var(--danger);font-size:12.5px;margin-top:6px"></p>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">Cancel</button>
  <button class="btn btn-primary" id="cpSave">Update Password</button></div>`);
  const showErr = (msg)=>{ const el = document.getElementById("cpError"); el.textContent = msg; el.style.display = "block"; };
  document.getElementById("cpSave").addEventListener("click", async ()=>{
    const current = document.getElementById("cpCurrent").value;
    const next = document.getElementById("cpNew").value;
    const confirm = document.getElementById("cpConfirm").value;
    if(!current || !next){ showErr("Fill in both your current and new password."); return; }
    if(next.length < 6){ showErr("New password should be at least 6 characters."); return; }
    if(next !== confirm){ showErr("New password and confirmation don't match."); return; }
    const btn = document.getElementById("cpSave");
    btn.disabled = true; btn.textContent = "Updating…";
    const result = await changeMyPassword(current, next);
    btn.disabled = false; btn.textContent = "Update Password";
    if(result.ok){ closeModal(); toast("Password updated","ok"); return; }
    if(result.reason === "wrong_current") showErr("Your current password is incorrect.");
    else if(result.reason === "unavailable") showErr("You need to be online and signed in via the cloud to change your password.");
    else showErr("Something went wrong — please try again.");
  });
}

</script>
<script>
// Register service worker so the app can be installed and used offline.
// This is additive only — it does not read, write, or interfere with any app data.
// Note: browsers (Chrome included) require the service worker script to be
// fetched from a real same-origin URL — a Blob URL is rejected outright.
// So this points to a real file, sw.js, that sits next to index.html.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
