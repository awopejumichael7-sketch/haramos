<style>
/* ============================================================
   HARAMOS ENTERPRISE POS — DESIGN TOKENS
   ============================================================ */
:root{
  --brand:#0F7B55;        /* deep palm green — grocery/produce */
  --brand-dark:#0B5C40;
  --brand-light:#E4F3EC;
  --gold:#E3A008;         /* naira / receipt accent */
  --gold-light:#FCF0D4;
  --ink:#1B2420;
  --ink-soft:#5B6B63;
  --bg:#F6F4EE;
  --card:#FFFFFF;
  --line:#E7E2D6;
  --danger:#C0392B;
  --danger-light:#FBE7E4;
  --warn:#B9770E;
  --warn-light:#FCF3E3;
  --ok:#1E8449;
  --ok-light:#E6F5EB;
  --info:#1F6FB2;
  --info-light:#E7F1FA;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(27,36,32,.04), 0 6px 20px rgba(27,36,32,.06);
  --font-display:'Poppins',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'Roboto Mono',monospace;
}
[data-theme="dark"]{
  --brand:#22B573; --brand-dark:#1A9A61; --brand-light:#0F2A20;
  --ink:#EDEFEC; --ink-soft:#A7B3AC;
  --bg:#0F1512; --card:#161E19; --line:#26312B;
  --gold-light:#2B2412; --danger-light:#301715; --warn-light:#2E2410; --ok-light:#0F2A20; --info-light:#101F2C;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--ink);}
button,input,select,textarea{font-family:inherit;font-size:14px;}
button{cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
.mono{font-family:var(--font-mono);}
.hidden{display:none !important;}
a{color:inherit;}

/* ---------- App shell ---------- */
#app{height:100%;}
.screen{height:100%;}

/* ---------- Login ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 20%, var(--brand-light), var(--bg) 55%);padding:20px;}
.login-card{width:100%;max-width:380px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  padding:36px 32px 28px;border:1px solid var(--line);}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center;}
.login-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));
  display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:24px;
  box-shadow:0 8px 20px rgba(15,123,85,.35);}
.login-brand h1{font-size:20px;}
.login-brand span{color:var(--ink-soft);font-size:13px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;transition:transform .08s, box-shadow .15s, background .15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:hover{background:var(--brand-dark);}
.btn-block{width:100%;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-gold{background:var(--gold);color:#3a2a00;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.login-demo{margin-top:18px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:11.5px;color:var(--ink-soft);line-height:1.6;}
.login-err{background:var(--danger-light);color:var(--danger);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none;}

/* ---------- Layout ---------- */
#mainScreen{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:230px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line);}
.sidebar-brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-dark));
  color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;}
.sidebar-brand div h2{font-size:14.5px;}
.sidebar-brand div span{font-size:11px;color:var(--ink-soft);}
.nav{flex:1;overflow-y:auto;padding:10px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink-soft);
  font-size:13.5px;font-weight:500;margin-bottom:2px;cursor:pointer;user-select:none;}
.nav-item:hover{background:var(--brand-light);color:var(--brand-dark);}
.nav-item.active{background:var(--brand);color:#fff;}
.nav-item .ic{width:18px;text-align:center;}
.nav-section{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);opacity:.6;
  padding:14px 12px 6px;}
.sidebar-foot{padding:12px;border-top:1px solid var(--line);}
.user-chip{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;background:var(--bg);}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#3a2a00;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:13px;}
.user-chip div{flex:1;min-width:0;}
.user-chip .name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-chip .role{font-size:10.5px;color:var(--ink-soft);text-transform:capitalize;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  border-bottom:1px solid var(--line);background:var(--card);}
.topbar h1{font-size:17px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.status-pill{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:20px;}
.status-online{background:var(--ok-light);color:var(--ok);}
.status-offline{background:var(--danger-light);color:var(--danger);}
.status-syncing{background:var(--warn-light);color:var(--warn);}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;}
.icon-btn:hover{background:var(--brand-light);}
.badge-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--card);}
.content{flex:1;overflow-y:auto;padding:22px;}

/* ---------- Cards / grids ---------- */
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1200px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:760px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.stat-card{display:flex;flex-direction:column;gap:6px;}
.stat-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.stat-card .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.stat-card .val{font-family:var(--font-display);font-size:23px;font-weight:700;}
.stat-card .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:500;}
.stat-card .trend{font-size:11px;font-weight:600;}
.trend-up{color:var(--ok);}
.trend-down{color:var(--danger);}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.section-head h3{font-size:15.5px;}
.section-head p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);
  padding:10px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.pill-ok{background:var(--ok-light);color:var(--ok);}
.pill-warn{background:var(--warn-light);color:var(--warn);}
.pill-danger{background:var(--danger-light);color:var(--danger);}
.pill-info{background:var(--info-light);color:var(--info);}
.pill-gold{background:var(--gold-light);color:var(--warn);}
.row-actions{display:flex;gap:6px;}
.icon-sm{width:29px;height:29px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:inline-flex;
  align-items:center;justify-content:center;font-size:13px;}
.icon-sm:hover{background:var(--brand-light);}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;
  padding:9px 13px;min-width:230px;}
.searchbox input{border:none;background:transparent;flex:1;outline:none;color:var(--ink);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:36px;margin-bottom:10px;}

/* ---------- Sales screen ---------- */
.pos-layout{display:grid;grid-template-columns:1fr 380px;gap:16px;height:100%;}
@media (max-width:1050px){.pos-layout{grid-template-columns:1fr;}}
.pos-catalog{display:flex;flex-direction:column;min-height:0;height:100%;}
.pos-toolbar{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;flex-shrink:0;}
.pos-toolbar-row2{display:flex;gap:8px;}
.pos-search{width:100%;}
.pos-catselect{flex:1;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-width:0;}
.pos-heldbtn{flex-shrink:0;white-space:nowrap;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;overflow-y:auto;padding-bottom:8px;}
.product-tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;
  transition:.12s;text-align:left;display:flex;flex-direction:column;gap:6px;}
.product-tile:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow);}
.product-tile:active{transform:scale(.97);}
.product-tile .cat{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.product-tile .nm{font-size:13px;font-weight:600;line-height:1.3;}
.product-tile .pr{font-size:13.5px;color:var(--brand-dark);font-weight:700;}
.product-tile .st{font-size:10.5px;color:var(--ink-soft);}
.product-tile.low{border-color:var(--warn);}
.product-tile.out{opacity:.5;cursor:not-allowed;}
.tile-units{display:flex;flex-direction:column;gap:2px;margin-top:2px;padding-top:6px;border-top:1px dashed var(--line);}
.tile-unit-row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:10.5px;padding:2px 4px;border-radius:6px;}
.tile-unit-row:hover{background:var(--bg);}
.tile-unit-name{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile-unit-name b{color:var(--ink);font-weight:600;}
.tile-unit-name i{font-style:normal;color:var(--ink-soft);opacity:.75;}
.tile-unit-price{font-weight:700;color:var(--brand-dark);white-space:nowrap;}
.cart-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;
  box-shadow:var(--shadow);overflow:hidden;min-height:0;}
.cart-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.cart-scroll{flex:1;overflow-y:auto;min-height:0;}
.cust-picker-wrap{padding:10px 14px 0;}
.cart-items{padding:8px 12px;min-height:60px;}
.cart-line{padding:10px 4px;border-bottom:1px solid var(--line);}
.cart-line-top{display:flex;justify-content:space-between;gap:8px;}
.cart-line-nm{font-size:13px;font-weight:600;}
.cart-line-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.cart-line-equiv{font-size:10.5px;color:var(--brand-dark);font-weight:600;margin-top:1px;}
.qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
.qty-ctrl button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg);flex-shrink:0;}
.qty-ctrl input{width:48px;text-align:center;padding:5px 2px;border-radius:6px;border:1px solid var(--line);flex-shrink:0;}
.qty-ctrl select{padding:5px 6px;border-radius:6px;border:1px solid var(--line);font-size:11.5px;min-width:0;}
.cart-summary{padding:10px 16px 4px;background:var(--bg);border-top:1px solid var(--line);}
.cart-num-input{width:90px;max-width:36vw;text-align:right;padding:5px 8px;border-radius:6px;border:1px solid var(--line);}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:4px 0;color:var(--ink-soft);flex-wrap:wrap;}
.cart-row.total{font-size:17px;font-weight:700;color:var(--ink);padding-top:8px;border-top:1px dashed var(--line);margin-top:4px;}
.cart-notes{width:100%;margin:8px 0 10px;border-radius:8px;border:1px solid var(--line);padding:8px;resize:vertical;min-height:36px;background:var(--card);color:var(--ink);}
.cart-actions{border-top:1px solid var(--line);padding:12px 16px;background:var(--card);display:flex;gap:8px;flex-shrink:0;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));}
.pay-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);opacity:.75;margin:12px 0 6px;font-weight:700;}
.paymethods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 4px;}
.paymethods-special{grid-template-columns:repeat(2,1fr);}
.paymethods label{border:1.5px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:11px;
  cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.25;
  background:var(--card);transition:.12s;}
.paymethods label:active{transform:scale(.96);}
.paymethods .pm-ic{font-size:15px;}
.paymethods .pm-lbl{word-break:break-word;}
.paymethods input{position:absolute;opacity:0;}
.paymethods input:checked + .pm-ic + .pm-lbl,
.paymethods input:checked ~ .pm-lbl{color:var(--brand-dark);font-weight:700;}
.paymethods label:has(input:checked){border-color:var(--brand);background:var(--brand-light);}
.pay-detail-box{background:var(--brand-light);border:1px solid var(--brand);border-radius:10px;padding:10px 12px;margin:8px 0;}
.pay-detail-note{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 6px;}
.pay-detail-box .cart-row{color:var(--ink);}
.pay-detail-box .cart-row.total{border-top-color:var(--brand);}
.pay-detail-box input[type="number"]{width:110px;max-width:38vw;text-align:right;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);}

/* ---------- Modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,20,17,.5);display:flex;align-items:center;justify-content:center;
  z-index:200;padding:20px;backdrop-filter:blur(2px);}
.modal{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal.modal-lg{max-width:820px;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-body{padding:20px 22px;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.close-x{width:30px;height:30px;border-radius:8px;border:none;background:var(--bg);font-size:16px;}

/* ---------- Toasts ---------- */
#toastHost{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;min-width:230px;animation:slideIn .25s ease;}
.toast.ok{background:var(--ok);}
.toast.err{background:var(--danger);}
.toast.warn{background:var(--warn);}
@keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ---------- Receipt ---------- */
.receipt{background:#fff;color:#111;font-family:var(--font-mono);width:300px;margin:0 auto;padding:16px;font-size:12px;line-height:1.5;}
.receipt.w80{width:300px;}
.receipt.w58{width:220px;font-size:11px;}
.receipt.wA4{width:100%;max-width:700px;font-family:var(--font-body);font-size:13px;}
.receipt hr{border:none;border-top:1px dashed #999;margin:8px 0;}
.receipt .r-center{text-align:center;}
.receipt .r-row{display:flex;justify-content:space-between;gap:8px;}
.receipt table{width:100%;font-size:inherit;}
.receipt th,.receipt td{padding:3px 2px;border:none;}
.receipt-badge{display:inline-block;padding:2px 8px;border:1px solid #111;border-radius:4px;font-size:10px;margin-top:4px;}

/* Loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--line) 25%,var(--bg) 37%,var(--line) 63%);background-size:400% 100%;
  animation:sk 1.4s ease infinite;border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
#bootScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;z-index:9999;}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid var(--brand-light);border-top-color:var(--brand);
  animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Toggle switch */
.switch{position:relative;display:inline-block;width:42px;height:24px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--line);border-radius:24px;transition:.2s;cursor:pointer;}
.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
input:checked + .slider{background:var(--brand);}
input:checked + .slider:before{transform:translateX(18px);}

.needs-price{outline:2px dashed var(--warn);outline-offset:-2px;}

/* ============================================================
   MOBILE RESPONSIVE LAYER
   ============================================================ */
.menu-btn{display:none;}
.sidebar-overlay{display:none;}
.mobile-cart-bar{display:none;}

@media (max-width: 900px){
  #mainScreen{position:relative;}
  .sidebar{
    position:fixed; top:0; bottom:0; left:0; z-index:260; width:250px;
    transform:translateX(-104%); transition:transform .22s ease; box-shadow:0 0 0 rgba(0,0,0,0);
  }
  .sidebar.open{ transform:translateX(0); box-shadow:10px 0 30px rgba(0,0,0,.18); }
  .sidebar-overlay{
    display:none; position:fixed; inset:0; background:rgba(15,20,17,.45); z-index:250;
  }
  .sidebar-overlay.show{ display:block; }
  .menu-btn{
    display:flex; align-items:center; justify-content:center; width:38px;height:38px;border-radius:10px;
    border:1px solid var(--line); background:var(--card); font-size:18px; flex-shrink:0;
  }
  .topbar{ padding:0 12px; gap:8px; }
  .topbar h1{ font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .status-pill span:not(.dot){ display:none; }
  .status-pill{ padding:7px; }
  .content{ padding:12px; padding-bottom:90px; }
  .grid-4, .grid-3, .grid-2{ grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat-card .val{ font-size:18px; }
  .stat-card .ic{ width:32px;height:32px;font-size:14px; }
  .card{ padding:14px; border-radius:12px; }
  table{ font-size:12px; }
  th, td{ padding:9px 8px; }
  .searchbox{ min-width:0; width:100%; }
  .toolbar{ width:100%; }
  .toolbar > *{ flex:1 1 auto; }
  .section-head{ align-items:flex-start; }

  /* Sales screen -> mobile cart drawer pattern */
  .pos-layout{ display:block; }
  .pos-catalog{ height:auto; }
  .pos-toolbar-row2{ gap:6px; }
  .pos-heldbtn{ font-size:11.5px; padding:9px 10px; }
  .product-grid{ flex:none; overflow:visible; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:8px; padding-bottom:8px; }
  .product-tile{ padding:9px; }
  .product-tile .nm{ font-size:12px; }
  .cart-panel{
    position:fixed; inset:0; z-index:270; border-radius:0; transform:translateY(100%);
    transition:transform .25s ease; display:flex;
  }
  .cart-panel.open{ transform:translateY(0); }
  .mobile-cart-bar.show{
    display:flex; position:fixed; left:10px; right:10px; bottom:12px; z-index:220;
    background:var(--brand); color:#fff; border-radius:14px; padding:12px 16px; align-items:center;
    justify-content:space-between; box-shadow:0 10px 30px rgba(0,0,0,.25); gap:10px;
  }
  .mobile-cart-bar b{ font-family:var(--font-display); }
  .mobile-cart-bar button{ background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:9px; padding:9px 14px; font-weight:700; }
  .cart-close-mobile{ display:inline-flex !important; }
  .paymethods{ grid-template-columns:repeat(2,1fr); }
  .paymethods label{ font-size:11.5px; padding:9px 5px; }
  .cart-actions{ padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  .cart-actions .btn{ padding:13px 14px; font-size:14.5px; }

  /* Bottom-sheet modals */
  .overlay{ padding:0; align-items:flex-end; }
  .modal{ max-width:100% !important; width:100%; max-height:94vh; border-radius:18px 18px 0 0; }
  .modal-body{ padding:16px; }
  .form-grid{ grid-template-columns:1fr; }

  /* Bigger touch targets */
  .icon-btn, .icon-sm{ width:40px; height:40px; }
  .btn{ padding:12px 16px; }
  .nav-item{ padding:13px 12px; }

  .login-card{ padding:28px 22px 22px; }
}
.cart-close-mobile{ display:none; }
@media (max-width:900px){
  .row-actions{ flex-wrap:wrap; }
}
@media (max-width: 420px){
  .grid-4, .grid-3, .grid-2{ grid-template-columns:1fr 1fr; }
  .product-grid{ grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); }
  .paymethods-special{ grid-template-columns:1fr; }
  .paymethods-special label{ flex-direction:row; justify-content:center; font-size:12px; padding:9px 8px; }
  .pay-detail-box .cart-row{ justify-content:space-between; }
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
@media (max-width:600px){.form-grid{grid-template-columns:1fr;}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
.tab-btn{padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);border:none;background:none;
  border-bottom:2px solid transparent;}
.tab-btn.active{color:var(--brand-dark);border-color:var(--brand);}

@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;}
}

<style id="customerAccountStyles">

.stmt-due{display:flex;justify-content:space-between;align-items:center;border:2px solid #111;border-radius:8px;padding:10px 14px;margin:12px 0;font-family:var(--font-display);}
.stmt-due .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.stmt-due .v{font-size:19px;font-weight:800;}
.stmt-note{font-size:11px;color:#555;margin:8px 0;}
.stmt-sign{display:flex;gap:44px;margin-top:44px;}

@media (max-width:640px){ .stmt{padding:16px 14px;} .stmt-sum{grid-template-columns:repeat(2,1fr);} .stmt-head{flex-direction:column;} .stmt-meta{text-align:left;} }

.acct-range{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 12px;}

.acct-callout.ok{background:var(--ok-light);border-color:var(--ok);}

<body>

<div id="bootScreen">
  <div class="boot-logo" role="img" aria-label="HARAMOS ENTERPRISE logo"></div>
  <div class="spinner"></div>
  <div style="font-family:var(--font-display);font-weight:700;color:var(--brand-dark)">HARAMOS ENTERPRISE</div>
  <div style="font-size:12.5px;color:var(--ink-soft)" id="bootMsg">Starting point of sale…</div>
</div>

<div id="app" class="hidden">

  <!-- ================= LOGIN ================= -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo" role="img" aria-label="HARAMOS ENTERPRISE logo"></div>
        <h1>HARAMOS ENTERPRISE</h1>
        <span>08060004726 &middot; Point of Sale</span>
      </div>
      <div class="login-err" id="loginErr"></div>
      <form id="loginForm">
        <div class="field">
          <label>Username</label>
          <input type="text" id="loginUser" autocomplete="username" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="loginPass" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign In</button>
      </form>
    </div>
  </div>

  <!-- ================= MAIN APP ================= -->
  <div id="mainScreen" class="hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="mark" role="img" aria-label="HARAMOS ENTERPRISE logo"></div>
        <div>
          <h2>HARAMOS ENTERPRISE</h2>
          <span>08060004726</span>
        </div>
      </div>
      <nav class="nav" id="navList"></nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <div class="av" id="userAvatar">A</div>
          <div>
            <div class="name" id="userName">Admin</div>
            <div class="role" id="userRole">admin</div>
          </div>
          <button class="icon-sm" title="Log out" id="logoutBtn">⏻</button>
        </div>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="menu-btn" id="menuBtn" title="Menu">☰</button>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-right">
          <span class="status-pill status-online" id="connPill"><span class="dot"></span><span id="connLabel">Online</span></span>
          <button class="icon-btn" id="notifBtn" title="Notifications">🔔<span class="badge-dot hidden" id="notifDot"></span></button>
          <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
        </div>
      </div>
      <div class="content" id="pageContent"></div>
    </div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
</div>

<div id="toastHost"></div>
<div id="modalHost"></div>
<div id="printArea" style="display:none;"></div>

<!-- QR / Barcode / PDF / Charts (client-side rendering libraries, loaded from CDN in the user's browser) -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script type="module">
/* ============================================================
   HARAMOS ENTERPRISE — POS ENGINE
   Vanilla JS ES2023 · Firebase v11 Modular SDK · IndexedDB cache
   ============================================================ */

/* ============================================================
   REBRANDING / RESELLING THIS APP TO A NEW CUSTOMER — READ FIRST
   ============================================================
   The Settings page inside the app (Store Name, Phone, Address, Receipt
   Footer, Return Policy, Currency, Tax %) already updates every printed
   receipt and PDF automatically — you don't need to touch any code for
   those. Everything below is what Settings CANNOT reach, because it's
   static text baked into this file. Do all of this BEFORE handing a copy
   of this file to a new customer:

   1. FIREBASE PROJECT (below, ~10 lines down)
      Create a brand-new Firebase project for the new customer and paste
      its own apiKey / authDomain / projectId / storageBucket /
      messagingSenderId / appId into the firebaseConfig object. This is
      what actually separates their data (products, sales, customers,
      debts, advances) from yours — a different projectId means a
      completely different, isolated database.

   2. STAFF LOGINS — see the USERS array further down (search for
      "const USERS ="). This is a plain list of real usernames and
      passwords baked directly into the file. It will NOT regenerate
      itself for a new customer — replace every entry with THEIR chosen
      staff accounts before handoff, or the old accounts (including
      yours) will still work on their copy, and will even get silently
      recreated in their new Firebase project the first time anyone logs
      in with them.

   3. VISIBLE APP NAME — plain text in the HTML <head> and body, not
      reachable from Settings. Search this file for "HARAMOS ENTERPRISE"
      and replace every occurrence — currently found in:
        - the <title> tag
        - the apple-mobile-web-app-title meta tag
        - the "Add to Home Screen" install name (a small JSON manifest
          embedded a little further up as a data: URL — search for
          "HARAMOS ENTERPRISE POS" inside it)
        - three header/login-screen headings in the HTML body
        - the STORE constant just below (its values are only the
          starting defaults for a brand-new database — the ones shown
          in Settings until someone changes them there)

   4. HOSTING — deploy the new customer to their OWN separate URL
      (their own repo / domain), not by reusing your existing one.
      The offline local cache (IndexedDB) is tied to the website
      address, not to the Firebase project, so reusing one URL for
      different customers over time risks an old cached browser mixing
      stale local data into the new customer's cloud database.

   Not required, but for the curious: a few internal-only identifiers

------------------------------------------------------------------ */
const COLLECTIONS = ["products","sales","customers","suppliers","users","stockHistory",
  "payments","receipts","settings","expenses","categories","debts","advancePayments",
  "returns","heldSales","syncQueue"];
const DB_NAME = "aduragbemi_pos_db";
const DB_VERSION = 1;
let idb = null;

function openIDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      COLLECTIONS.forEach(name=>{
        if(!db.objectStoreNames.contains(name)){
          db.createObjectStore(name, { keyPath: "id" });
        }
      });
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = (e)=> reject(e.target.error);
  });
}
function idbTx(store, mode){ return idb.transaction(store, mode).objectStore(store); }
function idbGetAll(store){
  return new Promise((res,rej)=>{
    const r = idbTx(store,"readonly").getAll();
    r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);
  });
}
function idbGet(store,id){
  return new Promise((res,rej)=>{
    const r = idbTx(store,"readonly").get(id);
    r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error);
  });
}
function idbPut(store,obj){
  return new Promise((res,rej)=>{
    const r = idbTx(store,"readwrite").put(obj);
    r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error);
  });
}
function idbDelete(store,id){
  return new Promise((res,rej)=>{
    const r = idbTx(store,"readwrite").delete(id);
    r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error);
  });
}

/* ------------------------------------------------------------------
   3. UNIVERSAL DATA LAYER
   Every write lands in IndexedDB immediately (so the POS never blocks
   on network), then is mirrored to Firestore when available. If
   offline or Firestore fails, the write is queued and flushed once
   connectivity + credentials are available.
------------------------------------------------------------------ */
async function dataGetAll(collection){
  if(FIREBASE_READY && navigator.onLine){
    try{
      const { collection: col, getDocs } = firestoreApi;
      const snap = await getDocs(col(fbDb, collection));
      let rows = []; snap.forEach(d=>rows.push(d.data()));
      // Writes that have not reached the cloud yet (made offline, or while a request failed)
      // wait in syncQueue. Layer them over the cloud copy so a refresh can never make a
      // just-saved record disappear (or be overwritten by an older cloud version).
      const pending = (await idbGetAll("syncQueue").catch(()=>[])).filter(q=>q.collection===collection)
        .sort((a,b)=>(a.queuedAt||0)-(b.queuedAt||0));
      if(pending.length){
        const byId = new Map(rows.map(r=>[r.id, r]));
        for(const q of pending){ if(q.op==="set") byId.set(q.obj.id, q.obj); else byId.delete(q.obj.id); }
        rows = [...byId.values()];
      }
      for(const r of rows) await idbPut(collection, r); // refresh cache
      // Drop cached rows that no longer exist in the cloud (deleted from another device),
      // otherwise they would keep reappearing whenever the app is used offline.
      if(collection!=="users" && collection!=="settings"){
        const keep = new Set(rows.map(r=>r.id));
        for(const old of await idbGetAll(collection)) if(!keep.has(old.id)) await idbDelete(collection, old.id);
      }
      return rows;
    }catch(e){ console.warn("Firestore read failed, using cache", e); }
  }
  return idbGetAll(collection);
}
// The payments ledger is read straight from state by Reports — keep it live as rows are saved/removed.
function syncPaymentsState(obj){
  if(!state || !Array.isArray(state.payments)) return;
  const i = state.payments.findIndex(p=>p.id===obj.id);
  if(i>=0) state.payments[i] = obj; else state.payments.push(obj);
}
async function dataSet(collection, obj){
  if(!obj.id) obj.id = genId(collection);
  obj.updatedAt = Date.now();
  await idbPut(collection, obj);
  if(collection==="payments") syncPaymentsState(obj);
  if(FIREBASE_READY && navigator.onLine){
    try{
      const { doc, setDoc } = firestoreApi;
      await setDoc(doc(fbDb, collection, obj.id), obj);
      return obj;
    }catch(e){ console.warn("Firestore write failed, queueing", e); }
  }
  await queueSync(collection, "set", obj);
  return obj;
}
async function dataDelete(collection, id){
  await idbDelete(collection, id);
  if(collection==="payments" && state && Array.isArray(state.payments)) state.payments = state.payments.filter(p=>p.id!==id);
  if(FIREBASE_READY && navigator.onLine){
    try{
      const { doc, deleteDoc } = firestoreApi;
      await deleteDoc(doc(fbDb, collection, id));
      return true;
    }catch(e){ console.warn("Firestore delete failed, queueing", e); }
  }
  await queueSync(collection, "delete", { id });
  return true;
}
async function queueSync(collection, op, obj){
  await idbPut("syncQueue", { id: genId("syncQueue"), collection, op, obj, queuedAt: Date.now() });
  updateConnPill();
}
async function flushSyncQueue(){
  if(!FIREBASE_READY || !navigator.onLine) return;
  const queue = await idbGetAll("syncQueue");
  if(!queue.length) return;
  setConn("syncing");
  const { doc, setDoc, deleteDoc } = firestoreApi;
  for(const item of queue){
    try{
      if(item.op === "set") await setDoc(doc(fbDb, item.collection, item.obj.id), item.obj);
      else if(item.op === "delete") await deleteDoc(doc(fbDb, item.collection, item.obj.id));
      await idbDelete("syncQueue", item.id);
    }catch(e){
      // A single stuck/invalid item must never stop every other queued item
      // from syncing — log it, count the attempt, and move on to the next
      // item instead of aborting the whole batch (previously: `break`).
      const retries = (item.retries || 0) + 1;
      console.warn(`Sync item failed (attempt ${retries}), will retry later —`, item.collection, item.op, e);
      try{ await idbPut("syncQueue", { ...item, retries, lastError: (e && e.message) || String(e) }); }catch(_){}
    }
  }
  updateConnPill();
}
function genId(prefix){ return prefix.slice(0,3) + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

(async function boot(){

    idb = await openIDB();

    // Confirm (or rule out) a persisted Firebase Auth session BEFORE the
    // first Firestore reads/writes below. Firestore rules check
    // request.auth, so without this, seedIfEmpty()/reloadAll() would ask
    // Firestore for data while Firebase still thinks no one is signed in —
    // producing a "Missing or insufficient permissions" error on every load
    // even though the user is really logged in. waitForFirebaseUser()
    // resolves almost instantly (it's reading Firebase's own local
    // persistence, same-device), so this adds no perceptible delay; if
    // there's no session yet (login screen), it resolves right away too.
    if (FIREBASE_AUTH_READY) {
      setBootMsg("Restoring session…");
      await waitForFirebaseUser();

    setBootMsg("Checking product catalogue…");

    await restoreSession();
    wireGlobalEvents();

    setInterval(flushSyncQueue, 20000);

async function seedIfEmpty(){
  // Pull settings from the cloud first: on a new/cleared device the local copy is empty, and
  // writing the built-in defaults over the real store name/phone/footer would be a data loss.
  try{ await dataGetAll("settings"); }catch(e){ console.warn("[Seed check] Could not read settings.", e); }
  const settingsArr = await idbGetAll("settings");
  const seededFlag = settingsArr.find(s=>s.id==="app_flags");
  let existingProducts = await idbGetAll("products");

  // The local cache can look empty even when the cloud catalogue isn't —
  // e.g. after clearing browser storage, or on a brand-new device. Before
  // treating that as "first run" and seeding a fresh catalogue, check
  // Firestore itself when it's reachable, so a cleared/new local cache can
  // never cause the seed catalogue to be duplicated in the cloud.
  if(existingProducts.length === 0 && !(seededFlag && seededFlag.productsSeeded) && FIREBASE_READY && navigator.onLine){
    try{
      const { collection: col, getDocs, query, limit } = firestoreApi;
      const snap = await getDocs(query(col(fbDb, "products"), limit(1)));
      if(!snap.empty){
        // Firestore already has products — this is just a cleared/new
        // local cache, not a genuinely new install. Skip seeding; the
        // normal reloadAll() right after this will pull the real
        // catalogue down from Firestore as usual.
        await dataSet("settings", Object.assign({ id:"app_flags", productsSeeded:true }));
        existingProducts = [{ id:"__cloud_has_products__" }]; // skip the seed block below
      }
    }catch(e){
      console.warn("[Seed check] Could not verify Firestore before seeding, proceeding with local check only.", e);
    }
  }

  if(existingProducts.length === 0 && !(seededFlag && seededFlag.productsSeeded)){
    for(const p of SEED_PRODUCTS) await dataSet("products", p);
    await dataSet("settings", Object.assign({ id:"app_flags", productsSeeded:true }));
  }
  const storeSettings = await idbGet("settings", "store_info");
  if(!storeSettings) await dataSet("settings", Object.assign({ id:"store_info" }, STORE));
}

/* ------------------------------------------------------------------
   8. AUTH
   Login is now verified against Firebase Authentication (email/password)
   whenever the device is online and Firebase Auth is enabled on the
   project. Since staff sign in with a short username rather than an
   email, each username is mapped to a stable pseudo-email under a
   fixed, non-routable domain — this is only ever used as an Auth
   identifier, never for sending mail.

   First login per staff member: if Firebase has no account yet for
   that username, and the username/password matches this device's
   local staff list, a real Firebase Auth account is created for them
   automatically (self-service migration — no manual Firebase Console
   work required). From that moment on, Firebase is the source of
   truth for that account's password and every login is server-verified.

   Offline resilience is preserved: if the device has no network, or
   Firebase Auth cannot be reached, login falls back to the local
   staff list below so the till never gets blocked by a dead connection.
------------------------------------------------------------------ */
const AUTH_EMAIL_DOMAIN = "excellence-store-pos.local"; // not a real mailbox — Auth identifier only
function usernameToAuthEmail(username){
  const clean = String(username||"").trim().toLowerCase().replace(/[^a-z0-9._-]/g,"");
  return `${clean}@${AUTH_EMAIL_DOMAIN}`;
}

// One-way SHA-256 hash (hex string) using the browser's built-in Web
// Crypto API. Used so a typed password can be checked against the local
// USERS list below without that list ever needing to contain the actual
// password in readable form — only its hash is stored.
async function sha256Hex(text){
  const bytes = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

// Look up (or create, on first login) this user's profile document in
// Firestore at users/{uid}. This document — not the local USERS array —
// is what Firestore Security Rules check to authorise reads/writes.
async function fetchOrProvisionUserProfile(fbUser, username, localMatch){
  const { doc, getDoc, setDoc } = firestoreApi;
  const ref = doc(fbDb, "users", fbUser.uid);
  try{
    const snap = await getDoc(ref);
    if(snap.exists()){
      const data = snap.data();
      const profile = { id: data.id, uid: fbUser.uid, username: data.username, name: data.name, role: data.role, passwordHash: data.passwordHash,
        active: data.active !== false }; // keep the Admin's "deactivated" switch — dropping it let deactivated staff log in
      idbPut("users", profile).catch(e=>console.warn("[Auth] Could not cache user profile locally.", e));
      return profile;
    }
  }catch(e){
    console.warn("[Firebase Auth] Could not read user profile, using local record.", e);
    return localMatch ? { ...localMatch, uid: fbUser.uid } : null;
  }
  // No profile yet for this Firebase account — create one from the local record.
  const base = localMatch || USERS.find(x=>x.username===username);
  if(!base) return null;
  const profile = { id: base.id, uid: fbUser.uid, username: base.username, name: base.name, role: base.role, active: true, updatedAt: Date.now() };
  try{ await setDoc(ref, profile); }catch(e){ console.warn("[Firebase Auth] Could not save user profile to Firestore.", e); }
  idbPut("users", profile).catch(e=>console.warn("[Auth] Could not cache user profile locally.", e));
  return profile;
}

// The password hash actually in effect for a username right now: if that
// person has ever used "Change My Password" (see changeMyPassword below),
// their profile is cached locally with an updated hash and that takes
// priority; otherwise this falls back to the original hash baked into the
// USERS list. Checked here, in one place, so every login path — online,
// offline, and first-time provisioning — always agrees on the same answer.
async function effectivePasswordHash(username){
  try{
    const cached = (await idbGetAll("users")).find(u=>u.username===username);
    if(cached && cached.passwordHash) return cached.passwordHash;
  }catch(e){ console.warn("[Auth] Could not read cached user profile.", e); }
  const base = USERS.find(x=>x.username===username);
  return base ? base.passwordHash : null;
}

// The full effective record for a username: an Admin edit made from the
// Manage Staff screen (name, role, active/deactivated) takes priority over
// the original USERS default, exactly like effectivePasswordHash above
// does for the password. Returns null for a completely unknown username.
async function effectiveStaffRecord(username){
  const base = USERS.find(x=>x.username===username);
  let cached = null;
  try{ cached = (await idbGetAll("users")).find(u=>u.username===username); }
  catch(e){ console.warn("[Auth] Could not read cached user profile.", e); }
  if(!base && !cached) return null;
  return {
    id: (cached && cached.id) || (base && base.id),
    username,
    name: (cached && cached.name) || (base && base.name),
    role: (cached && cached.role) || (base && base.role),
    uid: cached && cached.uid || null,
    active: cached && typeof cached.active === "boolean" ? cached.active : true,
  };
}

// Attempts a real Firebase Auth sign-in. Returns:
//   { ok:true,  profile }                     — signed in and verified
//   { ok:false, reason:"invalid" }             — wrong username/password (reject, do not fall back)
//   { ok:false, reason:"unavailable"|"error" } — offline / Auth not configured (caller should fall back locally)
// Final gate every successful credential check passes through before a
// login is actually accepted: rejects an account an Admin has deactivated
// from the Manage Staff screen, even though the password itself was
// correct. Kept in this one place so both the direct-sign-in path and the
// first-time-provisioning path above always agree.
async function finalizeLogin(profile){
  if(!profile) return { ok:false, reason:"error" };
  if(profile.active === false) return { ok:false, reason:"deactivated" };
  const record = await effectiveStaffRecord(profile.username);
  if(record && record.active === false) return { ok:false, reason:"deactivated" };
  return { ok:true, profile };
}

async function firebaseSignIn(username, password){
  if(!FIREBASE_READY || !FIREBASE_AUTH_READY || !navigator.onLine || !firebaseAuthApi){
    return { ok:false, reason:"unavailable" };
  }
  const { signInWithEmailAndPassword, createUserWithEmailAndPassword } = firebaseAuthApi;
  const email = usernameToAuthEmail(username);
  try{
    const cred = await signInWithEmailAndPassword(fbAuth, email, password);
    const profile = await fetchOrProvisionUserProfile(cred.user, username, USERS.find(x=>x.username===username));
    return await finalizeLogin(profile);
  }catch(err){
    // Newer Firebase projects return the same "auth/invalid-credential" code
    // for both "no such account" and "wrong password" (an anti-enumeration
    // protection), so we can no longer trust the sign-in error code alone to
    // tell first-time logins apart from mistyped passwords. Older projects
    // may still send "auth/user-not-found" — handle both the same way.
    const ambiguousOrNotFound = err && (err.code === "auth/user-not-found" || err.code === "auth/invalid-credential");
    if(ambiguousOrNotFound){
      const typedHash = await sha256Hex(password);
      const expectedHash = await effectivePasswordHash(username);
      const localMatch = expectedHash && expectedHash === typedHash ? USERS.find(x=>x.username===username) : null;
      if(!localMatch) return { ok:false, reason:"invalid" };
      try{
        // Attempting creation is now how we disambiguate: if the account
        // truly doesn't exist yet, this succeeds (first-time provisioning,
        // same as before). If it already exists, Firebase itself will tell
        // us via "auth/email-already-in-use" — meaning the real problem was
        // a wrong password, not a missing account.
        const cred = await createUserWithEmailAndPassword(fbAuth, email, password);
        const profile = await fetchOrProvisionUserProfile(cred.user, username, localMatch);
        return await finalizeLogin(profile);
      }catch(provisionErr){
        if(provisionErr && provisionErr.code === "auth/email-already-in-use"){
          return { ok:false, reason:"invalid" };
        }
        console.warn("[Firebase Auth] Could not provision account for", username, provisionErr);
        return { ok:false, reason:"error" };
      }
    }
    if(err && err.code === "auth/wrong-password"){
      return { ok:false, reason:"invalid" };
    }
    console.warn("[Firebase Auth] Sign-in error, falling back to offline check.", err);
    return { ok:false, reason:"error" };
  }
}

// Lets the currently signed-in user change their own password. Requires
// an active Firebase session (not the offline/local fallback) because
// only Firebase itself can securely verify the current password and
// update the real credential — see the explanation this feature was
// built from. On success, both the real Firebase Auth password AND the
// cached local hash (used for offline login) are updated together, so
// they never fall out of sync with each other.
async function changeMyPassword(currentPassword, newPassword){
  if(!FIREBASE_READY || !FIREBASE_AUTH_READY || !navigator.onLine || !fbAuth || !fbAuth.currentUser){
    return { ok:false, reason:"unavailable" };
  }
  if(!state.user || !state.user.uid){
    return { ok:false, reason:"unavailable" };
  }
  const { EmailAuthProvider, reauthenticateWithCredential, updatePassword } = firebaseAuthApi;
  const email = usernameToAuthEmail(state.user.username);
  try{
    // Re-checks the current password against Firebase itself (the only
    // trustworthy place to verify it) and refreshes the session so the
    // sensitive change below is allowed to proceed.
    const credential = EmailAuthProvider.credential(email, currentPassword);
    await reauthenticateWithCredential(fbAuth.currentUser, credential);
  }catch(err){
    return { ok:false, reason:"wrong_current" };
  }
  try{
    await updatePassword(fbAuth.currentUser, newPassword);
  }catch(err){
    console.warn("[Auth] Could not update Firebase password.", err);
    return { ok:false, reason:"error" };
  }
  const newHash = await sha256Hex(newPassword);
  const { doc, setDoc } = firestoreApi;
  const updatedProfile = { id:state.user.id, uid:state.user.uid, username:state.user.username, name:state.user.name, role:state.user.role, passwordHash:newHash, updatedAt:Date.now() };
  try{
    await setDoc(doc(fbDb, "users", state.user.uid), updatedProfile);
  }catch(err){
    console.warn("[Auth] Password changed, but could not save the updated profile to Firestore — it will still work on this device.", err);
  }
  try{ await idbPut("users", updatedProfile); }catch(e){ console.warn("[Auth] Could not cache updated profile locally.", e); }
  return { ok:true };
}

document.getElementById("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type="submit"]');
  const u = document.getElementById("loginUser").value.trim().toLowerCase();
  const p = document.getElementById("loginPass").value;
  const errEl = document.getElementById("loginErr");
  errEl.style.display = "none";
  if(submitBtn) submitBtn.disabled = true;
  try{
    const result = await firebaseSignIn(u, p);
    if(result.ok){
      sessionStorage.setItem("pos_session", JSON.stringify({ userId: result.profile.id, uid: result.profile.uid, source:"firebase", at: Date.now() }));
      // The first data load at start-up happens BEFORE sign-in (Firestore rules need a signed-in user),
      // so on a fresh device it can come back empty. Reload now that the user is authenticated.
      try{ await reloadAll(); }catch(err){ console.warn("Post-login data refresh failed", err); }
      enterApp(result.profile);
      return;
    }
    if(result.reason === "invalid"){
      errEl.style.display="block"; errEl.textContent = "Invalid username or password.";
      return;
    }
    if(result.reason === "deactivated"){
      errEl.style.display="block"; errEl.textContent = "This account has been deactivated. Contact your Admin.";
      return;
    }
    // Firebase Auth unreachable/not configured — offline fallback so the till stays usable.
    const typedHash = await sha256Hex(p);
    const expectedHash = await effectivePasswordHash(u);
    if(!expectedHash || expectedHash !== typedHash){
      errEl.style.display="block"; errEl.textContent = "Invalid username or password."; return;
    }
    const record = await effectiveStaffRecord(u);
    if(!record){ errEl.style.display="block"; errEl.textContent = "Invalid username or password."; return; }
    if(record.active === false){
      errEl.style.display="block"; errEl.textContent = "This account has been deactivated. Contact your Admin."; return;
    }
    sessionStorage.setItem("pos_session", JSON.stringify({ userId: record.id, source:"local", at: Date.now() }));
    enterApp(record);
  } finally {
    if(submitBtn) submitBtn.disabled = false;
  }
});

// Waits (briefly) for Firebase Auth to report its persisted session on
// this device. Firebase restores this from its own local storage, so it
// resolves near-instantly even offline; the timeout is just a safety net.
function waitForFirebaseUser(){
  return new Promise(resolve=>{
    if(!FIREBASE_AUTH_READY || !fbAuth || !firebaseAuthApi){ resolve(null); return; }
    const { onAuthStateChanged } = firebaseAuthApi;
    let settled = false;
    const unsub = onAuthStateChanged(fbAuth, (user)=>{ if(settled) return; settled = true; unsub(); resolve(user); });
    setTimeout(()=>{ if(settled) return; settled = true; resolve(fbAuth.currentUser || null); }, 2500);
  });
}

async function restoreSession(){
  const raw = sessionStorage.getItem("pos_session");
  if(!raw) return;
  let parsed;
  try{ parsed = JSON.parse(raw); }catch(e){ return; }
  const { userId, uid, source } = parsed;
  if(source === "firebase"){
    const fbUser = await waitForFirebaseUser();
    if(fbUser && fbUser.uid === uid){
      const profile = await fetchOrProvisionUserProfile(fbUser, null, USERS.find(x=>x.id===userId));
      if(profile){
        const record = await effectiveStaffRecord(profile.username);
        if(record && record.active === false){ sessionStorage.removeItem("pos_session"); return; }
        enterApp(profile);
        return;
      }
    }
    // Could not verify the Firebase session (e.g. signed out, or first run
    // offline before Firebase ever confirmed it) — fall back to local record
    // so a cached staff member isn't locked out of an already-open device.
  }
  const base = USERS.find(x=>x.id===userId);
  if(!base) return;
  const record = await effectiveStaffRecord(base.username);
  if(!record || record.active === false){ sessionStorage.removeItem("pos_session"); return; }
  enterApp(record);
}

function enterApp(user){

}

// A Sales role account may only open these five pages — everything else
// (Dashboard, Products, Inventory, Categories, Suppliers, Reports,
// Settings) is Admin-only. Receipt History is included, but deleting a
// receipt from it still requires the separate "deleteSales" permission
// (see the delete button + deleteSale() below and firestore.rules), so a
// Sales rep can view/print/reprint receipts but never remove one.
const SALES_REP_PAGES = ["sales","receipts","credit","customers","expenses"];
const DEFAULT_PAGE_FOR_ROLE = { admin:"dashboard", sales:"sales" };

function canAccessPage(id){
  if(!state.user) return false;
  if(state.user.role === "sales") return SALES_REP_PAGES.includes(id);
  return true; // admin (and any future non-restricted role) keeps full access
}

function renderNav(){
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  NAV.forEach(group=>{
    const items = group.items.filter(it=> canAccessPage(it.id) && (!it.perm || can(it.perm) || state.user.role==="admin"));
    if(!items.length) return;
    const h = document.createElement("div"); h.className="nav-section"; h.textContent=group.section; nav.appendChild(h);
    items.forEach(it=>{
      const d = document.createElement("div");
      d.className = "nav-item" + (state.page===it.id?" active":"");
      d.innerHTML = `<span class="ic">${it.ic}</span><span>${it.label}</span>`;
      d.onclick = ()=>{ goPage(it.id); if(window.__closeMobileSidebar) window.__closeMobileSidebar(); };
      nav.appendChild(d);
    });
  });
}
function goPage(id){
  // Defense-in-depth: even if something outside the sidebar (a stale link,
  // a restored page state, or the browser console) tries to open a page a
  // Sales rep isn't allowed on, send them back to their own Sales Screen
  // instead of rendering it.
  if(!canAccessPage(id)){
    toast("You don't have access to that page.", "err");
    id = DEFAULT_PAGE_FOR_ROLE[state.user.role] || "sales";
  }
  state.page = id;
  document.getElementById("pageTitle").textContent = (NAV.flatMap(g=>g.items).find(i=>i.id===id)||{}).label || "Dashboard";
  renderNav();
  const renderers = { dashboard:renderDashboard, sales:renderSales, receipts:renderReceipts, returns:renderReturnsPage, credit:renderCredit,
    products:renderProducts, inventory:renderInventory, categories:renderCategories, customers:renderCustomers,
    suppliers:renderSuppliers, expenses:renderExpenses, reports:renderReports, settings:renderSettings };
  (renderers[id] || renderDashboard)();
}

// Safety net against double-taps: a Save / Record / Confirm button in a dialog footer ignores a
// second click for 1.5 seconds, so a slow save can never be submitted twice.
document.addEventListener("click", (e)=>{
  const b = e.target && e.target.closest ? e.target.closest("#modalHost .modal-foot .btn-primary, #modalHost .modal-foot .btn-gold") : null;
  if(!b) return;
  const now = Date.now();
  if(b.__lastClickAt && now - b.__lastClickAt < 1500){ e.stopImmediatePropagation(); e.preventDefault(); return; }
  b.__lastClickAt = now;
}, true);

// A debt is "overdue" once its due date has passed and it still has a
// balance owing. This is the only place this check happens — kept as a
// single helper so the notification dot, the panel, and the Debtors table
// can never disagree with each other.
function isDebtOverdue(d){ return !!(d && d.dueDate && (d.balance||0) > 0.009 && new Date(d.dueDate).getTime() < Date.now()); }
async function checkNotifications(){
  const lowStock = state.products.filter(p=> unitStockInPieces(p) <= (p.minStock||0) );
  const overdueDebts = state.debts.filter(isDebtOverdue);
  const dot = document.getElementById("notifDot");
  const hasAlerts = lowStock.length>0 || overdueDebts.length>0;
  dot.classList.toggle("hidden", !hasAlerts);
}
function unitStockInPieces(p){ return p.currentStock; }
function showNotificationsPanel(){
  const lowStock = state.products.filter(p=> p.currentStock <= (p.minStock||0));
  const outStock = state.products.filter(p=> p.currentStock <= 0);
  const debts = state.debts.filter(d=> d.balance > 0);
  const overdueDebts = debts.filter(isDebtOverdue);
  const pendingAdv = state.advances.filter(a=> a.collectionStatus !== "Fully Collected");
  let html = `<div class="modal-head"><h3>Notifications</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">`;
  const section = (title,rows,render)=> rows.length ? `<h4 style="font-size:13px;margin:14px 0 8px">${title} (${rows.length})</h4>` +
    rows.slice(0,6).map(render).join("") : "";
  html += section("⚠️ Low Stock", lowStock, p=>`<div class="cart-line-sub">${escapeHtml(p.name)} — ${fmtQty(p.currentStock)} ${escapeHtml(p.stockUnit)} left</div>`);
  html += section("⛔ Out of Stock", outStock, p=>`<div class="cart-line-sub">${escapeHtml(p.name)}</div>`);
  html += section("⏰ Overdue Debts", overdueDebts, d=>`<div class="cart-line-sub">${escapeHtml(d.customerName)} — ${money(d.balance)} was due ${new Date(d.dueDate).toLocaleDateString("en-NG",{day:"2-digit",month:"short",year:"numeric"})}</div>`);
  html += section("💰 Outstanding Debts", debts, d=>`<div class="cart-line-sub">${escapeHtml(d.customerName)} owes ${money(d.balance)}</div>`);
  html += section("📦 Pending Collections", pendingAdv, a=>`<div class="cart-line-sub">${escapeHtml(a.customerName)} — ${escapeHtml(a.collectionStatus)}</div>`);
  if(!lowStock.length && !outStock.length && !debts.length && !pendingAdv.length) html += `<p style="color:var(--ink-soft);font-size:13px">You're all caught up. No alerts right now.</p>`;
  html += `</div><div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">Close</button></div>`;
  openModal(html);
}

/* ------------------------------------------------------------------
   13. FORMAT HELPERS
------------------------------------------------------------------ */
function money(n){ return (state.settings.currency||"₦") + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtQty(n){ n=Number(n||0); return Number.isInteger(n) ? n : n.toFixed(2).replace(/\.00$/,""); }
function fmtDate(ts){ return new Date(ts).toLocaleString("en-NG", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }); }
function todayStr(){ return new Date().toDateString(); }
// Local-time date helpers. (toISOString() is UTC, so between midnight and 1am in Nigeria it
// returned YESTERDAY, which broke "today" in reports, stock dates and date pickers.)
function localDateStr(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseLocalDate(str, endOfDay){
  if(!str) return null;
  const [y,m,d] = String(str).split("-").map(Number);
  if(!y || !m || !d) return null;
  return endOfDay ? new Date(y,m-1,d,23,59,59,999).getTime() : new Date(y,m-1,d,0,0,0,0).getTime();
}
// Revenue / cost / profit of one sale. Cost is per STOCK unit, so it must be multiplied by the quantity in
// stock units (qtyInStockUnit) — not by the units sold (e.g. 3 Cups) — and discounts and returns are taken off.
function saleFinancials(s){
  const items = s.items || [];
  let revenue = 0, cost = 0;
  items.forEach(i=>{
    const stockQty = i.qtyInStockUnit!=null ? i.qtyInStockUnit : i.qtySold;
    revenue += (i.unitPrice||0) * (i.qtySold||0);
    cost += (i.unitCost||0) * (stockQty||0);
  });
  revenue -= Math.min(s.discount||0, revenue);
  saleReturnsFor(s.id).forEach(r=> (r.items||[]).forEach(ri=>{
    const line = items.find(i=>i.productName===ri.productName && i.unit===ri.unit);
    const perUnitStock = (line && line.qtySold>0 && line.qtyInStockUnit!=null) ? line.qtyInStockUnit/line.qtySold : 1;
    revenue -= (ri.refundAmount||0);
    if(line) cost -= (line.unitCost||0) * perUnitStock * (ri.qty||0);
  }));
  return { revenue:r2(revenue), cost:r2(cost), profit:r2(revenue-cost) };
}
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ------------------------------------------------------------------
   14. DASHBOARD
------------------------------------------------------------------ */
function renderDashboard(){
  const sales = state.sales;
  const today = sales.filter(s=> new Date(s.createdAt).toDateString() === todayStr());
  const weekAgo = Date.now() - 7*86400000, monthAgo = Date.now() - 30*86400000;
  const weekSales = sales.filter(s=> s.createdAt >= weekAgo);
  const monthSales = sales.filter(s=> s.createdAt >= monthAgo);
  const sum = (arr,f)=> arr.reduce((a,s)=>a+f(s),0);
  const todaySalesTotal = sum(today, s=>s.total);
  const todayProfit = sum(today, s=> saleFinancials(s).profit);
  const stockValue = state.products.reduce((a,p)=> a + p.currentStock * (p.costPrice||0), 0);
  const lowStock = state.products.filter(p=>p.currentStock<=p.minStock);
  const debtors = state.debts.filter(d=>d.balance>0);
  const advances = state.advances.filter(a=>a.collectionStatus!=="Fully Collected");
  const needsPricing = state.products.filter(p=>p.needsPricing).length;
  // Currency totals for receivables — counts alone ("Debtors: 3") don't
  // answer "how much money am I actually owed right now", so these are
  // shown alongside the existing count-based cards, none of which are removed.
  const totalDebtOwed = state.debts.reduce((a,d)=>a+Math.max(0,d.balance||0),0);
  const overdueDebts = state.debts.filter(isDebtOverdue);
  const totalStoreCredit = state.advances.reduce((a,adv)=>a+Math.max(0,adv.creditBalance||0),0);

  const cards = [
    {lbl:"Today's Sales", val:money(todaySalesTotal), ic:"💰", bg:"var(--brand-light)", fg:"var(--brand-dark)"},
    {lbl:"Today's Profit", val:money(todayProfit), ic:"📈", bg:"var(--ok-light)", fg:"var(--ok)"},
    {lbl:"Weekly Sales", val:money(sum(weekSales,s=>s.total)), ic:"🗓️", bg:"var(--info-light)", fg:"var(--info)"},
    {lbl:"Monthly Sales", val:money(sum(monthSales,s=>s.total)), ic:"📆", bg:"var(--gold-light)", fg:"var(--warn)"},
    {lbl:"Stock Value", val:money(stockValue), ic:"🏬", bg:"var(--brand-light)", fg:"var(--brand-dark)"},
    {lbl:"Total Products", val:state.products.length, ic:"📦", bg:"var(--info-light)", fg:"var(--info)"},
    {lbl:"Customers", val:state.customers.length, ic:"👥", bg:"var(--ok-light)", fg:"var(--ok)"},
    {lbl:"Debtors", val:debtors.length, ic:"🧾", bg:"var(--danger-light)", fg:"var(--danger)"},
    {lbl:"Total Owed by Debtors", val:money(totalDebtOwed), ic:"📕", bg:"var(--danger-light)", fg:"var(--danger)"},
    {lbl:"Overdue Debts", val:overdueDebts.length, ic:"⏰", bg:"var(--danger-light)", fg:"var(--danger)"},
    {lbl:"Advance Payments", val:advances.length, ic:"💳", bg:"var(--gold-light)", fg:"var(--warn)"},
    {lbl:"Store Credit Owed", val:money(totalStoreCredit), ic:"🎟️", bg:"var(--gold-light)", fg:"var(--warn)"},
