// Admin-only: edit a staff member's name, role, or active status from the
// Manage Staff card in Settings. Writes straight to their existing cloud
// profile (users/{uid}) so the change applies everywhere immediately —
// see the note below for the one case this can't do yet.
window.openEditStaffModal = async function(username){
  const record = await effectiveStaffRecord(username);
  if(!record){ toast("Staff record not found","err"); return; }
  const canEdit = !!record.uid;
  openModal(`<div class="modal-head"><h3>Edit Staff — ${escapeHtml(record.username)}</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">
    ${canEdit ? "" : `<p style="font-size:12.5px;background:var(--warn-light);color:var(--warn);border-radius:8px;padding:9px 12px;margin-bottom:12px">
      This account hasn't signed in yet, so there's no cloud profile for it to edit — the app can't reliably save a change for them until then. Ask them to log in once first, then edit their details here.</p>`}
    <div class="field"><label>Full Name</label><input id="esName" value="${escapeHtml(record.name)}" ${canEdit?"":"disabled"}></div>
    <div class="field"><label>Role</label><select id="esRole" ${canEdit?"":"disabled"}>
      <option value="admin" ${record.role==="admin"?"selected":""}>Admin</option>
      <option value="sales" ${record.role==="sales"?"selected":""}>Sales</option>
    </select></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);margin-top:10px">
      <span>Account Active</span><label class="switch"><input type="checkbox" id="esActive" ${record.active!==false?"checked":""} ${canEdit?"":"disabled"}><span class="slider"></span></label>
    </div>
    ${canEdit ? `
    <div class="section-head" style="margin-top:16px"><h3 style="font-size:13px">Reset Password</h3></div>
    <p style="font-size:11.5px;color:var(--ink-soft)">Sets a new password right away for offline sign-in. Making it work for their online sign-in too needs one more step, shown after you reset it.</p>
    <div class="field"><label>New Password</label><input type="password" id="esNewPass" autocomplete="new-password"></div>
    <div class="field"><label>Confirm New Password</label><input type="password" id="esConfirmPass" autocomplete="new-password"></div>
    <p id="esPassError" style="display:none;color:var(--danger);font-size:12px;margin-top:4px"></p>
    <button class="btn btn-ghost btn-sm" id="esResetPass" style="margin-top:6px">Reset Password</button>
    ` : ""}
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">${canEdit?"Cancel":"Close"}</button>
  ${canEdit?`<button class="btn btn-primary" id="esSave">Save</button>`:""}</div>`);
  if(!canEdit) return;
  document.getElementById("esSave").addEventListener("click", async ()=>{
    const name = document.getElementById("esName").value.trim();
    const role = document.getElementById("esRole").value;
    const active = document.getElementById("esActive").checked;
    if(!name){ toast("Name is required","err"); return; }
    const updated = { id:record.id, uid:record.uid, username:record.username, name, role, active, passwordHash:null, updatedAt:Date.now() };
    try{
      const cached = (await idbGetAll("users")).find(u=>u.username===username);
      const base = USERS.find(x=>x.username===username);
      updated.passwordHash = (cached && cached.passwordHash) || (base && base.passwordHash) || null;
    }catch(e){ console.warn("[Staff] Could not read cached password hash.", e); }
    try{
      const { doc, setDoc } = firestoreApi;
      await setDoc(doc(fbDb, "users", record.uid), updated);
    }catch(err){
      toast("Could not save — check your connection and Firestore rules for the users collection.","err");
      return;
    }
    try{ await idbPut("users", updated); }catch(e){ console.warn("[Staff] Could not cache locally.", e); }
    closeModal(); toast(active===false?"Account deactivated":"Staff record updated","ok"); renderSettings();
  });
  // Resetting a password only ever updates the profile's stored hash —
  // it deliberately never touches Firebase Auth itself, since that would
  // require capabilities (an Admin SDK / backend) this app doesn't have.
  // See the follow-up dialog below for exactly what that means in practice.
  document.getElementById("esResetPass").addEventListener("click", async ()=>{
    const newPass = document.getElementById("esNewPass").value;
    const confirmPass = document.getElementById("esConfirmPass").value;
    const errEl = document.getElementById("esPassError");
    errEl.style.display = "none";
    if(!newPass || newPass.length < 6){ errEl.textContent = "New password should be at least 6 characters."; errEl.style.display = "block"; return; }
    if(newPass !== confirmPass){ errEl.textContent = "Passwords don't match."; errEl.style.display = "block"; return; }
    const btn = document.getElementById("esResetPass");
    btn.disabled = true; btn.textContent = "Resetting…";
    const newHash = await sha256Hex(newPass);
    let updatedProfile;
    try{
      const cached = (await idbGetAll("users")).find(u=>u.username===username) || {};
      updatedProfile = { id:record.id, uid:record.uid, username:record.username,
        name: cached.name || record.name, role: cached.role || record.role,
        active: typeof cached.active === "boolean" ? cached.active : record.active,
        passwordHash: newHash, updatedAt: Date.now() };
      const { doc, setDoc } = firestoreApi;
      await setDoc(doc(fbDb, "users", record.uid), updatedProfile);
    }catch(err){
      btn.disabled = false; btn.textContent = "Reset Password";
      errEl.textContent = "Could not save — check your connection."; errEl.style.display = "block";
      return;
    }
    try{ await idbPut("users", updatedProfile); }catch(e){ console.warn("[Staff] Could not cache locally.", e); }
    closeModal();
    toast(`Password reset for ${record.name} — they can sign in offline right away.`, "ok");
    const email = usernameToAuthEmail(record.username);
    openModal(`<div class="modal-head"><h3>One More Step for Online Sign-In</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="font-size:13.5px">${escapeHtml(record.name)} can already sign in <b>offline</b> with the new password.</p>
      <p style="font-size:13.5px;margin-top:10px">To let them sign in <b>online</b> too, Firebase itself needs their old sign-in removed first — this app genuinely can't do that part automatically. In the Firebase Console:</p>
      <ol style="font-size:13.5px;padding-left:20px;margin-top:8px;color:var(--ink-soft)">
        <li>Go to <b>Authentication → Users</b></li>
        <li>Find <span class="mono">${escapeHtml(email)}</span></li>
        <li>Delete that entry</li>
      </ol>
      <p style="font-size:13.5px;margin-top:10px">Their very next online login will then create a fresh account automatically using the new password — no further steps needed after that.</p>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="window.__closeModal()">Got it</button></div>`);
  });
};


// Self-service password change, available to any signed-in role from the
// "My Account" card in Settings. See changeMyPassword() for why this
// requires an active internet connection.
function openChangePasswordModal(){
  openModal(`<div class="modal-head"><h3>Change My Password</h3><button class="close-x" onclick="window.__closeModal()">✕</button></div>
  <div class="modal-body">
    <div class="field"><label>Current Password</label><input type="password" id="cpCurrent" autocomplete="current-password"></div>
    <div class="field"><label>New Password</label><input type="password" id="cpNew" autocomplete="new-password"></div>
    <div class="field"><label>Confirm New Password</label><input type="password" id="cpConfirm" autocomplete="new-password"></div>
    <p id="cpError" style="display:none;color:var(--danger);font-size:12.5px;margin-top:6px"></p>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost" onclick="window.__closeModal()">Cancel</button>
  <button class="btn btn-primary" id="cpSave">Update Password</button></div>`);
  const showErr = (msg)=>{ const el = document.getElementById("cpError"); el.textContent = msg; el.style.display = "block"; };
  document.getElementById("cpSave").addEventListener("click", async ()=>{
    const current = document.getElementById("cpCurrent").value;
    const next = document.getElementById("cpNew").value;
    const confirm = document.getElementById("cpConfirm").value;
    if(!current || !next){ showErr("Fill in both your current and new password."); return; }
    if(next.length < 6){ showErr("New password should be at least 6 characters."); return; }
    if(next !== confirm){ showErr("New password and confirmation don't match."); return; }
    const btn = document.getElementById("cpSave");
    btn.disabled = true; btn.textContent = "Updating…";
    const result = await changeMyPassword(current, next);
    btn.disabled = false; btn.textContent = "Update Password";
    if(result.ok){ closeModal(); toast("Password updated","ok"); return; }
    if(result.reason === "wrong_current") showErr("Your current password is incorrect.");
    else if(result.reason === "unavailable") showErr("You need to be online and signed in via the cloud to change your password.");
    else showErr("Something went wrong — please try again.");
  });
}

</script>
<script>
// Register service worker so the app can be installed and used offline.
// This is additive only — it does not read, write, or interfere with any app data.
// Note: browsers (Chrome included) require the service worker script to be
// fetched from a real same-origin URL — a Blob URL is rejected outright.
// So this points to a real file, sw.js, that sits next to index.html.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
